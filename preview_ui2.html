<style>
  :root{--red:#D5001C;--red2:#e2231a;--ink:#0f1219;--muted:#5b6472;--line:#eceef2;--blue:#1d6fb8;--navy:#1f348f;--bg:#f5f6f8}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Cairo','Segoe UI',Tahoma,system-ui,sans-serif;background:#e9ebef;color:var(--ink);min-height:100vh}
  .top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .top h1{font-size:15px;font-weight:900}.top .s{font-size:11px;color:var(--muted);font-weight:700}
  .tabs{display:flex;gap:6px;margin-inline-start:auto;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font:800 12.5px inherit;font-family:inherit;cursor:pointer;color:var(--ink)}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .stage{display:flex;justify-content:center;padding:18px 12px 40px}
  .phone{width:390px;max-width:100%;height:800px;max-height:calc(100vh - 110px);min-height:640px;background:var(--bg);border-radius:38px;overflow:hidden;position:relative;box-shadow:0 0 0 10px #111,0 30px 60px rgba(0,0,0,.25)}
  @media (max-width:480px){.stage{padding:0}.phone{width:100%;height:calc(100vh - 100px);max-height:none;border-radius:0;box-shadow:none}}
  .pane{display:none;position:absolute;inset:0}.pane.on{display:block}
  .note{max-width:820px;margin:0 auto 26px;padding:0 16px;font-size:13px;color:#374151;font-weight:600;line-height:1.9}
  .note b{color:var(--ink)} .note li{margin-inline-start:18px}
  .replay{position:absolute;top:12px;left:12px;z-index:30;border:0;background:rgba(15,18,25,.85);color:#fff;border-radius:999px;padding:8px 14px;font:800 12px inherit;font-family:inherit;cursor:pointer}

  /* ══════════ ① الإنترو ══════════ */
  .intro{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 38%,#fff 0%,#fff 46%,#fdf1f2 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;z-index:10}
  .intro .halo{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(213,0,28,.10) 0%,rgba(213,0,28,0) 60%);top:50%;left:50%;transform:translate(-50%,-62%) scale(.4);opacity:0}
  .lens{width:132px;height:132px;position:relative}
  .lens svg{width:100%;height:100%;overflow:visible}
  .ring{fill:none;stroke:#111;stroke-width:13;stroke-dasharray:290;stroke-dashoffset:290;transform-origin:60px 60px;transform:rotate(-90deg)}
  .iris{transform-origin:60px 60px;transform:scale(0)}
  .pupil{transform-origin:60px 60px}
  .glint{transform-origin:47px 47px;transform:scale(0)}
  .rec{opacity:0}
  .word{display:flex;gap:1px;direction:ltr;margin-top:18px;font-family:'Segoe UI',Arial,sans-serif;font-weight:900;font-size:40px;letter-spacing:1px;color:#111}
  .word span{display:inline-block;opacity:0;transform:translateY(18px)}
  .sub{direction:ltr;display:flex;align-items:center;gap:10px;margin-top:2px;font-family:'Segoe UI',Arial,sans-serif;font-weight:700;font-size:15px;letter-spacing:5px;color:#222;opacity:0}
  .sub i{display:block;height:2px;width:0;background:#222}
  .tag{margin-top:14px;font-size:12.5px;font-weight:800;color:var(--muted);opacity:0;transform:translateY(6px)}
  .tag b{color:var(--red)}
  .status{position:absolute;bottom:58px;font-size:11.5px;font-weight:700;color:#9aa1ad;opacity:0}
  .bar{position:absolute;bottom:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--red),#ff5a6e)}
  .play .ring{animation:draw .7s cubic-bezier(.6,0,.2,1) .05s forwards}
  .play .iris{animation:pop .55s cubic-bezier(.3,1.6,.5,1) .5s forwards}
  .play .pupil{animation:focus .7s ease-out .75s both}
  .play .glint{animation:pop .35s cubic-bezier(.3,1.8,.5,1) 1.05s forwards}
  .play .rec{animation:rec .9s steps(1) 1.15s forwards}
  .play .halo{animation:halo 1.6s ease-out .5s forwards}
  .play .word span{animation:up .45s cubic-bezier(.2,.9,.3,1.2) forwards}
  .play .sub{animation:fade .4s ease 1.75s forwards}.play .sub i{animation:grow .5s ease 1.8s forwards}
  .play .tag{animation:fadeup .45s ease 2.05s forwards}
  .play .status{animation:fade .4s ease 1.2s forwards}
  .play .bar{animation:load 2.9s cubic-bezier(.4,0,.2,1) .1s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{to{transform:scale(1)}}
  @keyframes focus{0%{transform:scale(1.55)}60%{transform:scale(.88)}100%{transform:scale(1)}}
  @keyframes rec{0%{opacity:1}25%{opacity:0}50%{opacity:1}75%{opacity:.25}100%{opacity:1}}
  @keyframes halo{to{opacity:1;transform:translate(-50%,-62%) scale(1)}}
  @keyframes up{to{opacity:1;transform:none}}
  @keyframes fade{to{opacity:1}} @keyframes grow{to{width:34px}}
  @keyframes fadeup{to{opacity:1;transform:none}}
  @keyframes load{0%{width:0}70%{width:78%}100%{width:100%}}
  /* الانتقال: العدسة «تفتح» على التطبيق — دائرة تتّسع من مركز القزحية */
  .reveal{position:absolute;inset:0;z-index:20;clip-path:circle(0 at 50% 41%);pointer-events:none}
  .reveal.go{animation:iris 0.85s cubic-bezier(.7,0,.2,1) forwards;pointer-events:auto}
  @keyframes iris{to{clip-path:circle(150% at 50% 41%)}}
  @media (prefers-reduced-motion:reduce){.play *{animation-duration:.01s!important;animation-delay:0s!important}.reveal.go{animation-duration:.01s}}

  /* ══════════ ② الرئيسية ══════════ */
  .home{position:absolute;inset:0;overflow-y:auto;background:var(--bg);padding-bottom:110px;scrollbar-width:none}
  .home::-webkit-scrollbar{display:none}
  .hb{display:flex;align-items:center;gap:10px;padding:16px 16px 6px}
  .ic{width:42px;height:42px;border-radius:14px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;position:relative;flex:0 0 auto}
  .ic svg{width:20px;height:20px;stroke:#111;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .ic .cnt{position:absolute;top:-5px;left:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:900;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
  .hello{flex:1;min-width:0}.hello .h{font-size:17px;font-weight:900;line-height:1.3}.hello .b{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;color:var(--muted)}

  .mini-lens{width:42px;height:42px;flex:0 0 auto}
  .hero{margin:12px 16px 0;border-radius:24px;padding:18px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,#14171f 0%,#1d1f2a 45%,#4a0912 100%);box-shadow:0 14px 30px rgba(74,9,18,.25)}

  .hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;left:-60px;bottom:-110px;border:26px solid rgba(255,255,255,.04)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hero>*{position:relative;z-index:1}
  .hero .k{font-size:12px;font-weight:800;color:rgba(255,255,255,.65)}
  .hero .v{font-size:34px;font-weight:900;direction:ltr;text-align:right;line-height:1.25;margin-top:2px}
  .hero .meta{font-size:12px;font-weight:700;color:rgba(255,255,255,.7)}
  .spark{display:flex;align-items:flex-end;gap:5px;height:44px;margin-top:12px}
  .spark i{flex:1;border-radius:5px 5px 2px 2px;background:rgba(255,255,255,.18);height:10%;transition:height .8s cubic-bezier(.3,1.3,.5,1)}
  .spark i.t{background:linear-gradient(180deg,#ff5a6e,var(--red))}
  .chips{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:800}
  .chip b{color:#ffb4bd}
  .sec{display:flex;align-items:center;justify-content:space-between;margin:22px 16px 10px}
  .sec h2{font-size:15.5px;font-weight:900}.sec a{font-size:12px;font-weight:800;color:var(--red);text-decoration:none}
  .qa{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:0 12px}
  .q{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:#1f2937;background:none;border:0;font-family:inherit;cursor:pointer}
  .q .o{width:56px;height:56px;border-radius:19px;background:#fff;display:grid;place-items:center;box-shadow:0 3px 12px rgba(15,18,25,.06),0 0 0 1px rgba(15,18,25,.04);transition:transform .15s}
  .q:active .o{transform:scale(.92)}
  .q .o svg{width:23px;height:23px;stroke:var(--red);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .q.p .o{background:linear-gradient(145deg,#ff2a44,var(--red));box-shadow:0 8px 18px rgba(213,0,28,.35)}.q.p .o svg{stroke:#fff}
  .tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px}
  .t{background:#fff;border-radius:18px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:12px;font-weight:800;line-height:1.35;position:relative;box-shadow:0 2px 8px rgba(15,18,25,.04),0 0 0 1px rgba(15,18,25,.035)}
  .t .o{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
  .t .o svg{width:21px;height:21px;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .t .new{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;font-size:9.5px;font-weight:900;border-radius:999px;padding:1px 7px}
  .c-red{background:#fff1f2}.c-red svg{stroke:var(--red)} .c-blue{background:#eef4ff}.c-blue svg{stroke:#2563eb}
  .c-green{background:#ecfdf3}.c-green svg{stroke:#15803d} .c-amber{background:#fff7e6}.c-amber svg{stroke:#b45309}
  .c-violet{background:#f4f0ff}.c-violet svg{stroke:#6d28d9} .c-ink{background:#f1f2f4}.c-ink svg{stroke:#111}
  .nav{position:absolute;bottom:14px;left:14px;right:14px;height:66px;border-radius:22px;background:rgba(15,18,25,.94);display:flex;align-items:center;justify-content:space-around;z-index:5;box-shadow:0 12px 30px rgba(15,18,25,.3)}

  .fadein>*{opacity:0;transform:translateY(10px);animation:fadeup .5s ease forwards}

  /* ══════════ ③ الهيدرات المتحرّكة ══════════ */
  .hdr-scroll{position:absolute;inset:0;overflow-y:auto;background:var(--bg);scrollbar-width:none}

  .ah .hi{width:calc(36px + 20px * var(--k,1));height:calc(36px + 20px * var(--k,1));border-radius:16px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;flex:0 0 auto}

  .ah .tt{font-size:calc(17px + 7px * var(--k,1));font-weight:900;line-height:1.2}
  .ah .ss{font-size:12px;font-weight:700;opacity:calc(var(--k,1) * .8);max-height:calc(20px * var(--k,1));overflow:hidden}
  .ah .bk{width:36px;height:36px;flex:0 0 auto;align-self:center;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center}
  .ah .bk svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round}
  .g-store{background:linear-gradient(135deg,#a50016 0%,#D5001C 55%,#ff4057 100%)}
  .g-pos{background:linear-gradient(135deg,#0f1219 0%,#232733 60%,#3c0a12 100%)}
  .g-inv{background:linear-gradient(135deg,#14246b 0%,#1f348f 55%,#3a63d8 100%)}
  .hsw{display:flex;gap:6px;justify-content:center;padding:12px}
  .hsw button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:800 12px inherit;font-family:inherit;cursor:pointer}

  .ph-card{background:#fff;border-radius:16px;margin:10px 16px;height:86px;box-shadow:0 0 0 1px rgba(15,18,25,.04)}
  .ph-card.s{height:140px}
</style>

    timers.forEach(clearTimeout); timers = [];
    var it = $('intro'), rv = $('reveal');
    it.classList.remove('play'); rv.classList.remove('go'); rv.innerHTML = '';
    void it.offsetWidth; it.classList.add('play');
    var st = $('status'), msgs = ['جارٍ تجهيز النظام…', 'تحميل المنتجات…', 'جاهز ✓'];
    st.textContent = msgs[0];
    timers.push(setTimeout(function () { st.textContent = msgs[1]; }, 1700));
    timers.push(setTimeout(function () { st.textContent = msgs[2]; }, 2600));
    timers.push(setTimeout(function () { rv.innerHTML = homeHTML(); rv.classList.add('go'); animateHome(rv); }, 3050));
  }
  $('replay').addEventListener('click', function () { show('intro'); });
  $('intro').addEventListener('click', function () { timers.forEach(clearTimeout); var rv = $('reveal'); if (!rv.classList.contains('go')) { rv.innerHTML = homeHTML(); rv.classList.add('go'); animateHome(rv); } });   // ضغطة = تخطٍّ

  /* ── ② الرئيسية ── */
  function homeHTML() {
    var tools = [['سجلّ المبيعات', 'chart', 'c-red'], ['تتبّع الشحنة', 'truck', 'c-blue'], ['إنشاء كفالة', 'shield', 'c-green'], ['عرض سعر', 'quote', 'c-amber', 1], ['الجرد', 'layers', 'c-violet'], ['أماكن الوصول', 'pin', 'c-ink']];
    return '<div class="home"><div class="fadein">'
      + '<div class="hb" style="animation-delay:.05s">' + LENS + '<div class="hello"><div class="h">صباح الخير، سامر 👋</div><span class="b"><i></i>فرع درعا · متّصل</span></div>'
      + '<div class="ic">' + svg('bell') + '<span class="cnt">3</span></div><div class="ic">' + svg('menu') + '</div></div>'
      + '<div class="hero" style="animation-delay:.12s"><div class="k">مبيعات فرعك اليوم</div><div class="v" data-count="1240">$0</div><div class="meta">9 فواتير · أعلى من أمس بـ <b style="color:#86efac">18٪</b></div>'
      + '<div class="spark">' + [38, 52, 30, 64, 47, 71, 86].map(function (h, i) { return '<i data-h="' + h + '"' + (i === 6 ? ' class="t"' : '') + '></i>'; }).join('') + '</div>'
      + '<div class="chips"><span class="chip">🔁 تحويل وارد <b>1</b></span><span class="chip">📦 طلبات معلّقة <b>9</b></span><span class="chip">⚠️ تحت الحدّ <b>4</b></span></div></div>'
      + '<div class="sec" style="animation-delay:.2s"><h2>إجراءات سريعة</h2></div>'
      + '<div class="qa" style="animation-delay:.25s">' + [['فاتورة', 'plus', 1], ['أوردر', 'box'], ['كفالة', 'shield'], ['مصروف', 'wallet'], ['عرض سعر', 'quote']].map(function (q) { return '<button class="q' + (q[2] ? ' p' : '') + '"><span class="o">' + svg(q[1]) + '</span>' + q[0] + '</button>'; }).join('') + '</div>'
      + '<div class="sec" style="animation-delay:.3s"><h2>أدواتي</h2><a href="#">تخصيص</a></div>'
      + '<div class="tools" style="animation-delay:.35s">' + tools.map(function (t) { return '<div class="t">' + (t[3] ? '<span class="new">جديد</span>' : '') + '<span class="o ' + t[2] + '">' + svg(t[1]) + '</span>' + t[0] + '</div>'; }).join('') + '</div>'
      + '</div></div>'
      + '<nav class="nav"><a class="on">' + svg('home') + 'الرئيسية</a><a>' + svg('pos') + 'نقطة البيع</a><span class="fab">' + svg('plus') + '</span><a>' + svg('list') + 'الأوردرات</a><a>' + svg('cube') + 'الجرد</a></nav>';
  }
  function animateHome(root) {
    var v = root.querySelector('[data-count]'); if (v) { var to = +v.dataset.count, t0 = performance.now(); (function step(t) { var k = Math.min(1, (t - t0) / 1100), e = 1 - Math.pow(1 - k, 3); v.textContent = '$' + Math.round(to * e).toLocaleString('en-US'); if (k < 1) requestAnimationFrame(step); })(t0); }
    setTimeout(function () { root.querySelectorAll('.spark i').forEach(function (b, i) { setTimeout(function () { b.style.height = b.dataset.h + '%'; }, i * 60); }); }, 350);
  }

  /* ── ③ الهيدرات ── */
  var BLADES = '<svg viewBox="-50 -50 100 100">' + Array.from({ length: 7 }, function (_, i) { return '<path transform="rotate(' + (i * 360 / 7) + ')" d="M0 -46 A46 46 0 0 1 40 -23 L8 -6 Z" fill="none" stroke="#fff" stroke-width="2.2"/>'; }).join('') + '<circle r="46" fill="none" stroke="#fff" stroke-width="2.2"/></svg>';
  var HDR = { store: ['g-store', 'المتجر الإلكتروني', '595 منتجاً · كانون والإضاءة والصوت', 'cart'], pos: ['g-pos', 'نقطة البيع', 'فرع درعا · الوردية الصباحية', 'pos'], inv: ['g-inv', 'الجرد', 'كلّ الفروع · آخر مزامنة قبل دقيقة', 'cube'] };
  var cur = 'store';
  function hdrHTML(k) {
    var h = HDR[k];
    return '<div class="hsw">' + Object.keys(HDR).map(function (x) { return '<button data-h="' + x + '" class="' + (x === k ? 'on' : '') + '">' + HDR[x][1] + '</button>'; }).join('') + '</div>'
      + '<div class="ah" id="ah"><div class="bg ' + h[0] + '"></div><div class="blades">' + BLADES + '</div><div class="blades2">' + BLADES + '</div><div class="sweep"></div>'
      + '<div class="row"><span class="bk">' + svg('back') + '</span><span class="hi">' + svg(h[3]) + '</span><div><div class="tt">' + h[1] + '</div><div class="ss">' + h[2] + '</div></div></div></div>'
      + '<div style="padding:8px 0 40px">' + '<div class="ph-card s"></div>' + Array.from({ length: 9 }, function () { return '<div class="ph-card"></div>'; }).join('') + '</div>';
  }
  function paintHdr() {
    var box = $('hdrs'); box.innerHTML = hdrHTML(cur);
    box.querySelectorAll('[data-h]').forEach(function (b) { b.addEventListener('click', function () { cur = b.dataset.h; paintHdr(); box.scrollTop = 0; }); });
    onScroll();
  }
  function onScroll() {   // الهيدر يتقلّص بنعومة من 168 إلى 72 مع النزول — العنوان يصغر والوصف يختفي
    var box = $('hdrs'), ah = $('ah'); if (!ah) return;
    var y = Math.max(0, box.scrollTop - 48), k = Math.max(0, 1 - y / 120);
    ah.style.setProperty('--h', Math.round(72 + 96 * k) + 'px'); ah.style.setProperty('--k', k.toFixed(3));
  }
  $('hdrs').addEventListener('scroll', onScroll, { passive: true });

  /* ── الشرح تحت كلّ جزء ── */
  var NOTES = {
    intro: '<b>① الإنترو:</b> مبنيّ من عناصر شعارنا نفسه بلا أيّ صورة جديدة: <ul><li>الحلقة السوداء تُرسم ⇐ القزحية الزرقاء «تركّز» مثل عدسة ⇐ اللمعة البيضاء ⇐ مربّع <b>REC</b> الأحمر يومض مرّتين.</li><li>تظهر GENERAL حرفاً حرفاً ثمّ MEDIA TECH بخطّيها ثمّ «الوكيل المعتمد لـCanon».</li><li>في الأسفل حالة التحميل الحقيقية وشريط أحمر رفيع.</li><li>الانتقال: <b>العدسة تنفتح</b> على التطبيق (دائرة تتّسع من مركز القزحية).</li><li>المدّة ~٣ ثوانٍ، وضغطة واحدة تتخطّاه، ويظهر مرّة واحدة بعد كلّ تحديث (مثل اليوم).</li></ul>',
    home: '<b>② الشاشة الرئيسية:</b><ul><li>ترحيب حسب الوقت + الفرع وحالة الاتصال.</li><li>بطاقة «اليوم» داكنة بلمسة الأحمر: المبيعات تعدّ تصاعدياً + أعمدة آخر ٧ أيام + ما ينتظرك (تحويل وارد · طلبات · تحت الحدّ) — كلّها من بيانات الفرع الحقيقية عند التطبيق.</li><li>الإجراءات السريعة بلا النقاط الحمراء الكثيرة (كانت على كلّ زرّ وتسبّب زحمة) — علامة «جديد» صغيرة فقط على الأداة الجديدة فعلاً (آخر ٧ أيام).</li><li>الأدوات بألوان هادئة لكلّ نوع، وشريط سفلي داكن عائم بزرّ «+» في الوسط.</li></ul>',
    hdr: '<b>③ الهيدرات المتحرّكة:</b><ul><li>رأس لكلّ قسم بلونه: المتجر أحمر · نقطة البيع داكن · الجرد أزرق الهوية.</li><li>في الخلفية <b>شفرات فتحة العدسة (Aperture)</b> تدور ببطء شديد + ومضة ضوء تمرّ كلّ بضع ثوانٍ — حركة هادئة لا تشتّت.</li><li>مع النزول يتقلّص الرأس بنعومة (العنوان يصغر والوصف يختفي) ليترك مساحة للمحتوى.</li><li>جرّب: اضغط الأزرار فوق للتبديل بين الثلاثة، وانزل داخل الشاشة.</li></ul>'
  };
  function show(tab) {
    document.querySelectorAll('.tab[data-tab]').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === tab); });
    $('replay').style.display = tab === 'intro' ? '' : 'none';
    ['intro', 'home', 'hdr'].forEach(function (t) { $('p-' + t).classList.toggle('on', t === tab); });
    $('note').innerHTML = NOTES[tab] + '<p style="margin-top:8px;color:#6b7280">إذا عجبك جزء قلّي «طبّق ①» أو «طبّق الكل» أو شو بدك يتغيّر.</p>';
    if (tab === 'intro') playIntro();
    if (tab === 'home') { $('p-home').innerHTML = homeHTML(); animateHome($('p-home')); }
    if (tab === 'hdr') paintHdr();
  }
  document.querySelectorAll('.tab[data-tab]').forEach(function (b) { b.addEventListener('click', function () { show(b.dataset.tab); }); });
  var q = (location.hash || '').replace('#', ''); show(NOTES[q] ? q : 'intro');
})();
</script>
</body>
</html>
