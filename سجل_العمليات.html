<!-- (١١ ت١ — Notes ٩ ت١ ٦:٤٧ ص) «ضيف شي غير التراجع هو السجل — سجل العمليات بيسجل شو انشغل».
     كل كتابةٍ ناجحة على الجداول المهمّة (أوردرات · فواتير · مصاريف · مستخدمون · صلاحيات · قفل الأوردرات…) وكل دخول/خروج أدمن
     تُسجَّل في gmt_audit (إضافة وقراءة فقط) بفاعلها: الأدمن باسمه أو الموظّف. للإدارة وحدها (حارس الصفحات). -->
<style>
body{margin:0;background:radial-gradient(900px 400px at 100% -10%,#ffe3e6 0,transparent 60%),#f7f8fa;color:#0f1219;font:15px/1.7 'Segoe UI',Tahoma,system-ui,sans-serif;background-repeat:no-repeat;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:18px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.top h1{margin:0;font-size:20px;flex:1}
.card{background:#fff;border:1px solid rgba(15,18,25,.08);border-radius:22px;padding:14px 16px;box-shadow:0 1px 2px rgba(15,18,25,.05),0 10px 30px rgba(15,18,25,.06)}
.sub{color:#5b6472;font-size:12.5px;margin:0 0 12px}
.btn{border:1px solid rgba(15,18,25,.1);background:#fff;border-radius:10px;padding:7px 12px;font:inherit;font-weight:700;cursor:pointer;color:inherit;text-decoration:none}
/* (TASK-0143) النظام فاتحٌ دائماً بهويّته — أُزيلت قاعدة الوضع الداكن للهاتف (طلب المالك 9 ت1 · seq 43) */ :root{color-scheme:light}
</style>

<div class="wrap">
  <div class="top"><a class="btn" href="home.html">→ الرئيسيّة</a><h1>سجل العمليات</h1></div>
  <p class="sub">من فعل ماذا ومتى وما الذي تغيّر — أوردرات · فواتير · مصاريف · مخزون · مستخدمون · دخول الأدمن. سجلٌّ للإضافة والقراءة فقط: لا يُعدَّل ولا يُحذف من الواجهة.</p>
  <div id="log" class="card"></div>
</div>
<script>
(function () {
  function go() { if (window.GMTOpLog) GMTOpLog.mount(document.getElementById('log'), {}); else setTimeout(go, 150); }
  go();
})();
</script>
