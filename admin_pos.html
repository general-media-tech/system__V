let __cancelTrBusy = false;
async function cancelStockTransferAdmin(id) {
  if (__cancelTrBusy) return;
  if (!await GMTAsk.confirm('هل أنت متأكد من إلغاء فاتورة النقل؟ ستُعاد الكميات **المنقولة فعلاً** إلى الفرع المُصدِّر.')) return;
  const t = allStockTransfersAdmin.find(x => String(x.id) === String(id));
  if (!t) return;
  __cancelTrBusy = true;
  /* (11 ت١ · T-09) الإلغاء كان بلا قفل ولا شرط حالة ⇒ ضغطتان (أو واجهة متقادمة بعد استلام الفرع) تُعيدان الكمية مرّتين فيتضخّم مخزون المصدر،
     ويُعاد ما **لم يُخصم أصلاً** (بند فاشل كميّته المطلوبة) فيتضخّم أيضاً. الآن: قفل ذرّي بحالة انتقالية، وإعادة **المنقول فعلاً** فقط عبر الوحدة
     المتحقَّقة، وتراجع كامل عند أول فشل بحيث لا تبقى فاتورة نصف مُعادة. */
  const prevStatus = (t.status === 'needs_settlement') ? 'needs_settlement' : 'pending';
  let claimed = false;
  const undoClaim = async () => { if (claimed) { try { await sb('PATCH', `/rest/v1/branch_stock_transfers?id=eq.${id}&status=eq.reopening`, { status: prevStatus }, { Prefer: 'return=minimal' }); } catch (_) {} } };
  try {
    const cl = await sb('PATCH', `/rest/v1/branch_stock_transfers?id=eq.${id}&status=in.(pending,needs_settlement)`, { status: 'reopening' }, { Prefer: 'return=representation' });
    const clr = Array.isArray(cl?.data) ? cl.data : (Array.isArray(cl) ? cl : []);
    if (clr.length !== 1) { showToast('⛔ حالة الفاتورة تغيّرت (استُلمت أو أُلغيت أو يجري تعديلها) — حدّث الصفحة. لم يُلمس المخزون', 'err'); try { await loadStockTransfersAdmin?.(); } catch (_) {} return; }
    claimed = true;

    const items = await sb('GET', `/rest/v1/stock_transfer_items?transfer_id=eq.${id}&select=*`);
    const noteNames = (String(t.note || '').match(/تعذّر خصم\s*\d+\s*صنف\s*:\s*(.+)$/) || [, ''])[1].split(/[،,]\s*/).map(x => x.trim()).filter(Boolean);
    const movedOf = (it) => {
      const noReq = (it.requested_qty == null || it.requested_qty === '');
      if (noReq && noteNames.indexOf(String(it.product_name || '').trim()) >= 0) return 0;      // فاشل قديم: لم يُخصم منه شيء
      return Number(it.qty) || 0;
    };
    const done = [], restoreFails = [];
    for (const it of items) {
      const q = movedOf(it); if (q <= 0) continue;
      let ok = false, err = '';
      try {
        if (window.GMTStock && GMTStock.move) { const mv = await GMTStock.move('add', it.product_id, t.from_branch, q); ok = !!(mv && mv.ok); err = mv && mv.error; }
        else { await sb('POST', '/rest/v1/rpc/add_branch_stock', { p_product_id: it.product_id, p_branch_key: t.from_branch, p_qty: q }); ok = true; }
      } catch (e) { err = (e && e.message) || String(e); }
      if (!ok) { restoreFails.push({ name: it.product_name, err }); break; }
      done.push({ pid: it.product_id, q });
    }
    if (restoreFails.length) {
      for (const d of done) { try { if (window.GMTStock && GMTStock.move) await GMTStock.move('deduct', d.pid, t.from_branch, d.q); } catch (_) {} }   // تراجع عمّا أُعيد
      await undoClaim(); claimed = false;
      try { if (window.GMTWarden && GMTWarden.flag) GMTWarden.flag({ kind:'financial', severity:'critical', feature:'ADMIN-TRANSFER', rule:'OWN-STOCK-TRUTH',
        title:'تعذّر إلغاء فاتورة نقل', what:'الفاتورة ' + id + ': ' + restoreFails[0].name + ' — ' + restoreFails[0].err, how:'فشلت إعادة الكمية للمصدر', why:'تراجع كامل؛ الفاتورة كما كانت.' }); } catch (_) {}
      await GMTAsk.alert('تعذّرت إعادة «' + restoreFails[0].name + '» إلى فرع ' + (t.from_branch_name || t.from_branch) + ' (' + (restoreFails[0].err || '') + ').\n\nلم يتغيّر شيء: عادت الفاتورة كما كانت وأُلغيت أيّ إعادة جزئية. عالج السبب ثم أعد المحاولة.', { title: 'تعذّر الإلغاء' });
      renderStockTransfersAdmin();
      return;
    }
    // العبور (للعرض فقط): يُنقَص بالمنقول، وفشله لا يمنع الإلغاء لكنّه يُبلَّغ
    const transitFails = [];
    for (const d of done) {
      try {
        const prod = await sb('GET', `/rest/v1/products?id=eq.${d.pid}&select=in_transit`);
        const cur = (prod[0] && prod[0].in_transit) || {};
        const newQty = Math.max(0, (Number(cur[t.to_branch]) || 0) - d.q);
        await sb('PATCH', `/rest/v1/products?id=eq.${d.pid}`, { in_transit: { ...cur, [t.to_branch]: newQty } }, { Prefer: 'return=minimal' });
      } catch (e) { transitFails.push(d.pid); }
    }
    if (transitFails.length) showToast('⚠️ أُعيدت الكميات لكن تعذّر تصفير العبور لـ' + transitFails.length + ' منتج (عرضٌ فقط) — راجعه', 'err');

    const fin = await sb('PATCH', `/rest/v1/branch_stock_transfers?id=eq.${id}&status=eq.reopening`, {
      status: 'cancelled', cancelled_at: new Date().toISOString(), cancelled_by: (window.GMTRole && GMTRole.name && GMTRole.name()) || 'الأدمن'
    }, { Prefer: 'return=representation' });
    const finr = Array.isArray(fin?.data) ? fin.data : (Array.isArray(fin) ? fin : []);
    claimed = false;
    if (finr.length !== 1) {
      await GMTAsk.alert('أُعيدت الكميات إلى المصدر لكن تعذّر ختم الفاتورة «مُلغاة».\n\n⛔ لا تضغط «إلغاء» مرّة أخرى — أبلغ الإدارة لتصحيح حالتها يدوياً.', { title: 'الحالة لم تُحدَّث' });
      renderStockTransfersAdmin(); return;
    }
    try { await GMTAudit?.log?.({ action: 'transfer_cancel', entity: 'branch_stock_transfers', entityId: String(id), entityName: t.transfer_number, reason: 'إلغاء إداري — أُعيد ' + done.length + ' صنف للمصدر' }); } catch (_) {}
    await sb('POST', '/rest/v1/branch_notifications', {
      branch_key: t.from_branch, type: 'transfer_cancelled', ref_id: id,
      message: `❌ تم إلغاء فاتورة النقل #${t.transfer_number} وإعادة الكمية لفرعك`
    });
    sendTelegram(`❌ <b>تم إلغاء فاتورة نقل مخزون</b>\n#${t.transfer_number}\n📤 ${t.from_branch_name} → 📥 ${t.to_branch_name}\nبواسطة الأدمن`);
    closeModal();
    showToast('تم إلغاء الفاتورة وإعادة الكمية المنقولة', 'ok');
    renderStockTransfersAdmin();
  } catch (e) {
    await undoClaim();
    showToast('خطأ: ' + e.message, 'err');
  } finally { __cancelTrBusy = false; }
}
window.cancelStockTransferAdmin = cancelStockTransferAdmin;

// تحديث الشارة بشكل دوري حتى لو المستخدم لم يفتح التاب
setInterval(() => { loadStockTransfersAdmin().catch(() => {}); }, 60000);

</script>
<script>
/* 🪦 (2026-10-03) أُزيلت من هنا كتلةٌ ميّتة:
       if (typeof GMTTour !== 'undefined' && typeof buildAdminTourSteps === 'function') …
       else console.warn('[gmt-tour] لم يتم تحميل gmt-tour.js — تأكد من رفعه…');

   و`buildAdminTourSteps` غير معرَّفة في المشروع كلّه ⇒ الشرط كاذبٌ دائماً، وأثرُ
   الكتلة الوحيد كان طباعة ذلك التحذير في كل تحميل. والتحذير **يَكذِب**: يطلب
   رفع `gmt-tour.js`، والجولة القديمة مُلغاةٌ بقرار المالك (TOUR-1) واستُبدلت
   بالنظام التعليمي الذي يُقلع وحده ويضبط `window._gmtTour` بنفسه.

   ⚠️ ولماذا بقيت حتى الآن؟ لأنّ معالجةً سابقة (ADM-1 · 2026-07-13) اكتشفت
   الشيء نفسه وأصلحت **الزرّ** وتركت هذه الكتلة ورسالتها. ترقيعُ الموضع لا
   يُنهي العطل. */

/* ═══ ADM-1 (2026-07-13) — أُغلق نهائياً ═══
   الزر كان ينادي restartTour() → _gmtTour → buildAdminTourSteps() **غير معرَّفة أصلاً**
   ⇒ «الجولة غير متاحة» دائماً. الجولة القديمة (gmt-tour) مُلغاة بقرارك (TOUR-1)،
   فالزر الآن يفتح **النظام التعليمي** (شاشات كاملة) مثل باقي الصفحات. */
window.restartTour = function () {
  try { localStorage.removeItem('tour_done_' + PAGE_ID); } catch (e) {}
  if (window.GMTGuide && typeof window.GMTGuide.open === 'function') { window.GMTGuide.open(); return; }
  if (window.GMTGuide && typeof window.GMTGuide.init === 'function') { window.GMTGuide.init(window.GMT_GUIDE_SPEC || {}, { splash: true }); return; }
  if (window._gmtTour) { window._gmtTour.start(); return; }
  alert('النظام التعليمي غير محمَّل — تأكد من رفع gmt-guide.js بجانب هذه الصفحة.');
};

  /* (٧ ط) كانت هنا: أوّل فتحٍ لأدمن النقاط يُطلق الشرائح بملء الشاشة وحدها، ثم في كل فتحٍ بعده لأنّ
     «tour_done» لا يُكتب. لا شيء يبدأ وحده — «؟ الشرح» في الشريط يفتح الدروس. */
  try { localStorage.setItem('gmt_onboarded_' + PAGE_ID, '1'); } catch(e) {}
</script>
<script>
/* ═══ م19: تغيير أسماء نقاط البيع — العرض فقط (display_name بجدول inv_columns) ═══ */
(function(){
  /* (٧ ط · «لا أزرار عائمة») كان زرّاً ثابتاً أسفل الشاشة فوق المحتوى — وحارس العائم يُخفيه فتضيع الميزة.
     الآن في الشريط العلويّ بجانب «الشرح» بنفس شكل أزراره. */
  const btn = document.createElement('button');
  btn.className = 'tb-help'; btn.id = 'tb-branch-names';
  btn.innerHTML = '🏷️ <span>أسماء النقاط</span>';
  btn.title = 'أسماء نقاط البيع — تغيير الاسم الظاهر فقط';
  btn.onclick = openBranchNames;
  const mount = () => {
    const h = document.querySelector('#topbar .tb-help');
    if (h && h.parentNode) h.parentNode.insertBefore(btn, h.nextSibling); else document.body.appendChild(btn);
  };
  if (document.readyState !== 'loading') mount(); else document.addEventListener('DOMContentLoaded', mount);

  async function openBranchNames(){
    const ov = document.createElement('div'); ov.id='bn-ov';
    ov.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px;';
    ov.innerHTML = '<div style="background:#fff;border-radius:16px;padding:20px;max-width:420px;width:100%;font-family:Cairo,Arial,sans-serif;direction:rtl;">'
      + '<div style="font-weight:900;font-size:15px;margin-bottom:4px;">🏷️ أسماء نقاط البيع</div>'
      + '<div style="font-size:11px;color:#5b6472;margin-bottom:12px;line-height:1.7;">تغيير الاسم الظاهر فقط (بالواجهات والفواتير) — مفاتيح الفروع وبياناتها لا تُمس إطلاقاً.</div>'
      + '<div id="bn-list" style="display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto;">جارٍ التحميل…</div>'
      + '<div style="display:flex;gap:8px;margin-top:14px;">'
      + '<button id="bn-save" style="flex:1;background:#D5001C;color:#fff;border:none;border-radius:10px;padding:11px;font-weight:900;font-family:inherit;cursor:pointer;">حفظ الأسماء</button>'
      + '<button id="bn-close" style="flex:1;background:#f3f4f6;color:#374151;border:none;border-radius:10px;padding:11px;font-weight:800;font-family:inherit;cursor:pointer;">إغلاق</button>'
      + '</div></div>';
    document.body.appendChild(ov);
    document.getElementById('bn-close').onclick = () => ov.remove();
    const H = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
    let rows = [];
    try {
      const r = await fetch(SB_URL + '/rest/v1/inv_columns?is_branch=eq.true&select=key_name,display_name&order=sort_order.asc', { headers: H });
      rows = await r.json();
      if (!Array.isArray(rows)) throw new Error(JSON.stringify(rows).slice(0,80));
    } catch (e) { document.getElementById('bn-list').textContent = 'تعذّر التحميل: ' + e.message; return; }
    document.getElementById('bn-list').innerHTML = rows.map(b =>
      '<div style="display:flex;align-items:center;gap:8px;"><code style="font-size:10px;color:#5b6472;flex-shrink:0;direction:ltr;">'+b.key_name+'</code>'
      + '<input data-bk="'+b.key_name+'" value="'+String(b.display_name||'').replace(/"/g,'&quot;')+'" style="flex:1;border:1.5px solid #e5e7eb;border-radius:9px;padding:9px 11px;font-family:inherit;font-size:13px;"></div>'
    ).join('') || '<div style="color:#5b6472;font-size:12px;">لا فروع بعد — تُنشأ من نظام الجرد.</div>';
    document.getElementById('bn-save').onclick = async () => {
      const inputs = Array.from(document.querySelectorAll('#bn-list [data-bk]'));
      let n = 0;
      for (const inp of inputs) {
        const orig = (rows.find(r => r.key_name === inp.dataset.bk) || {}).display_name || '';
        const v = inp.value.trim();
        if (v && v !== orig) {
          await fetch(SB_URL + '/rest/v1/inv_columns?key_name=eq.' + encodeURIComponent(inp.dataset.bk), { method:'PATCH', headers:H, body: JSON.stringify({ display_name: v }) });
          n++;
        }
      }
      alert(n ? ('✓ حُدِّث '+n+' — يظهر بكل الواجهات والفواتير') : 'لا تغييرات');
      ov.remove();
    };
  }
  window.openBranchNames = openBranchNames;
})();
</script>
