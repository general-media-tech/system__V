}

/* ══ ADM-4 (2026-07-13) — التصفير بدل الحذف ══════════════════════════════
   القديم كان ينفّذ DELETE فعلياً ⇒ **يضيع الأثر تماماً**: لا تعرف أن العمولة كانت
   موجودة، ولا من ألغاها، ولا لماذا. القرار المعتمد:
   • المبلغ = صفر  • السجل يبقى  • من صفّر + متى + **السبب إجباري**
   • الحذف الحقيقي أُلغي من الواجهة نهائياً (يبقى بالقاعدة للسيادي فقط). */
async function zeroComm(commId, invId) {
  const c = (allComm || []).find(x => String(x.id) === String(commId));
  const reason = await GMTAsk.prompt(
    '⚠️ تصفير العمولة (لا تُحذف — تبقى بالسجل بمبلغ صفر)\n\n'
    + (c ? `المبلغ الحالي: $${Number(c.amount || 0).toFixed(2)}\n\n` : '')
    + 'السبب (إجباري — يُحفظ ويظهر بالتقارير):'
  );
  if (reason === null) return;
  if (!reason.trim()) { showToast('⛔ السبب إجباري — لم يُصفَّر شيء', 'err'); return; }

  const who = (window.currentUser && (currentUser.display_name || currentUser.username)) || 'admin';
  const payload = {
    amount: 0,
    zeroed: true,
    zeroed_by: who,
    zeroed_at: new Date().toISOString(),
    zeroed_reason: reason.trim(),
    status: 'zeroed'
  };
  try {
    /* (٨ ت) عمولة الفاتورة صفوفٌ (صفٌّ لكل بند) — التصفير يشملها كلّها */
    const _zc = allComm.find(x => String(x.id) === String(commId));
    const _zIds = _zc ? invCommRows(_zc.invoice_id).filter(r => !r.paid).map(r => r.id) : [commId];
    if (!_zIds.some(z => String(z) === String(commId))) _zIds.push(commId);
    await sb('PATCH', `/rest/v1/invoice_commissions?id=in.(${_zIds.join(',')})`, payload, { Prefer: 'return=minimal' });
    // تحقّق فعلي بإعادة القراءة — لا نثق بنجاح الطلب وحده
    const v = await sb('GET', `/rest/v1/invoice_commissions?id=in.(${_zIds.join(',')})&select=id,amount,zeroed`);
    const vrs = Array.isArray(v) ? v : (Array.isArray(v?.data) ? v.data : (v ? [v] : []));
    if (!vrs.length || vrs.some(vr => Number(vr.amount) !== 0)) {
      showToast('⚠️ لم تُحفظ العملية فعلياً بالقاعدة — تحقق من صلاحيات RLS', 'err');
      return;
    }
    allComm.forEach((x, i) => { if (_zIds.some(z => String(z) === String(x.id))) allComm[i] = { ...allComm[i], ...payload }; });
    showToast('✅ صُفِّرت العمولة — السجل محفوظ مع السبب', 'ok');
    closeModal();
    if (activeTab === 'commissions') renderCommissions();
  } catch (e) { showToast('خطأ: ' + e.message, 'err'); }
}
// توافقية: أي استدعاء قديم لـ deleteComm يُحوَّل للتصفير — لا حذف بعد اليوم.
async function deleteComm(commId, invId) { return zeroComm(commId, invId); }

// COMMISSIONS SCREEN v3

// State - prefixed with _cv3_ to avoid conflicts
let _cv3_all      = [];
let _cv3_filtered = [];
let _cv3_page     = 1;
let _cv3_psize    = 20;
let _cv3_sel      = null;

const _cv3_$ = id => document.getElementById(id);
const _cv3_esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const _cv3_f2 = n => Number(n||0).toFixed(2);
const _cv3_fmtUSD = n => '$ ' + _cv3_f2(n);
/* 🔧 (2026-08-26) [OWN-SAFE-RATIO] كان الحارس `b ?` يمنع الصفر فقط لا السالب ⇒ فاتورة مرتجع
   (إجمالي سالب) تُظهر ربحاً سالباً كنسبة **موجبة** (−50 ÷ −200 = +25%). النسبة تُحسب فقط على أساس موجب. */
const _cv3_pct = (a,b) => (Number(b) > 0) ? '(' + (a/b*100).toFixed(1) + '%)' : '(—)';

function _cv3_itemProfit(it) {
  // صافي الربح = سعر المبيع الفعلي - سعر الشراء - العمولة
  const actual   = +it.actualPrice   || +it.actual_price   || 0;
  const purchase = +it.purchasePrice || +it.purchase_price || +it.cost_price || 0;
  const comm     = +it.commission    || 0;
  const qty      = +it.qty           || 1;
  return (actual - purchase - comm) * qty;
}
function _cv3_invComm(inv) {
  return (inv.items||[]).reduce((s,it) => s + (+it.commission||0) * (+it.qty||1), 0);
}
function _cv3_invActual(inv) {
  return (inv.items||[]).reduce((s,it) => s + (+it.actualPrice||+it.actual_price||0) * (+it.qty||1), 0);
}
function _cv3_invProfit(inv) {
  return (inv.items||[]).reduce((s,it) => s + _cv3_itemProfit(it), 0);
}
function _cv3_invWholesale(inv) {
  return (inv.items||[]).reduce((s,it) => s + (+it.wholesalePrice||+it.wholesale_price||0) * (+it.qty||1), 0);
}

function _cv3_rowCls(inv) {
  const a = _cv3_invActual(inv);
  const w = (inv.items||[]).reduce((s,it)=>s+(+it.wholesalePrice||0)*(+it.qty||1),0);
  const s = (inv.items||[]).reduce((s2,it)=>s2+(+it.salePrice||0)*(+it.qty||1),0);
  if (a < w) return 'rc-r'; if (a < s) return 'rc-o'; if (a <= s*1.02) return 'rc-y'; if (a <= s*1.12) return 'rc-g'; return 'rc-dg';
}
function _cv3_prodRowCls(it) {
  const a=+it.actualPrice||0,w=+it.wholesalePrice||0,s=+it.salePrice||0;
  if(a<w)return 'pr-r'; if(a<s)return 'pr-o'; if(a<=s*1.02)return 'pr-y'; if(a<=s*1.12)return 'pr-g'; return 'pr-dg';
}

          ${inv.status!=='approved'?`<button onclick="_cv3_approve('${inv.id}');event.stopPropagation();" style="width:100%;background:#15803d;color:white;border:none;border-radius:10px;padding:10px;font-family:'Cairo',sans-serif;font-size:12px;font-weight:800;cursor:pointer;margin-top:8px;">✅ موافقة على العمولة</button>`:''}

    const rc=_cv3_rowCls(inv), isSel=_cv3_sel&&_cv3_sel.id===inv.id?' sel':'';
    const badge = inv.status==='approved'
      ? `<span class="badge-approved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>موافقة</span>`
      : `<span class="badge-pending"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>معلقة</span>`;
    return `<tr class="${rc}${isSel}" onclick="_cv3_selInv('${inv.id}')">
      <td>${start+i+1}</td>

function _cv3_renderPag() {
  const total = Math.max(1, Math.ceil(_cv3_filtered.length/_cv3_psize));
  const ctrl  = _cv3_$('cv3-pag-btns');
  if (!ctrl) return;
  let h = `<button class="pb" onclick="_cv3_goPage(${_cv3_page-1})" ${_cv3_page<=1?'disabled':''}>›</button>`;
  for (let p=1;p<=total;p++) {
    if(p===1||p===total||(p>=_cv3_page-1&&p<=_cv3_page+1)) h+=`<button class="pb ${p===_cv3_page?'act':''}" onclick="_cv3_goPage(${p})">${p}</button>`;
    else if(h.slice(-5)!=='…</sp') h+=`<span style="padding:0 3px;color:#5b6472;font-size:11px;">…</span>`;
  }
  h+=`<button class="pb" onclick="_cv3_goPage(${_cv3_page+1})" ${_cv3_page>=total?'disabled':''}>‹</button>`;
  ctrl.innerHTML = h;
}

function _cv3_goPage(p) {
  const t=Math.ceil(_cv3_filtered.length/_cv3_psize);
  if(p<1||p>t)return; _cv3_page=p; _cv3_renderTable();
}

function _cv3_selInv(id) {

  set('cv3-inv-num', '#'+(inv.inv_number||inv.number||'000000'));

  set('cv3-d-type',     inv.sale_type||inv.saleType||'--');
  set('cv3-d-branch',   b?.display_name||inv.branch_key||'--');
  set('cv3-d-currency', 'دولار أمريكي');
  const noteEl = _cv3_$('cv3-notes-ta');
  if (noteEl) noteEl.value = inv.note||'';
  _cv3_renderProds(); _cv3_refreshSummary();
}

function _cv3_renderProds() {
  if (!_cv3_sel) return;
  const items = _cv3_sel.items||[];
  const tbody = _cv3_$('cv3-prod-tbody');
  if (!tbody) return;
  tbody.innerHTML = items.map((it,i) => {
    const pr=_cv3_itemProfit(it), rc=_cv3_prodRowCls(it), cv=_cv3_f2(it.commission||0);
    const cpct=it.actualPrice?((+(it.commission||0)/+it.actualPrice)*100).toFixed(0)+'%':'0%';
    return `<tr class="${rc}">
      <td>${i+1}</td>
      <td class="pt-name" title="${_cv3_esc(it.name||it.product_name||'--')}">${_cv3_esc(it.name||it.product_name||'--')}</td>
      <td>${it.qty||0}</td>
      <td>${_cv3_f2(it.salePrice||it.sale_price)}</td>
      <td>${_cv3_f2(it.wholesalePrice||it.wholesale_price)}</td>
      <td>${_cv3_f2(it.purchasePrice||it.purchase_price)}</td>
      <td>
        <div style="display:flex;flex-direction:column;align-items:center;gap:1px;">
          <input class="comm-inp" type="number" value="${cv}" min="0" step="0.01"
            data-i="${i}" oninput="_cv3_onProdComm(${i},this.value)" onfocus="this.select()">
          <span class="comm-pct" id="cv3-cpct-${i}">(${cpct})</span>
        </div>
      </td>
      <td class="${pr>=0?'profit-g':'profit-r'}" id="cv3-pp-${i}" style="color:${pr>=0?'#15803d':'#dc2626'};font-weight:800;">${_cv3_fmtUSD(pr)}</td>
    </tr>`;
  }).join('');
}

function _cv3_onProdComm(i, val) {
  if (!_cv3_sel) return;
  const it = _cv3_sel.items[i]; if (!it) return;
  it.commission = parseFloat(val)||0;
  const pr=_cv3_itemProfit(it);
  const pp=_cv3_$('cv3-pp-'+i); if(pp){pp.textContent=_cv3_fmtUSD(pr);pp.style.color=pr>=0?'#15803d':'#dc2626';}
  const cp=_cv3_$('cv3-cpct-'+i); if(cp)cp.textContent=(+it.actualPrice>0)?'('+(it.commission/+it.actualPrice*100).toFixed(0)+'%)':'(—)';  /* [OWN-SAFE-RATIO] */
  _cv3_refreshSummary(); _cv3_refreshStats();
}

function _cv3_onTotalCommInput(val) {
  if (!_cv3_sel) return;
  const total=parseFloat(val)||0, items=_cv3_sel.items||[];
  const tqty=items.reduce((s,it)=>s+(+it.qty||1),0)||1;
  items.forEach((it,i)=>{
    it.commission=total*((+it.qty||1)/tqty)/(+it.qty||1);
    const inp=document.querySelector(`.comm-inp[data-i="${i}"]`); if(inp)inp.value=_cv3_f2(it.commission);
    const pr=_cv3_itemProfit(it);
    const pp=_cv3_$('cv3-pp-'+i); if(pp){pp.textContent=_cv3_fmtUSD(pr);pp.style.color=pr>=0?'#15803d':'#dc2626';}
    const cp=_cv3_$('cv3-cpct-'+i); if(cp)cp.textContent=(+it.actualPrice>0)?'('+(it.commission/+it.actualPrice*100).toFixed(0)+'%)':'(—)';  /* [OWN-SAFE-RATIO] النسخة الثانية */
  });
  _cv3_refreshSummary(true); _cv3_refreshStats();
}

function _cv3_refreshSummary(skipTc) {
  if (!_cv3_sel) return;
  const items=_cv3_sel.items||[];
  const qty=items.reduce((s,it)=>s+(+it.qty||0),0);
  const total=_cv3_invActual(_cv3_sel), comm=_cv3_invComm(_cv3_sel), profit=_cv3_invProfit(_cv3_sel);
  const set=(id,v)=>{const el=_cv3_$(id);if(el)el.textContent=v;};
  set('cv3-sum-qty',   qty);
  set('cv3-sum-total', _cv3_fmtUSD(total));
  set('cv3-sum-ct',    _cv3_fmtUSD(comm));
  set('cv3-sum-cpct',  _cv3_pct(comm,total));
  const tc=_cv3_$('cv3-tc-input'); if(tc&&!skipTc&&document.activeElement!==tc)tc.value=_cv3_f2(comm);
  set('cv3-bc-comm',   _cv3_fmtUSD(comm));
  set('cv3-bc-cpct',   _cv3_pct(comm,total));
  const bcp=_cv3_$('cv3-bc-profit'); if(bcp){bcp.textContent=_cv3_fmtUSD(profit);bcp.style.color=profit>=0?'#15803d':'#dc2626';}
  set('cv3-bc-ppct',   _cv3_pct(profit,total));
}

function _cv3_refreshStats() {
  const sales=_cv3_all.reduce((s,i)=>s+_cv3_invActual(i),0);
  const tcomm=_cv3_all.reduce((s,i)=>s+_cv3_invComm(i),0);
  const pcomm=_cv3_all.filter(i=>_cv3_invComm(i)>0).reduce((s,i)=>s+_cv3_invComm(i),0);
  const profit=_cv3_all.reduce((s,i)=>s+_cv3_invProfit(i),0);
  const set=(id,v)=>{const el=_cv3_$(id);if(el)el.textContent=v;};
  set('cv3-s-count',  _cv3_all.length);
  set('cv3-s-sales',  _cv3_fmtUSD(sales));
  set('cv3-s-tcomm',  _cv3_fmtUSD(tcomm));
  set('cv3-s-pcomm',  _cv3_fmtUSD(pcomm));
  set('cv3-s-profit', _cv3_fmtUSD(profit));
}

function _cv3_applyFilters() {
  const q=(_cv3_$('cv3-f-search')?.value||'').toLowerCase();
  const stat=_cv3_$('cv3-f-status')?.value||'';
  const type=_cv3_$('cv3-f-type')?.value||'';
  const pos=_cv3_$('cv3-f-pos')?.value||'';
  const user=_cv3_$('cv3-f-user')?.value||'';
  const df=_cv3_$('cv3-f-dfrom')?.value||'';
  const dt=_cv3_$('cv3-f-dto')?.value||'';
  _cv3_filtered = _cv3_all.filter(inv=>{
    if(q&&!String(inv.inv_number||inv.number||'').includes(q)&&!(inv.customer_name||inv.customer||'').toLowerCase().includes(q))return false;
    if(stat&&(inv.status||'pending')!==stat)return false;
    if(type&&(inv.sale_type||inv.saleType||'')!==type)return false;
    if(pos &&inv.branch_key!==pos)return false;
    if(user&&(inv.user||inv.user_name||'')!==user)return false;
    if(df&&(inv.date||'') < df)return false;
    if(dt&&(inv.date||'') > dt)return false;
    return true;
  });
  _cv3_page=1; _cv3_renderTable();
}

function _cv3_resetFilters() {
  ['cv3-f-search','cv3-f-status','cv3-f-type','cv3-f-pos','cv3-f-user','cv3-f-dfrom','cv3-f-dto'].forEach(id=>{
    const el=_cv3_$(id); if(el)el.value='';
  });
  _cv3_applyFilters();
}

async function _cv3_saveComm() {
  if (!_cv3_sel) return;
  const noteEl = _cv3_$('cv3-notes-ta');
  _cv3_sel.note   = noteEl ? noteEl.value.trim() : '';
  const comm      = _cv3_invComm(_cv3_sel);
  const btn       = document.querySelector('.save-btn');
  if (btn) { btn.disabled=true; btn.textContent='جارٍ الحفظ...'; }
  /* 🔴 (2026-10-03 · قرار المالك ت٩) «كلشي فاتورة مرتبطة بأوردر صفر».
     كان هذا المحرّر يكتب عمولةً لأيّ فاتورةٍ يختارها الأدمن **بلا فحص الارتباط** —
     وهو بابٌ خلفيٌّ يُبطل القرار: نقطة البيع تمنعها تلقائياً ثمّ تُكتَب من هنا يدوياً.
     الحظر صريحٌ ويقول سببه، ولا يُحاكي القرار صمتاً. */
  /* ══════════════════════════════════════════════════════════════════════
     🔄 تعديلك ن٤ (2026-10-03) على القرار ت٩ — أُسجّله لأنّه يُغيّر حكماً سابقاً:

     كان الحظرُ **مطلقاً**: فاتورةٌ مرتبطةٌ بأوردر ⇒ لا عمولة، ولا من الأدمن.
     ونصُّك الجديد: «هي **نورمال ما في إلها عمولة** بس **ممكن أدمن يضيف لها
     عمولة**».

     فالفرق: الصفرُ يبقى هو **الأصل التلقائي** (لا شيء تغيّر في نقطة البيع)،
     لكن بابَ الأدمن يُفتَح **بقرارٍ واعٍ** لا بالخطأ:
       ① تأكيدٌ صريح يسمّي الأوردر ويقول إنّ هذا استثناءٌ لقاعدتك.
       ② وتُكتب العمولةُ موسومةً «استثناء الأدمن» في ملاحظتها، فتُعرَف لاحقاً.
       ③ وتُسجَّل في سجلّ التدقيق باسم من أضافها.
     أي: ليست ثغرةً صامتة — هي قرارٌ موقَّع.
     ══════════════════════════════════════════════════════════════════════ */
  let _adminOverride = false;
  if (_cv3_sel.order_id || _cv3_sel.order_serial) {
    const _ref = (_cv3_sel.order_serial || _cv3_sel.order_id);
    const _msg = 'هذه الفاتورة مرتبطة بأوردر #' + _ref + '.\n\n'
      + 'قاعدتك: فواتير الأوردرات **بلا عمولة** — وهذا هو الوضع الطبيعي.\n'
      + 'هل تريد إضافة عمولةٍ لها **استثناءً**؟\n\n'
      + 'ستُوسَم «استثناء الأدمن» وتُسجَّل في سجلّ التدقيق.';
    const yes = window.GMTAsk
      ? await window.GMTAsk.confirm(_msg, { title: 'عمولةٌ على فاتورة أوردر', okText: 'نعم — أضِفها استثناءً', cancelText: 'لا', icon: 'ask' })
      : await GMTAsk.confirm(_msg);
    if (!yes) {
      if (btn) { btn.disabled = false; btn.textContent = ''; btn.innerHTML = '💾 حفظ العمولة'; }
      showToast('↩︎ لم يُحفَظ شيء — الفاتورة بقيت بلا عمولة', 'ok');
      return;
    }
    _adminOverride = true;
  }

  try {
    // Save per-product commissions to invoice_items
    for (const it of (_cv3_sel.items||[])) {
      if (!it.id) continue;
      await sb('PATCH', `/rest/v1/invoice_items?id=eq.${it.id}`,
        { commission: it.commission }, { Prefer:'return=minimal' });
    }
    // Save/update invoice_commissions record
    /* ن٤: الاستثناءُ يُوسَم في الملاحظة فلا يختلط لاحقاً بعمولةٍ عادية */
    const _ovNote = _adminOverride
      ? ('⚠️ استثناء الأدمن — فاتورةٌ مرتبطةٌ بأوردر #'
         + (_cv3_sel.order_serial || _cv3_sel.order_id) + (_cv3_sel.note ? ' · ' + _cv3_sel.note : ''))
      : (_cv3_sel.note || null);
    const payload = { invoice_id:_cv3_sel.id, branch_key:_cv3_sel.branch_key,
      amount:parseFloat(comm.toFixed(2)), note:_ovNote, created_by:'admin' };
    /* (11 ت١ · V1) للفاتورة صفوفٌ عدّة (بند لكل صف): المبلغ المكتوب هو المجموع ⇒ يحمل صفٌّ واحد الفرق عن بقيّة الصفوف
       (كان يُكتب المجموع كاملاً فوق صفٍّ واحد وتبقى البقيّة فيتضاعف المجموع 43.98 ← 63.98). وعمولة مدفوعة لا تُعدَّل. */
    const _fr = await sb('GET', `/rest/v1/invoice_commissions?invoice_id=eq.${encodeURIComponent(_cv3_sel.id)}&select=id,amount,paid&order=id.asc`);
    const _frRows = Array.isArray(_fr?.data) ? _fr.data : (Array.isArray(_fr) ? _fr : []);
    if (_frRows.some(r => r.paid)) throw new Error('عمولة هذه الفاتورة (كلها أو بعضها) مدفوعة بتسوية — لا تُعدَّل من هنا');
    if (_frRows.length) {
      const main = _frRows.find(r => String(r.id) === String(_cv3_sel._comm_id)) || _frRows[0];
      const others = _frRows.filter(r => String(r.id) !== String(main.id)).reduce((t, r) => t + (Number(r.amount) || 0), 0);
      const mu = await sb('PATCH', `/rest/v1/invoice_commissions?id=eq.${main.id}&paid=eq.false`,
        { amount: Math.round((payload.amount - others) * 100) / 100, note:payload.note }, { Prefer:'return=representation' });
      const mr = Array.isArray(mu?.data) ? mu.data : (Array.isArray(mu) ? mu : []);
      if (!mr.length) throw new Error('لم تُحدَّث العمولة (دُفعت أو حُذفت من جهاز آخر)');
      _cv3_sel._comm_id = main.id;
    } else {
      const res = await sb('POST', '/rest/v1/invoice_commissions', {...payload, paid:false, approved:false});
      const rec = Array.isArray(res)?res[0]:res;
      if (rec?.id) _cv3_sel._comm_id = rec.id;
    }
    _cv3_sel.status = 'approved';
    /* ن٤: الاستثناءُ يُسجَّل — قرارٌ موقَّع لا ثغرةٌ صامتة */
    if (_adminOverride) {
      try {
        if (window.GMTAudit) await GMTAudit.log({
          action: 'commission_admin_override',
          entity: 'invoice_commissions', entityId: _cv3_sel.id,
          entityName: 'عمولةٌ استثنائية على فاتورة أوردر #' + (_cv3_sel.order_serial || _cv3_sel.order_id),
          newValue: comm.toFixed(2),
          reason: 'ن٤ · الأصلُ بلا عمولة، وأضافها الأدمن استثناءً بتأكيدٍ صريح'
        });
      } catch (_) {}
    }
    showToast((_adminOverride ? '⚠️ حُفظت عمولةٌ **استثنائية** — ' : '✅ تم حفظ العمولة — ') + comm.toFixed(2) + '$', 'ok');
    _cv3_renderTable();
  } catch(e) { showToast('خطأ في الحفظ: '+e.message,'err'); }
  if (btn) { btn.disabled=false; btn.textContent=''; btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="15" height="15"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> حفظ العمولة'; }
}

async function _cv3_approve(invId) {
  // كان هذا المسار يكتب على جدول commissions الخاطئ (بدل invoice_commissions) —
  // موافقة وهمية ما بتوصل الكاشير أبداً. الآن يوجّه للمسار الصحيح approveCommission
  // الذي يفتح نافذة تعديل المبلغ قبل الموافقة (نفس السلوك المطلوب: توافق على العمولة
  // التلقائية أو تعدّل رقمها ثم توافق).
  const comm = invComm(invId);
  if (comm) {
    const inv = allInvoices.find(i => String(i.id) === String(invId)) || _cv3_all.find(i => String(i.id) === String(invId));
    approveCommission(comm.id, comm.branch_key || inv?.branch_key, Number(comm.amount) || 0);
  } else {
    showToast('لا توجد عمولة مسجّلة لهذه الفاتورة — راجعها من تبويب الفواتير', 'err');
  }
}

async function renderCommissions() {
  const c = document.getElementById('app-content');
  c.innerHTML = `<div class="empty-state"><div style="font-size:32px;">⏳</div><p style="margin-top:8px;font-weight:700;">جارٍ تحميل البيانات...</p></div>`;

  // ─── Load invoices ───
  /* 🔧 (2026-10-03 · قرار المالك ت٩) كانت قائمة الأعمدة بلا `order_id` و`order_serial`،
     فلم تكن هذه الشاشة **تعرف** أنّ الفاتورة مرتبطةٌ بأوردر — فتسمح بكتابة عمولةٍ
     عليها يدوياً، وقرار المالك: «كلشي فاتورة مرتبطة بأوردر صفر».
     وتُطلَب بقراءةٍ متدرّجة (OWN-ORDER-IS-DROPPED-BEFORE-DATA): لو لم تعرفهما القاعدة
     تُرفَض القائمة كلّها ⇒ تُفرَغ شاشة العمولات بأكملها. */
  let rawInvs = [];
  const _INV_BASE = 'id,inv_number,branch_key,customer_name,customer_phone,total,created_at,sale_type';
  for (const cols of [_INV_BASE + ',order_id,order_serial', _INV_BASE + ',order_id', _INV_BASE]) {
    try {
      rawInvs = await sb('GET', '/rest/v1/invoices?order=created_at.desc&limit=500&select=' + cols);
      if (!Array.isArray(rawInvs)) rawInvs = [];
      if (cols === _INV_BASE) {
        console.warn('[عمولات] القاعدة لا تعرف order_id — لا يمكن تمييز فواتير الأوردرات هنا.');
      }
      break;
    } catch (e) {
      if (cols === _INV_BASE) { showToast('خطأ تحميل الفواتير: ' + e.message, 'err'); rawInvs = []; }
    }
  }

  // ─── Load items ───
  let rawItems = [];
  try {
    rawItems = await sb('GET',
      '/rest/v1/invoice_items?select=id,invoice_id,product_name,qty,purchase_price,wholesale_price,sale_price,actual_price,commission&limit=5000&order=invoice_id.asc'
    );
    if (!Array.isArray(rawItems)) rawItems = [];
  } catch(e) {
    try {
      rawItems = await sb('GET','/rest/v1/invoice_items?select=id,invoice_id,product_name,qty,unit_price,commission&limit=5000');
      if(!Array.isArray(rawItems)) rawItems=[];
      rawItems = rawItems.map(it=>({...it, purchase_price:it.unit_price||0, wholesale_price:0, sale_price:it.unit_price||0, actual_price:it.unit_price||0}));
    } catch(_) { rawItems=[]; }
  }

  // ─── Load commission records ───
  let rawComms = [];
  try {
    rawComms = await sb('GET','/rest/v1/invoice_commissions?select=id,invoice_id,approved,paid,amount,note&limit=2000');
    if (!Array.isArray(rawComms)) rawComms = [];
  } catch(_) { rawComms = []; }

  // ─── Build map ───
  const itemMap = new Map();
  for (const it of rawItems) {
    if (!itemMap.has(it.invoice_id)) itemMap.set(it.invoice_id, []);
    itemMap.get(it.invoice_id).push({
      id: it.id, invoice_id: it.invoice_id,
      name: it.product_name||'--',
      qty:            +it.qty||1,
      purchasePrice:  +it.purchase_price||0,
      wholesalePrice: +it.wholesale_price||0,
      salePrice:      +it.sale_price||0,
      actualPrice:    +it.actual_price||0,
      commission:     +it.commission||0,
    });
  }
  const commMap = new Map((rawComms).map(c=>[c.invoice_id, c]));

  _cv3_all = rawInvs.map(inv => {
    const cr  = commMap.get(inv.id);
    const d   = new Date(inv.created_at);
    return {
      ...inv,
      items:    itemMap.get(inv.id) || [],
      status:   cr?.approved ? 'approved' : 'pending',
      _comm_id: cr?.id || null,
      note:     cr?.note || '',
      date:     d.toLocaleDateString('ar-SY',{day:'2-digit',month:'2-digit',year:'numeric'}),
      time:     d.toLocaleTimeString('ar-SY',{hour:'2-digit',minute:'2-digit'}),
    };
  // ترتيب الأحدث أولاً
  }).sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

  if (activeBranch !== 'all') {
    _cv3_all = _cv3_all.filter(i => i.branch_key === activeBranch);
  }

  _cv3_filtered = [..._cv3_all];
  _cv3_sel      = null;
  _cv3_page     = 1;

  // ─── Populate filter dropdowns ───
  const posOptions  = [...new Set(_cv3_all.map(i=>i.branch_key).filter(Boolean))];
  const userOptions = [...new Set(_cv3_all.map(i=>i.user||i.user_name).filter(Boolean))];

  // ─── Render HTML ───
  c.innerHTML = `
    ${branchFilterHtml()}
    <div id="cv3-t9-bar"></div>

    <!-- STAT CARDS -->
    <div class="top-row" style="margin-bottom:10px;">
      <div class="scard">
        <div class="scard-icon si-blue">
          <svg viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
        </div>
        <div><div class="scard-lbl">إجمالي المبيعات</div><div class="scard-val" id="cv3-s-sales">$ 0.00</div></div>
      </div>
      <div class="scard">
        <div class="scard-icon si-purple">
          <svg viewBox="0 0 24 24" fill="none" stroke="#D5001C" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M9 9h.01M15 15h.01M15 9L9 15" stroke-linecap="round"/></svg>
        </div>
        <div><div class="scard-lbl">إجمالي العمولات</div><div class="scard-val" id="cv3-s-tcomm">$ 0.00</div></div>
      </div>

/* ═══════════════════════════════════════════════════════════════════════════
   تسوية قرار ت٩ على **الماضي**
   ─────────────────────────────────────────────────────────────────────────
   نصّ المالك: «كلشي فاتورة مرتبطة بأوردر صفر الان **وسابقا** وبالمستقبل».

   «الان وبالمستقبل» عُلِجا في الكود (نقطة البيع + هذا المحرّر). أمّا «سابقا»
   فعمولاتٌ **محفوظةٌ في القاعدة** على فواتير أوردرات — كُتبت بسبب ثغرةٍ في
   الشرط القديم (كان يمنع الأوردر الموجود ولا يمنع الجديد).

   ولا أكتبها صفراً من تلقائي: قاعدة `OWN-MONEY-TRACE` تقول إنّ أيّ فرقٍ ماليّ
   **يُسجَّل ولا يُمسّ صامتاً**. فالشاشة تَعرض ما وجدَته وقيمتَه، والتصفير
   بضغطةٍ منه وبسببٍ يُحفَظ في كل سجلّ — عبر نفس آلة التصفير المُدقَّقة
   (`zeroed_by` · `zeroed_at` · `zeroed_reason`) لا بآلةٍ جديدة.

   والشريط **لا يظهر إن لم يوجد شيء** — لا نُقلق المالك بتحذيرٍ فارغ.
   ═══════════════════════════════════════════════════════════════════════════ */
let _t9_rows = [];

async function _t9_scan() {
  const bar = document.getElementById('cv3-t9-bar');
  if (!bar) return;
  bar.innerHTML = '';
  _t9_rows = [];
  try {
    /* فواتير مرتبطةٌ بأوردر — قراءةٌ متدرّجة كي لا يُفرِغ عمودٌ مجهول النتيجة */
    let linked = null;
    for (const q of ['order_id=not.is.null&select=id,inv_number,order_serial,order_id',
                     'order_id=not.is.null&select=id,inv_number,order_id']) {
      try { linked = await sb('GET', '/rest/v1/invoices?' + q + '&limit=5000'); break; }
      catch (_) {}
    }
    if (!Array.isArray(linked) || !linked.length) return;
    const byId = new Map(linked.map(i => [String(i.id), i]));

    /* العمولات غير المُصفَّرة على تلك الفواتير */
    const comms = Array.isArray(allComm) && allComm.length
      ? allComm
      : (await sb('GET', '/rest/v1/invoice_commissions?select=*&limit=5000')) || [];
    _t9_rows = (comms || []).filter(cm =>
      byId.has(String(cm.invoice_id)) && !cm.zeroed && Math.abs(Number(cm.amount) || 0) > 0.001
    ).map(cm => ({ ...cm, _inv: byId.get(String(cm.invoice_id)) }));

    if (!_t9_rows.length) return;                       // لا شيء ⇒ لا شريط
    const total = _t9_rows.reduce((s, r) => s + (Number(r.amount) || 0), 0);
    bar.innerHTML = `
      <div style="background:#fff7ed;border:2px solid #fb923c;border-radius:12px;
                  padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;
                  justify-content:space-between;gap:10px;flex-wrap:wrap">
        <div style="font-size:13px;font-weight:800;color:#7c2d12;line-height:1.8">
          ⚖️ <b>تسوية قرارك «فواتير الأوردرات بلا عمولة»</b><br>
          وجدتُ <b>${_t9_rows.length}</b> عمولةً محفوظةً على فواتير مرتبطةٍ بأوردر،
          مجموعها <b>$${total.toFixed(2)}</b> — كُتبت قبل إصلاح الثغرة.
          <span style="font-weight:600;opacity:.85">لم أمسّ قرشاً: القرار قرارك.</span>
        </div>
        <button onclick="_t9_open()" style="background:#D5001C;color:#fff;border:none;
                border-radius:10px;padding:10px 14px;font-weight:900;font-size:13px;
                cursor:pointer;font-family:inherit">راجِعها وصفّرها</button>
      </div>`;
  } catch (e) {
    console.warn('[ت٩] تعذّر فحص عمولات الأوردرات:', e && e.message);
  }
}

function _t9_open() {
  if (!_t9_rows.length) return;
  const total = _t9_rows.reduce((s, r) => s + (Number(r.amount) || 0), 0);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
    ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const rows = _t9_rows.map(r => `
    <tr style="border-bottom:1px solid #f1f5f9">
      <td style="padding:7px 9px;font-size:12px;font-weight:800">${esc(r._inv.inv_number || r.invoice_id)}</td>
      <td style="padding:7px 9px;font-size:12px">#${esc(r._inv.order_serial || r._inv.order_id)}</td>
      <td style="padding:7px 9px;font-size:12px">${esc(r.cashier_name || r.branch_key || '—')}</td>
      <td style="padding:7px 9px;font-size:12px;font-weight:900;color:#b91c1c">$${(Number(r.amount)||0).toFixed(2)}</td>
      <td style="padding:7px 9px;font-size:11px;color:#5b6472">${esc(String(r.created_at || '').slice(0,10))}</td>
    </tr>`).join('');

  const ov = document.createElement('div');
  ov.id = '_t9_ov';
  ov.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);display:flex;'
    + 'align-items:center;justify-content:center;padding:14px';
  ov.innerHTML = `
    <div style="background:#fff;border-radius:16px;max-width:760px;width:100%;max-height:88vh;
                display:flex;flex-direction:column;overflow:hidden">
      <div style="padding:16px 18px;border-bottom:2px solid #D5001C">
        <div style="font-weight:900;font-size:16px">تسوية عمولات فواتير الأوردرات</div>
        <div style="font-size:12.5px;color:#5b6472;margin-top:4px;line-height:1.7">
          قرارك: «كلشي فاتورة مرتبطة بأوردر صفر الان وسابقا وبالمستقبل».<br>
          هذه <b>${_t9_rows.length}</b> عمولة بمجموع <b>$${total.toFixed(2)}</b>.
          التصفير <b>لا يحذف</b> السجلّ: يُحفظ باسمك وتاريخه وسببه، ويظهر في التقارير.
        </div>
      </div>
      <div style="overflow:auto;flex:1;padding:0 6px">
        <table style="width:100%;border-collapse:collapse">
          <thead><tr style="background:#f8fafc;position:sticky;top:0">
            <th style="padding:8px 9px;font-size:11.5px;text-align:right">الفاتورة</th>
            <th style="padding:8px 9px;font-size:11.5px;text-align:right">الأوردر</th>
            <th style="padding:8px 9px;font-size:11.5px;text-align:right">الكاشير/الفرع</th>
            <th style="padding:8px 9px;font-size:11.5px;text-align:right">العمولة</th>
            <th style="padding:8px 9px;font-size:11.5px;text-align:right">التاريخ</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div style="padding:14px 18px;border-top:1px solid #e5e7eb">
        <label style="font-size:12px;font-weight:800;display:block;margin-bottom:5px">
          السبب (يُحفظ في كل سجلّ — إجباري)</label>

               style="width:100%;padding:10px;border:1.5px solid #d1d5db;border-radius:9px;

        <div id="_t9_prog" style="font-size:12px;font-weight:800;margin-top:9px;color:#374151"></div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button onclick="document.getElementById('_t9_ov').remove()"
                  style="flex:1;padding:11px;border:none;border-radius:10px;background:#f3f4f6;
                         font-weight:900;font-family:inherit;cursor:pointer">تراجع</button>
          <button id="_t9_go" onclick="_t9_apply()"
                  style="flex:2;padding:11px;border:none;border-radius:10px;background:#D5001C;
                         color:#fff;font-weight:900;font-family:inherit;cursor:pointer">
            صفّر الـ${_t9_rows.length} عمولة وسجّل السبب</button>
        </div>
      </div>
    </div>`;
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  document.body.appendChild(ov);
}

async function _t9_apply() {
  const reason = (document.getElementById('_t9_reason') || {}).value || '';
  if (!reason.trim()) { showToast('⛔ السبب إجباري — لم يُصفَّر شيء', 'err'); return; }
  const go = document.getElementById('_t9_go');
  const prog = document.getElementById('_t9_prog');
  if (go) { go.disabled = true; go.textContent = 'جارٍ التصفير…'; }

  const who = (window.currentUser && (currentUser.display_name || currentUser.username)) || 'admin';
  let done = 0; const failed = [];
  for (const r of _t9_rows) {
    const payload = {
      amount: 0, zeroed: true, zeroed_by: who,
      zeroed_at: new Date().toISOString(),
      zeroed_reason: reason.trim(), status: 'zeroed'
    };
    try {
      await sb('PATCH', `/rest/v1/invoice_commissions?id=eq.${r.id}`, payload, { Prefer: 'return=minimal' });
      /* تحقّقٌ فعليٌّ بإعادة القراءة — لا نثق بنجاح الطلب وحده (نمط الكتابة الصامتة) */
      const v = await sb('GET', `/rest/v1/invoice_commissions?id=eq.${r.id}&select=id,amount`);
      const vr = Array.isArray(v) ? v[0] : v;
      if (!vr || Number(vr.amount) !== 0) throw new Error('لم تُطبَّق فعلياً');
      done++;
      const i = (allComm || []).findIndex(x => String(x.id) === String(r.id));
      if (i >= 0) allComm[i] = { ...allComm[i], ...payload };
    } catch (e) {
      failed.push((r._inv && r._inv.inv_number) || r.id);
    }
    if (prog) prog.textContent = 'صُفِّرت ' + done + ' من ' + _t9_rows.length
                               + (failed.length ? ' · تعذّرت ' + failed.length : '');
  }
  const ov = document.getElementById('_t9_ov');
  if (ov) ov.remove();
  if (failed.length) {
    showToast('⚠️ صُفِّرت ' + done + ' وتعذّرت ' + failed.length
              + ' (' + failed.slice(0, 3).join(' · ') + ') — راجع صلاحيات RLS', 'err');
  } else {
    showToast('✅ صُفِّرت ' + done + ' عمولة — السجلّ محفوظٌ بالسبب والاسم والتاريخ', 'ok');
  }
  renderCommissions();
}

function renderTransfers() {
  // م6: لافتة الشاشة الموحّدة (الصندوق + العمولات + التسويات بمكان واحد)
  setTimeout(() => {
    /* إصلاح 2026-07-12 (فحص عميق): كان يبحث عن #tab-transfers أو .tab-content.active —
       وكلاهما غير موجود بهذه الصفحة إطلاقاً (كل التبويبات تُرسم داخل #app-content)،
       فكان host = null دائماً و return فوري → اللافتة لم تُعرض ولا مرة منذ بنائها. */
    const host = document.getElementById('app-content');
    if (!host || host.querySelector('#settl-banner')) return;
    const d = document.createElement('div');
    d.id = 'settl-banner';
    d.style.cssText = 'background:linear-gradient(135deg,#D5001C,#8a000d);color:#fff;border-radius:14px;padding:13px 15px;margin-bottom:14px;display:flex;align-items:center;gap:11px;cursor:pointer;box-shadow:0 6px 20px rgba(192,0,18,.28);';
    d.innerHTML = '<div style="font-size:24px;">🧾</div>'
      + '<div style="flex:1;"><div style="font-weight:900;font-size:14px;">الحساب الجاري والتسويات</div>'
      + '<div style="font-size:11px;opacity:.9;font-weight:700;line-height:1.7;">صندوق الفرع · عمولاته المستحقة · السحوبات · التسوية الشهرية — بشاشة واحدة، وكل عملية تُختم فلا تتكرر</div></div>'
      + '<div style="font-size:20px;">←</div>';
    d.onclick = () => window.GMTSettlements && GMTSettlements.open();
    host.insertBefore(d, host.firstChild);
  }, 60);
  // إخفاء المخازن (ألمانيا/الصين)
  const visibleBranches = branches.filter(b => !isExcludedBranch(b.key_name));
  const list = filteredTransfers();

  // بناء بيانات كل فرع مرئي
  const branchData = visibleBranches.map(b => {
    const bInvs   = allInvoices.filter(i => i.branch_key === b.key_name && !isExcludedBranch(i.branch_key));
    const bTrans  = allTransfers.filter(t => t.branch_key === b.key_name);
    const sales   = bInvs.reduce((s,i) => s + (Number(i.total)||0), 0);
    const commArr = allComm.filter(c => bInvs.some(i=>String(i.id) === String(c.invoice_id)));
    const commTotal = commArr.reduce((s,c) => s + (Number(c.amount)||0), 0);
    /* (٨ ت — تدقيق المطابقة) «صندوق الفرع الواحد بأربعة أرقام»: هنا كان «المبيعات − كل الحركات» — فالمصروف
       (سالب) يرفع الصندوق، وتحصيلُ الأوردر يُنقصه، والمقبوض الجزئيّ يُحسب كاملاً. الآن المصدر الواحد GMTCash
       كبقيّة الشاشات (نظرة عامّة · الصندوق والتسويات · الحساب الجاري · المحاسبة). */
    const _cash = window.GMTCash ? GMTCash.expected(bInvs, bTrans) : null;
    const transferred = _cash ? _cash.transferred : bTrans.reduce((s,t) => s + (Number(t.amount)||0), 0);
    const netAfterComm  = sales - commTotal;
    const pendingNoComm = _cash ? _cash.expected : Math.max(0, sales - transferred);
    const pendingComm   = Math.max(0, pendingNoComm - commTotal);
    return { b, sales, commTotal, transferred, netAfterComm, pendingNoComm, pendingComm, bTrans };
  });

  const totalPending = branchData.reduce((s,d) => s + d.pendingNoComm, 0);

  document.getElementById('app-content').innerHTML = `
    ${branchFilterHtml()}
    <div class="sec-head">
      <div>
        <div class="sec-title">💰 صناديق الفروع</div>
        <div class="sec-sub">إجمالي غير مُرحَّل: ${totalPending.toFixed(2)}$</div>
      </div>
      <button class="btn btn-red btn-sm" onclick="openNewTransferModal()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        تسجيل ترحيل
      </button>
    </div>

    <!-- صناديق الفروع -->
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:18px;">
      ${branchData.map(d => `
        <div style="background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;cursor:pointer;" onclick="toggleBranchDetail('bd-${d.b.key_name}')">
            <div style="display:flex;align-items:center;gap:8px;">
              <div style="width:36px;height:36px;background:var(--red);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;">${d.b.icon||'🏪'}</div>
              <div>
                <div style="font-size:14px;font-weight:900;color:var(--text);">${escH(d.b.display_name)}</div>
                <div style="font-size:11px;color:var(--text3);font-weight:700;">مبيعات: ${d.sales.toFixed(2)}$ · مُرحَّل: ${d.transferred.toFixed(2)}$</div>
              </div>
            </div>
            <div style="text-align:left;flex-shrink:0;">
              <div style="font-size:20px;font-weight:900;color:${d.pendingNoComm>0?'var(--warning)':'var(--success)'};">${d.pendingNoComm.toFixed(2)}$</div>
              <div style="font-size:10px;color:var(--text3);">قيد التحصيل</div>
            </div>
          </div>
          <!-- تفاصيل قابلة للطي -->
          <div id="bd-${d.b.key_name}" style="display:none;">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;">
              <div style="background:#f0fdf4;border-radius:10px;padding:10px;text-align:center;">
                <div style="font-size:10px;color:var(--text3);font-weight:700;">بدون عمولات</div>
                <div style="font-size:16px;font-weight:900;color:#15803d;">${d.pendingNoComm.toFixed(2)}$</div>
              </div>
              <div style="background:#fffbeb;border-radius:10px;padding:10px;text-align:center;">
                <div style="font-size:10px;color:var(--text3);font-weight:700;">بعد خصم العمولات</div>
                <div style="font-size:16px;font-weight:900;color:#b45309;">${d.pendingComm.toFixed(2)}$</div>
              </div>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <button class="btn btn-red btn-sm" style="flex:1;"
                onclick="openPartialCollectModal('${d.b.key_name}','${escH(d.b.display_name)}',${d.pendingNoComm},${d.commTotal})">
                💰 تحصيل
              </button>
            </div>
            <!-- آخر الترحيلات -->
            ${d.bTrans.length ? `
              <div style="margin-top:10px;">
                <div style="font-size:11px;font-weight:800;color:var(--text3);margin-bottom:6px;">آخر الترحيلات:</div>
                ${d.bTrans.slice(-3).reverse().map(t => {
                  const ds = new Date(t.created_at).toLocaleDateString('ar-SY',{day:'2-digit',month:'2-digit'});
                  return `<div style="display:flex;justify-content:space-between;font-size:11px;padding:4px 0;border-bottom:1px solid var(--border);">
                    <span style="color:var(--text2);font-weight:700;">${ds} · ${escH(t.note||'ترحيل')}</span>
                    <span style="font-weight:900;color:var(--success);">${Number(t.amount).toFixed(2)}$</span>
                  </div>`;
                }).join('')}
              </div>` : ''}
          </div>
        </div>`).join('')}
    </div>
  `;
}

function setColType(type, full, comm) {
  const fullBtn = document.getElementById('col-type-full');
  const commBtn = document.getElementById('col-type-comm');
  const amtEl   = document.getElementById('col-amount');
  if (fullBtn) { fullBtn.className = type==='full' ? 'btn btn-red btn-sm' : 'btn btn-ghost btn-sm'; fullBtn.style.width='100%'; }
  if (commBtn) { commBtn.className = type==='comm' ? 'btn btn-red btn-sm' : 'btn btn-ghost btn-sm'; commBtn.style.width='100%'; }
  if (amtEl)   amtEl.value = type==='full' ? full.toFixed(2) : (full-comm).toFixed(2);
}

async function savePartialTransfer(branchKey, pendingFull) {
  const amount = parseFloat(document.getElementById('col-amount')?.value||0);
  const note   = document.getElementById('col-note')?.value.trim()||'';
  if (isNaN(amount)||amount<=0) { showToast('أدخل مبلغاً صحيحاً','err'); return; }
  const remaining = pendingFull - amount;
  if (remaining > 0.01 && !await GMTAsk.confirm(`سيبقى ${remaining.toFixed(2)}$ في صندوق الفرع — متابعة؟`)) return;

  const b = branches.find(x=>x.key_name===branchKey);
  try {
    const res = await adminCashPost({
      branch_key   : branchKey,
      amount,
      note         : note || (remaining>0.01?`تحصيل جزئي — متبقي ${remaining.toFixed(2)}$`:'تحصيل كامل'),
      transfer_date: new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10),
      confirmed_by : 'admin',
    });
    const newT = Array.isArray(res)?res[0]:res;
    if (newT) allTransfers.push(newT);
    sendTelegram(
`<b>💰 تحصيل — GMT Admin</b>
━━━━━━━━━━━━━━━
<b>الفرع:</b> ${b?.display_name||branchKey}
<b>المحصَّل:</b> ${amount.toFixed(2)} $
${remaining>0.01?`<b>المتبقي في الصندوق:</b> ${remaining.toFixed(2)} $`:'✅ تحصيل كامل'}
${note?`<b>ملاحظة:</b> ${note}`:''}
<b>التوقيت:</b> ${new Date().toLocaleString('ar-SY')}`
    );
    showToast(`✅ تم تسجيل تحصيل ${amount.toFixed(2)}$ من ${b?.display_name||branchKey}`, 'ok');
    closeModal();
    renderTransfers();
  } catch(e) { showToast('خطأ: '+e.message,'err'); }
}

async function saveTransfer() {
  const branchKey = document.getElementById('tr-branch').value;
  const amount    = parseFloat(document.getElementById('tr-amount').value);
  const note      = document.getElementById('tr-note').value.trim();

  if (!branchKey) { showToast('اختر الفرع', 'err'); return; }
  if (isNaN(amount) || amount <= 0) { showToast('أدخل مبلغ صحيح', 'err'); return; }

  const b = branches.find(x=>x.key_name===branchKey);

  // Confirm with pending balance check
  const bInvs  = allInvoices.filter(i=>i.branch_key===branchKey);
  const bTrans = allTransfers.filter(t=>t.branch_key===branchKey);
  const bSales = bInvs.reduce((s,i)=>s+(Number(i.total)||0),0);
  const bTr    = bTrans.filter(t=>t.type!=='expense').reduce((s,t)=>s+(Number(t.amount)||0),0);
  // (2026-08-26) نفس رقم الصندوق الموحّد المستخدم في العرض — فلا يختلف تحذير الترحيل عن المعروض
  const pending = window.GMTCash ? GMTCash.expected(bInvs, bTrans).expected : Math.max(0, bSales - bTr);

  if (amount > pending + 0.01) {
    if (!await GMTAsk.confirm(`المبلغ المدخل (${amount}$) أكبر من الرصيد غير المرحّل (${pending.toFixed(2)}$).\nهل تريد المتابعة؟`)) return;
  }

  try {
    const res = await adminCashPost({
      branch_key  : branchKey,
      amount,
      note        : note || null,
      transfer_date: new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10),
      confirmed_by: 'admin',
    });
    const newT = Array.isArray(res) ? res[0] : res;
    if (newT) allTransfers.push(newT);
    // إشعار تلغرام
    sendTelegram(
`<b>ترحيل مبيعات — GMT Admin</b>
━━━━━━━━━━━━━━━
<b>الفرع:</b> ${b?.display_name||branchKey}
<b>المبلغ:</b> ${amount.toFixed(2)} $
${note ? `<b>ملاحظة:</b> ${note}` : ''}
<b>التوقيت:</b> ${new Date().toLocaleString('ar-SY')}
━━━━━━━━━━━━━━━`
    );
    showToast(`تم تسجيل ترحيل ${amount}$ من ${b?.display_name||branchKey}`, 'ok');
    closeModal();
    renderTransfers();
  } catch(e) { showToast('خطأ: ' + e.message, 'err'); }
}

let allManualDebts = [];

async function loadManualDebts() {
  try {
    const rows = await sb('GET', '/rest/v1/gmt_manual_debts?order=created_at.desc&limit=2000');
    allManualDebts = (Array.isArray(rows) ? rows : []).filter(r => !r.voided);   // إخفاء المُبطَل (يبقى بالقاعدة للتدقيق)
  } catch(e) { allManualDebts = []; }
}

function renderDebts() {
  const c = document.getElementById('app-content');

  // ── تجميع الفواتير غير المحصَّلة حسب الفرع ──
  const byBranch = {};
  allDebts.forEach(d => {
    const key = d.branch_key || 'unknown';
    if (!byBranch[key]) byBranch[key] = { items: [], total: 0, name: d.branch_name || key };
    byBranch[key].items.push(d);
    byBranch[key].total += Number(d.remaining_amount ?? d.total) || 0;
  });

  const branchCards = Object.entries(byBranch).map(([key, data]) => {
    const b = branches.find(x => x.key_name === key);
    return `
    <div class="inv-card" onclick="openBranchDebtsModal('${escH(key)}')"
      style="cursor:pointer;border-right:4px solid #dc2626;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div>
          <div style="font-size:14px;font-weight:900;">${b?.icon||'🏪'} ${escH(b?.display_name||data.name)}</div>
          <div style="font-size:11px;color:var(--text3);font-weight:700;margin-top:3px;">${data.items.length} فاتورة غير محصَّلة</div>
        </div>
        <div style="text-align:left;">
          <div style="font-size:20px;font-weight:900;color:#dc2626;">${data.total.toFixed(2)}$</div>
          <div style="font-size:10px;color:var(--text3);">غير مرحّل</div>
        </div>
      </div>
    </div>`;
  }).join('');

  // ── الديون اليدوية ──
  const manualOwedToMe   = allManualDebts.filter(d => d.direction === 'owed_to_me'   && !d.settled);
  const manualIOwe       = allManualDebts.filter(d => d.direction === 'i_owe'        && !d.settled);
  const totalOwedToMe    = manualOwedToMe.reduce((s,d)=>s+(Number(d.amount)||0),0);
  const totalIOwe        = manualIOwe.reduce((s,d)=>s+(Number(d.amount)||0),0);

  c.innerHTML = `
    <div class="sec-head">
      <div class="sec-title">💳 إدارة الديون</div>
      <button onclick="openAddManualDebtModal()"
        style="background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;border:none;border-radius:8px;
               padding:7px 14px;font-family:'Cairo',sans-serif;font-size:12px;font-weight:800;cursor:pointer;">
        ➕ تسجيل دين جديد
      </button>
    </div>

    <!-- ملخص الديون اليدوية -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;">
      <div style="background:#fef2f2;border:1.5px solid #fecaca;border-radius:12px;padding:12px;text-align:center;">
        <div style="font-size:10px;font-weight:800;color:#991b1b;">مدين لي (لي عند الناس)</div>
        <div style="font-size:20px;font-weight:900;color:#dc2626;">${totalOwedToMe.toFixed(2)}$</div>
        <div style="font-size:9px;color:var(--text3);">${manualOwedToMe.length} سجل</div>
      </div>
      <div style="background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:12px;padding:12px;text-align:center;">
        <div style="font-size:10px;font-weight:800;color:#1e40af;">أنا مدين (علي للناس)</div>
        <div style="font-size:20px;font-weight:900;color:#2563eb;">${totalIOwe.toFixed(2)}$</div>
        <div style="font-size:9px;color:var(--text3);">${manualIOwe.length} سجل</div>
      </div>
    </div>

    ${(manualOwedToMe.length || manualIOwe.length) ? `
    <div class="sec-head" style="margin-top:4px;">
      <div class="sec-title">📋 الديون اليدوية</div>
    </div>
    <div style="margin-bottom:16px;">
      ${[...manualOwedToMe, ...manualIOwe].map(d => manualDebtCardHtml(d)).join('')}
    </div>` : ''}

    <div class="sec-head">
      <div class="sec-title">🏪 فواتير غير محصَّلة حسب الفرع</div>
      <button onclick="loadDebts().then(()=>renderDebts())"
        style="background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;
               padding:5px 12px;font-family:'Cairo',sans-serif;font-size:11px;font-weight:800;cursor:pointer;">
        🔄 تحديث
      </button>
    </div>
    ${branchCards || '<div class="empty-state"><div class="ico">✅</div><div style="font-weight:700;">لا توجد فواتير غير محصَّلة</div></div>'}
  `;
}

function setManualDebtDirection(dir) {
  document.getElementById('mdebt-direction').value = dir;
  const owedBtn = document.getElementById('mdebt-dir-owed');
  const ioweBtn = document.getElementById('mdebt-dir-iowe');
  if (dir === 'owed_to_me') {
    owedBtn.style.background = '#fef2f2'; owedBtn.style.borderColor = '#dc2626'; owedBtn.style.color = '#dc2626';
    ioweBtn.style.background = 'var(--surface2)'; ioweBtn.style.borderColor = 'var(--border)'; ioweBtn.style.color = 'var(--text2)';
  } else {
    ioweBtn.style.background = '#eff6ff'; ioweBtn.style.borderColor = '#2563eb'; ioweBtn.style.color = '#2563eb';
    owedBtn.style.background = 'var(--surface2)'; owedBtn.style.borderColor = 'var(--border)'; owedBtn.style.color = 'var(--text2)';

async function saveManualDebt() {
  const direction = document.getElementById('mdebt-direction')?.value || 'owed_to_me';
  const name       = document.getElementById('mdebt-name')?.value.trim();
  const amount     = parseFloat(document.getElementById('mdebt-amount')?.value);
  const note       = document.getElementById('mdebt-note')?.value.trim();
  const linkedInv  = document.getElementById('mdebt-linked-inv')?.value.trim();
  if (!name) { showToast('أدخل اسم الشخص/الجهة', 'err'); return; }
  if (isNaN(amount) || amount <= 0) { showToast('أدخل مبلغاً صحيحاً', 'err'); return; }

  try {
    const res = await sb('POST', '/rest/v1/gmt_manual_debts', {
      direction, person_name: name, amount, note: note || null,
      linked_invoice_number: linkedInv || null,
      settled: false, created_at: new Date().toISOString(),
    });
    const rec = Array.isArray(res) ? res[0] : res;
    if (rec) allManualDebts.unshift(rec);
    showToast('✅ تم تسجيل الدين', 'ok');
    closeModal();
    renderDebts();
  } catch(e) { showToast('خطأ: ' + e.message, 'err'); }
}

async function settleManualDebt(id) {
  if (!await GMTAsk.confirm('تأكيد تسوية هذا الدين؟')) return;
  try {
    /* 🛡️ (2026-08-24) شرط ذرّي `settled=is.false` — بلا هذا يُسوّى الدين مرّتين
       فتُكتب تسوية فوق تسوية ويظهر في التقارير كأنه سُدّد مجدّداً. */
    const _u = await sb('PATCH', `/rest/v1/gmt_manual_debts?id=eq.${id}&settled=is.false`,
      { settled: true, settled_at: new Date().toISOString() }, { Prefer:'return=representation' });
    const _r = Array.isArray(_u?.data) ? _u.data : (Array.isArray(_u) ? _u : []);
    if (!_r.length) { showToast('⛔ هذا الدين مُسوّى مسبقاً', 'err'); return; }
    const d = allManualDebts.find(x => String(x.id) === String(id));
    if (d) d.settled = true;
    showToast('✅ تم تسجيل التسوية', 'ok');
    renderDebts();
  } catch(e) { showToast('خطأ: ' + e.message, 'err'); }
}

async function deleteManualDebt(id) {
  // ADM-4 (2026-08-03): السجلّات المالية لا تُحذف نهائياً — تُبطَل مع أثر وتبقى للتدقيق.
  const reason = await GMTAsk.prompt('⚠️ إبطال سجلّ الدَّين\n\nلا يُحذف — يبقى بالقاعدة للتدقيق ويُخفى من القائمة.\nاكتب سبب الإبطال (إجباري):');
  if (reason === null) return;
  if (!reason.trim()) { showToast('سبب الإبطال إجباري', 'err'); return; }
  try {
    await sb('PATCH', `/rest/v1/gmt_manual_debts?id=eq.${id}`,
      { voided:true, voided_at:new Date().toISOString(), voided_by:'admin', void_reason:reason.trim() },
      { Prefer:'return=minimal' });
    allManualDebts = allManualDebts.filter(x => x.id !== id);
    showToast('✅ أُبطل السجل (محفوظ للتدقيق)', 'ok');
    renderDebts();
  } catch(e) { showToast('خطأ: ' + e.message + ' — شغّل _SQL/1️⃣2️⃣ لتفعيل الإبطال', 'err'); }
}

/* ═══ م6-ب (قرار المالك 2026-07-11): عمولة البيع الآجل «معلّقة» حتى يُحصَّل ثمن
   الفاتورة فعلياً. عند اكتمال التحصيل تُحرَّر فتصبح قابلة للموافقة والتسوية. ═══ */
/* ══ (11 ت١ · D17) تحصيلٌ واحد موثوق: يقرأ الفاتورة من القاعدة، يتحقق من المبلغ، ويكتب بشرط (remaining الحالية) ثم يعدّ الصفوف.
   الجذر: التحصيل كان يحسب «المدفوع = المحلي السابق + الدفعة» من نسخة الشاشة ⇒ جهازان يحصّلان معاً فتضيع دفعة (paid=50 بدل 90)،
   والضغطتان تُسجّلان التحصيل مرّتين، و«تحصيل كامل ديون الفرع» لا يحرّر عمولاتها المعلّقة أبداً. ══ */
async function applyInvoiceCollection(invId, amount) {
  amount = Math.round((Number(amount) + 1e-9) * 100) / 100;
  if (!(amount > 0)) throw new Error('مبلغ غير صحيح');
  /* 🔴 (مراجعة ACCT-9) أوردر الشحن المرتبط بالفاتورة يكتب تحصيلاً type='collection' يُدخل الصندوق ثمنَ الفاتورة، ولا يُحدّث الفاتورة نفسها
     (فيبقى دينها مفتوحاً). تحصيلها هنا أيضاً يُضاعف النقد. ننبّه قبل الكتابة بدل أن يمرّ بصمت. */
  { const _dup = (allTransfers || []).filter(t => t && t.type === 'collection' && (String(t.invoice_id || '') === String(invId) || String(t.note || '').indexOf('invoice_id=' + invId) >= 0));
    if (_dup.length) {
      const got = _dup.reduce((s2, t) => s2 + Math.abs(Number(t.amount) || 0), 0);
      if (!await GMTAsk.confirm('⚠️ حُصِّل ثمنٌ لهذه الفاتورة سابقاً عبر أوردر الشحن (' + got.toFixed(2) + '$ دخلت الصندوق).\nتحصيلها هنا أيضاً يُدخل الصندوق مرّةً ثانية.\n\nاضغط «موافق» فقط إن كان هذا مبلغاً إضافياً فعلياً قبضتَه الآن.', { title: 'خطر تحصيلٍ مزدوج' }))
        throw new Error('أُلغي تفادياً للتحصيل المزدوج مع تحصيل أوردر الشحن');
    } }
  for (let attempt = 0; attempt < 3; attempt++) {
    const fr = await sb('GET', `/rest/v1/invoices?id=eq.${encodeURIComponent(invId)}&select=id,total,paid_amount,remaining_amount,payment_status`);
    const fl = Array.isArray(fr?.data) ? fr.data : (Array.isArray(fr) ? fr : []);
    const f = fl[0]; if (!f) throw new Error('الفاتورة غير موجودة');
    const hasRem = f.remaining_amount != null && f.remaining_amount !== '';
    const rem = Math.round((hasRem ? Number(f.remaining_amount) : Math.max(0, (Number(f.total) || 0) - (Number(f.paid_amount) || 0))) * 100) / 100;
    if (rem <= 0.004) throw new Error('هذه الفاتورة محصَّلة بالكامل مسبقاً');
    if (amount > rem + 0.004) throw new Error('المبلغ (' + amount.toFixed(2) + '$) أكبر من المتبقّي (' + rem.toFixed(2) + '$)');
    const paidPrev = Number(f.paid_amount) || 0;
    const newRem = Math.round(Math.max(0, rem - amount) * 100) / 100;
    const body = { payment_status: newRem <= 0.004 ? 'paid' : 'partial', paid_amount: Math.round((paidPrev + amount) * 100) / 100, remaining_amount: newRem };
    const cond = hasRem ? `remaining_amount=eq.${f.remaining_amount}` : 'remaining_amount=is.null';
    const up = await sb('PATCH', `/rest/v1/invoices?id=eq.${encodeURIComponent(invId)}&${cond}`, body, { Prefer: 'return=representation' });
    const ur = Array.isArray(up?.data) ? up.data : (Array.isArray(up) ? up : []);
    if (ur.length === 1) {
      try { const a = (allDebts || []).find(x => String(x.id) === String(invId)); if (a) Object.assign(a, body); } catch (_) {}
      try { const ai = (allInvoices || []).find(x => String(x.id) === String(invId)); if (ai) Object.assign(ai, body); } catch (_) {}
      try { await GMTAudit?.log?.({ action: 'invoice_collect', entity: 'invoices', entityId: String(invId), reason: 'تحصيل ' + amount.toFixed(2) + '$ — المتبقّي ' + newRem.toFixed(2) + '$' }); } catch (_) {}
      return { amount, remaining: newRem, paid: body.paid_amount, complete: newRem <= 0.004 };
    }
    // تغيّرت الفاتورة بين القراءة والكتابة (تحصيل من جهاز آخر) ⇒ نُعيد القراءة
  }
  throw new Error('تغيّرت الفاتورة من جهاز آخر أثناء التحصيل — حدّث الصفحة وأعد المحاولة');
}
async function releaseCommOnCollect(invId) {
  try {
    /* (11 ت١) الشرط على القاعدة لا على النسخة المحلية المتقادمة، ومقارنة المعرّف نصّاً (رقم/نصّ)، ويُتحقَّق من وجود صفوف حُرِّرت */
    const r = await sb('PATCH', `/rest/v1/invoice_commissions?invoice_id=eq.${encodeURIComponent(invId)}&awaiting_collection=eq.true`,
      { awaiting_collection: false }, { Prefer: 'return=representation' });
    const rows = Array.isArray(r?.data) ? r.data : (Array.isArray(r) ? r : []);
    allComm.forEach(x => { if (String(x.invoice_id) === String(invId)) x.awaiting_collection = false; });
    if (rows.length) showToast('💜 تحرّرت عمولة الفاتورة الآجلة — صارت مستحقة', 'ok');
  } catch (e) { console.warn('[comm] تعذّر تحرير عمولة الآجل:', e.message); showToast('⚠️ تعذّر تحرير عمولة الفاتورة — حرّرها يدوياً', 'err'); }
}

// خيار 1: تحصيل كامل المبلغ + تسجيل العمولة كدين عليّ (الإدارة)
let __collectBusy = false;
async function collectDebtInvoice(invId, mode, remaining, commAmount) {
  if (__collectBusy) return;
  const label = mode === 'full_with_comm' ? 'تحصيل كامل + العمولة كدين علي' : 'تحصيل مع اقتطاع العمولة';
  if (!await GMTAsk.confirm(`${label}\nالمبلغ: ${remaining.toFixed(2)}$${commAmount>0?` (عمولة: ${commAmount.toFixed(2)}$)`:''}`)) return;
  __collectBusy = true;
  try {
    // المتبقّي الفعلي من القاعدة (لا من نسخة الشاشة) — وبلا ضياع دفعة جهازٍ آخر
    const res = await applyInvoiceCollection(invId, remaining);
    if (res.complete) await releaseCommOnCollect(invId);   // م6-ب: تحرير عمولة الآجل عند التحصيل الكامل

    if (mode === 'full_with_comm' && commAmount > 0) {
      // العمولة تُسجَّل كدين على الإدارة (يُسجَّل في الديون اليدوية كـ i_owe) — مرّةً واحدة لكل فاتورة
      const inv = allDebts.find(d => String(d.id) === String(invId)) || {};
      const who = (inv.branch_name||'فرع') + ' — عمولة فاتورة #' + (inv.inv_number||'');
      let dup = false;
      try { dup = (await sb('GET', `/rest/v1/gmt_manual_debts?person_name=eq.${encodeURIComponent(who)}&direction=eq.i_owe&select=id&limit=1`) || []).length > 0; } catch (_) {}
      if (!dup) await sb('POST', '/rest/v1/gmt_manual_debts', {
        direction: 'i_owe', person_name: who,
        amount: commAmount, note: 'عمولة محصَّلة مع الفاتورة — مستحقة للفرع',
        settled: false, created_at: new Date().toISOString(),
      });
    } else if (mode === 'minus_comm' && commAmount > 0) {
      // اقتطاع العمولة فوراً — لا دين متبقٍ
      const c = invComm(invId);
      if (c) {
        // م6 (دمج): الاقتطاع أيضاً يُختم بسجل تسوية
        /* (٨ ت) كل صفوف عمولة الفاتورة تُختم لا الأوّل وحده */
        await GMTSettlements.stampPay((c._rows ? c._rows.filter(r => !r.paid).map(r => r.id) : [c.id]), c.branch_key, Number(c.amount)||0, 'single', 'اقتُطعت العمولة عند تحصيل الدين');
      }
    }

    allDebts = allDebts.filter(d => String(d.id) !== String(invId));
    await loadManualDebts();
    showToast('✅ تم التحصيل', 'ok');
    closeModal();
    renderDebts();
  } catch(e) { showToast('خطأ: ' + e.message, 'err'); }
  finally { __collectBusy = false; }
}

// خيار 2: تحصيل مبلغ جزئي — الباقي يبقى ديناً
async function collectDebtPartial(invId, remaining) {
  if (__collectBusy) return;
  const amountStr = await GMTAsk.prompt(`أدخل المبلغ المُحصَّل من أصل ${remaining.toFixed(2)}$:`);
  if (amountStr === null) return;
  const amount = parseFloat(String(amountStr).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,٫]/g, '.'));
  if (isNaN(amount) || amount <= 0 || amount > remaining + 0.004) { showToast('مبلغ غير صحيح', 'err'); return; }
  __collectBusy = true;
  try {
    const res = await applyInvoiceCollection(invId, amount);   // المدفوع = ما في القاعدة الآن + هذه الدفعة (لا نسخة الشاشة)
    if (res.complete) {
      await releaseCommOnCollect(invId);   // م6-ب: اكتمل السداد → تُستحق العمولة
      allDebts = allDebts.filter(d => String(d.id) !== String(invId));
    }
    showToast(`✅ تم تحصيل ${amount.toFixed(2)}$ — الباقي ${res.remaining.toFixed(2)}$ في صندوق الفرع`, 'ok');
    closeModal();
    renderDebts();
  } catch(e) { showToast('خطأ: ' + e.message, 'err'); }
  finally { __collectBusy = false; }
}

// تحصيل كل ديون فرع دفعة واحدة — فاتورةً فاتورة (متتابعة)، وتُحرَّر عمولات الآجل، ويُبلَّغ بما فشل
async function collectAllBranchDebts(branchKey, total) {
  if (__collectBusy) return;
  if (!await GMTAsk.confirm(`تحصيل كامل ديون هذا الفرع (${total.toFixed(2)}$)؟`)) return;
  const items = allDebts.filter(d => (d.branch_key||'unknown') === branchKey);
  __collectBusy = true;
  let okN = 0; const bad = [];
  try {
    for (const d of items) {
      try {
        const rem = Number(d.remaining_amount != null && d.remaining_amount !== '' ? d.remaining_amount : (Number(d.total) || 0) - (Number(d.paid_amount) || 0)) || 0;
        const res = await applyInvoiceCollection(d.id, rem);
        if (res.complete) await releaseCommOnCollect(d.id);
        okN++;
      } catch (e) { bad.push('#' + (d.inv_number || d.id) + ': ' + ((e && e.message) || e)); }
    }
    allDebts = allDebts.filter(d => !((d.branch_key||'unknown') === branchKey && !bad.some(b => b.indexOf('#' + (d.inv_number || d.id) + ':') === 0)));
    if (bad.length) showToast('⚠️ حُصِّلت ' + okN + ' وتعذّرت ' + bad.length + ' — ' + bad[0], 'err');
    else showToast('✅ تم تحصيل كامل ديون الفرع (' + okN + ' فاتورة)', 'ok');
    closeModal();
    renderDebts();
  } finally { __collectBusy = false; }
}

function _expUSD(e) { return e.currency === 'usd' ? Number(e.amount) || 0 : (Number(e.amount) || 0) / (Number(e.exchange_rate) || (window.GMT_DEFAULT_RATE || 140)); }
function _expByMonthHtml(list) {

  return Object.keys(groups).sort().reverse().map(k => {

async function approveAllPendingExpenses() {
  const scope = activeBranch === 'all' ? allExpenses : allExpenses.filter(e => e.branch_key === activeBranch);
  const list = scope.filter(e => !e.approved && !e.voided);
  if (!list.length) return;
  const tot = list.reduce((s, e) => s + _expUSD(e), 0);
  const src = await GMTAsk.choose(`الموافقة على ${list.length} مصروف (≈ ${tot.toFixed(2)}$) دفعةً واحدة.\nكلٌّ بسعر صرفه المسجّل. من أين دُفعت؟`, {
    title: 'مراجعة المصاريف', choices: [{ k: 'box', t: 'من صناديق الفروع — تُخصم', pri: 1 }, { k: 'admin', t: 'أنا دفعتها — لا تُخصم' }] });
  if (!src) return;
  let ok = 0;
  for (const e of list) {
    try {
      const body = { approved: true, approved_at: new Date().toISOString() };
      if (src === 'admin') body.note = ((e.note || '') + ' · دفعتها الإدارة — لم تُخصم من الصندوق').replace(/^ · /, '');
      const u = await sb('PATCH', `/rest/v1/gmt_expenses?id=eq.${e.id}&approved=is.false`, body, { Prefer: 'return=representation' });
      const r = Array.isArray(u?.data) ? u.data : (Array.isArray(u) ? u : []);
      if (!r.length) continue;
      e.approved = true; e.approved_at = body.approved_at; if (body.note) e.note = body.note;
      if (e.branch_key && src === 'box') await deductExpenseFromBranchCashbox(e.branch_key, Number(e.amount), e.currency, e.exchange_rate, e.title);
      await assetFromExpense(e);                                // (TASK-0210)
      ok++;
    } catch (_) {}
  }
  showToast(`✅ اعتُمد ${ok} من ${list.length}` + (src === 'box' ? ' — وخُصمت من صناديق فروعها' : ' — دفعتَها أنت'), ok === list.length ? 'ok' : 'err');
  renderExpenses();
}

/* تبديل الحساب لا يمسح ما كُتب */
function _expSwitchAcct(v) {
  const ids = ['exp-title', 'exp-date', 'exp-amount', 'exp-currency', 'exp-exchange-rate', 'exp-note'], keep = {};
  ids.forEach(id => { const el = document.getElementById(id); if (el) keep[id] = el.value; });
  openAddExpenseModal(v === 'drawing' ? 'drawing' : v === 'general');
  ids.forEach(id => { const el = document.getElementById(id); if (el && keep[id] != null) el.value = keep[id]; });
  try { toggleExpenseExchangeRate(); } catch (_) {}
}
window._expSwitchAcct = _expSwitchAcct;

function toggleExpenseExchangeRate() {
  const cur = document.getElementById('exp-currency')?.value;
  const wrap = document.getElementById('exp-exchange-wrap');
  if (wrap) wrap.style.display = cur === 'syp' ? '' : 'none';
}

async function saveExpense(isGeneral) {
  const isDrawing = isGeneral === 'drawing'; if (isDrawing) isGeneral = true;
  const branchKey = isGeneral ? null : document.getElementById('exp-branch')?.value;
  const dateStr   = document.getElementById('exp-date')?.value || '';
  const title      = document.getElementById('exp-title')?.value.trim();
  const amount     = parseFloat(document.getElementById('exp-amount')?.value);
  const currency   = document.getElementById('exp-currency')?.value || 'usd';
  const exchangeRate = currency === 'syp' ? parseFloat(document.getElementById('exp-exchange-rate')?.value) : null;
  const note       = document.getElementById('exp-note')?.value.trim();
  const kind       = document.getElementById('exp-kind')?.value || 'تشغيلي';
  const autoApprove = document.getElementById('exp-auto-approve')?.checked || false;

  if (!title) { showToast('أدخل السبب', 'err'); return; }
  /* التاريخ: اليوم ⇒ الآن · يومٌ سابق ⇒ ظهرُ ذلك اليوم بالتوقيت المحلّي (فلا ينزاح لشهرٍ آخر) */
  const _today = (window.GMTLedger && GMTLedger.localYMD) ? GMTLedger.localYMD(new Date()) : new Date().toISOString().slice(0, 10);
  if (dateStr && !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) { showToast('أدخل تاريخاً صحيحاً', 'err'); return; }
  if (dateStr && dateStr > _today) { showToast('التاريخ في المستقبل', 'err'); return; }
  const createdAt = (!dateStr || dateStr === _today) ? new Date().toISOString() : new Date(dateStr + 'T12:00:00').toISOString();
  if (isNaN(amount) || amount <= 0) { showToast('أدخل مبلغاً صحيحاً', 'err'); return; }
  if (currency === 'syp' && (isNaN(exchangeRate) || exchangeRate <= 0)) { showToast('أدخل سعر الصرف', 'err'); return; }

  try {
    const _row = {
      branch_key: branchKey, title, amount, currency,
      exchange_rate: exchangeRate, note: note || null,
      approved: autoApprove, approved_at: autoApprove ? new Date().toISOString() : null,
      is_general: isGeneral, created_at: createdAt, kind: isDrawing ? 'مسحوبات شخصية للمدير' : kind, requested_by: 'الإدارة',
    };
    let res;
    try { res = await sb('POST', '/rest/v1/gmt_expenses', _row); }
    catch (e1) {
      if (!/kind|requested_by/i.test(String(e1 && e1.message))) throw e1;
      /* SQL ٢٣ لم يُشغَّل ⇒ النوع في الملاحظة */
      const r2 = Object.assign({}, _row); delete r2.kind; delete r2.requested_by;
      r2.note = ['النوع: ' + kind, note].filter(Boolean).join(' · ');
      res = await sb('POST', '/rest/v1/gmt_expenses', r2);
    }
    const rec = Array.isArray(res) ? res[0] : res;
    if (rec) allExpenses.unshift(rec);
    const _asset = rec ? await assetFromExpense(rec) : null;   // (TASK-0210) رأسماليّ معتمد ⇒ سجلّ الأصول

    // إذا فرع ومُعتمد فوراً — ينقص من صندوق الفرع
    if (!isGeneral && branchKey && autoApprove) {
      await deductExpenseFromBranchCashbox(branchKey, amount, currency, exchangeRate, title);
    }

    showToast(isDrawing ? '✅ سُجّلت في المسحوبات الشخصية للمدير' : _asset ? '✅ حُفظ المصروف وسُجّل في سجلّ الأصول' : '✅ تم حفظ المصروف', 'ok');
    closeModal();
    renderExpenses();
  } catch(e) { showToast('خطأ: ' + e.message, 'err'); }
}

async function approveExpense(id) {
  const e = allExpenses.find(x => String(x.id) === String(id));
  if (!e) return;
  /* (٨ ت — تدقيق المطابقة) كانت الموافقة تخصم من صندوق الفرع دائماً. طلبك: «إذا فوترتُ المصاريف **وحدّدتُ** أنّه
     ينخصم من الصندوق فانخصمت تلقائياً» — وأحياناً تدفعها أنت. الآن تختار عند الموافقة. */
  const _amtTxt = `${Number(e.amount).toFixed(2)} ${e.currency==='usd'?'$':'ل.س'}`;
  let _src = 'box';
  if (e.branch_key && GMTAsk.choose) {
    _src = await GMTAsk.choose(`الموافقة على مصروف «${e.title}» بقيمة ${_amtTxt}.\nمن أين دُفع؟`, {
      title: 'موافقة على مصروف',
      choices: [{ k: 'box', t: 'من صندوق الفرع — يُخصم', pri: 1 }, { k: 'admin', t: 'أنا دفعته — لا يُخصم من الصندوق' }]
    });
    if (!_src) return;
  } else if (!await GMTAsk.confirm(`الموافقة على مصروف "${e.title}" بقيمة ${_amtTxt}؟`)) return;
  /* (٨ ث — تدقيق المطابقة) سعر الصرف يقرّره الأدمن عند الموافقة — كان يُؤخذ من الكاشير أو ١٤٠ بلا سؤال */
  let _rate = Number(e.exchange_rate) || 0;
  if (e.currency !== 'usd') {
    const _rs = await GMTAsk.prompt(`سعر الصرف لهذا المصروف (ليرة لكل دولار):`, { title: 'سعر الصرف', value: String(_rate || (window.GMT_DEFAULT_RATE || 140)), inputType: 'number', dir: 'ltr' });
    if (_rs === null) return;
    const _rn = parseFloat(_rs);
    if (!(_rn > 0)) { showToast('سعر صرف غير صحيح', 'err'); return; }
    _rate = _rn;
  }
  try {
    /* 🛡️ (2026-08-24) **الأخطر في المحاسبة**: هذه الدالة تعتمد المصروف ثم
       **تخصمه من صندوق الفرع**. بلا شرط `approved=is.false` كان الاعتماد المزدوج
       (ضغطتان أو جهازان) **يخصم المبلغ مرّتين من الصندوق**.
       الآن: من يفوز بالاعتماد وحده يُكمل الخصم. */
    const _body = { approved: true, approved_at: new Date().toISOString() };
    if (e.currency !== 'usd' && _rate > 0 && _rate !== Number(e.exchange_rate)) _body.exchange_rate = _rate;
    if (_src === 'admin') _body.note = ((e.note || '') + ' · دفعتها الإدارة — لم تُخصم من الصندوق').replace(/^ · /, '');
    const _u = await sb('PATCH', `/rest/v1/gmt_expenses?id=eq.${id}&approved=is.false`,
      _body, { Prefer:'return=representation' });
    const _r = Array.isArray(_u?.data) ? _u.data : (Array.isArray(_u) ? _u : []);
    if (!_r.length) { showToast('⛔ هذا المصروف معتمَد مسبقاً — لم يُخصم مجدّداً', 'err'); return; }
    e.approved = true; e.approved_at = new Date().toISOString();

    if (_src === 'admin') e.note = _body.note;
    if (_body.exchange_rate) e.exchange_rate = _body.exchange_rate;
    if (e.branch_key && _src === 'box') {
      await deductExpenseFromBranchCashbox(e.branch_key, Number(e.amount), e.currency, _rate || e.exchange_rate, e.title);
    }
    const _asA = await assetFromExpense(e);                     // (TASK-0210)
    if (_asA) showToast('🏢 سُجّل «' + (e.title || '') + '» في سجلّ الأصول', 'ok');
    showToast(_src === 'admin' ? '✅ تمت الموافقة — دفعتَها أنت، والصندوق لم يُمسّ' : '✅ تمت الموافقة — خُصمت من صندوق الفرع', 'ok');
    renderExpenses();
  } catch(err) { showToast('خطأ: ' + err.message, 'err'); }
}

async function editExpenseAmount(id) {
  const e = allExpenses.find(x => String(x.id) === String(id));
  if (!e) return;
  const newAmountStr = await GMTAsk.prompt('تعديل المبلغ:', { value: e.amount });
  if (newAmountStr === null) return;
  const newAmount = parseFloat(newAmountStr);
  if (isNaN(newAmount) || newAmount <= 0) { showToast('مبلغ غير صحيح', 'err'); return; }
  try {
    await sb('PATCH', `/rest/v1/gmt_expenses?id=eq.${id}`, { amount: newAmount }, { Prefer:'return=minimal' });
    e.amount = newAmount;
    showToast('✅ تم التعديل', 'ok');
    renderExpenses();
  } catch(err) { showToast('خطأ: ' + err.message, 'err'); }
}

async function deleteExpense(id) {
  const _e = allExpenses.find(x => String(x.id) === String(id));
  if (_e && window.GMTLedger && GMTLedger.poInfo(_e)) { showToast('هذا الصفّ يتبع فاتورة شراء — عدّل الدفعة من فاتورة الشراء فيتبدّل هنا تلقائياً', 'err'); return; }
  // ADM-4 (2026-08-03): المصاريف سجلّ مالي — تُبطَل مع أثر بدل الحذف النهائي.
  const reason = await GMTAsk.prompt('⚠️ إبطال المصروف\n\nلا يُحذف — يبقى بالقاعدة للتدقيق ويُخفى من القائمة.\nاكتب سبب الإبطال (إجباري):');
  if (reason === null) return;
  if (!reason.trim()) { showToast('سبب الإبطال إجباري', 'err'); return; }
  try {
    await sb('PATCH', `/rest/v1/gmt_expenses?id=eq.${id}`,
      { voided:true, voided_at:new Date().toISOString(), voided_by:'admin', void_reason:reason.trim() },
      { Prefer:'return=minimal' });
    allExpenses = allExpenses.filter(x => x.id !== id);
    /* 🔴 (مراجعة ACCT-7) مصروفٌ معتمد دُفع من درج فرعٍ خُصم من صندوقه بحركة type='expense' — إبطاله بلا عكس تلك الحركة يُبقي الدرج ناقصاً للأبد
       بينما يُمحى المصروف من الربح. نعكسها بحركةٍ موجبة (استرداد) بنفس القيمة. */
    let _reverted = '';
    if (_e && _e.approved && _e.branch_key && window.GMTLedger && GMTLedger.cashSource(_e) === 'branch') {
      try {
        const b = branches.find(x => x.key_name === _e.branch_key);
        const usdAmt = Math.abs(GMTLedger.usd(_e));
        const res = await adminCashPost({
          branch_key: _e.branch_key, branch_name: b?.display_name || _e.branch_key, amount: usdAmt, type: 'expense',
          note: 'إبطال مصروف: ' + (_e.title || '') + ' — استرداد لصندوق الفرع', created_by: (window.GMTRole && GMTRole.name && GMTRole.name()) || 'الإدارة', created_at: new Date().toISOString()
        });
        const t = Array.isArray(res) ? res[0] : (Array.isArray(res?.data) ? res.data[0] : res);
        if (t && t.branch_key) allTransfers.push(t);
        _reverted = ' · أُعيد ' + usdAmt.toFixed(2) + '$ لصندوق الفرع';
      } catch (e2) { _reverted = ' · ⚠️ تعذّر عكس خصم الصندوق: ' + ((e2 && e2.message) || e2); }
    }
    const _av = _e ? await voidAssetOfExpense(_e, reason.trim()) : 0;   // (TASK-0210) وأصله
    showToast('✅ أُبطل المصروف (محفوظ للتدقيق)' + _reverted + (_av ? ' · وأُبطل أصله من السجلّ' : ''), _reverted.indexOf('⚠️') >= 0 ? 'err' : 'ok');
    renderExpenses();
  } catch(e) { showToast('خطأ: ' + e.message + ' — شغّل _SQL/1️⃣2️⃣ لتفعيل الإبطال', 'err'); }
}

// خصم المصروف من صندوق الفرع — يستخدم نفس جدول branch_transfers المستخدم في الترحيلات والتحصيل
async function deductExpenseFromBranchCashbox(branchKey, amount, currency, exchangeRate, title) {
  try {
    const usdAmount = currency === 'usd' ? amount : amount / (Number(exchangeRate)|| (window.GMT_DEFAULT_RATE||140));
    const b = branches.find(x => x.key_name === branchKey);
    await adminCashPost({
      branch_key  : branchKey,
      branch_name : b?.display_name || branchKey,
      amount      : -Math.abs(usdAmount),   // سالب = خصم من الصندوق
      type        : 'expense',              // نوع جديد "مصروف"
      note        : `مصروف: ${title}`,
      created_by  : 'الإدارة (موافقة مصروف)',
      created_at  : new Date().toISOString(),
    });
    return true;
  } catch(e) {
    /* 🔧 (2026-08-24) [P14] كان الفشل يُسجَّل في console فقط ⇒ **المصروف يُعتمد
       ولا يُخصم من الصندوق**، فيبقى رصيد الصندوق أعلى من الحقيقة بلا أي أثر.
       الآن: إنذار مالي + رسالة صريحة تطلب التسجيل اليدوي. */
    const msg = (e && e.message) ? e.message : String(e);
    console.warn('[Expenses] فشل تسجيل حركة الصندوق:', msg);
    try {
      if (window.GMTWarden && GMTWarden.flag) {
        GMTWarden.flag({ kind:'financial', severity:'critical', feature:'CASHBOX', rule:'OWN-CASH-TRUTH',
          title:'مصروف لم يُخصم من الصندوق',
          what:'المصروف «' + (title||'—') + '» بمبلغ ' + amount + ' ' + (currency||'') +
               ' اعتُمد لكن **لم تُسجَّل حركة الصندوق** لفرع ' + branchKey + ' (' + msg + ').',
          why:'رصيد الصندوق أعلى من الحقيقة — سجّل الحركة يدوياً.' });
      } else if (window.GMTBug && GMTBug.log) {
        GMTBug.log('error','فشل خصم مصروف من الصندوق: '+msg,{type:'cashbox_deduct_fail',branchKey,amount});
      }
    } catch(_) {}
    try { showToast('⚠️ اعتُمد المصروف لكن لم يُخصم من الصندوق — سجّله يدوياً','err'); } catch(_) {}
    return false;
  }
}

async function loadCustomers() {

/* (TASK-0211 · المالك seq 139 «ما في عندي انزلهم كملفات جهات الاتصال لحتى يتسيفوا على اي جهاز») ملفّ vCard واحد بكل العملاء
   الظاهرين (البحث والفلتر والفرع كما هي): الاسم · الجوال بصيغة دوليّة (+963) · الوجهة عنواناً · الفرع ونوع العميل في الملاحظة.
   يُفتح على أيّ هاتف أو حاسوب فيُستورد إلى جهات الاتصال دفعةً واحدة — مشاركة على الهاتف، تنزيل على الحاسوب. */
let _custShown = null;
function _vcfEsc(v) { return String(v == null ? '' : v).replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n').replace(/([,;])/g, '\\$1'); }
function _vcfPhone(p) {
  const d = String(p || '').replace(/[^0-9]/g, '').replace(/^00/, '');
  if (/^9639\d{8}$/.test(d)) return '+' + d;
  if (/^09\d{8}$/.test(d)) return '+963' + d.slice(1);
  if (/^9\d{8}$/.test(d)) return '+963' + d;
  return d ? (String(p).trim().startsWith('+') ? '+' : '') + d : '';
}
function customersVcf(list) {
  const out = [];
  (list || []).forEach(c => {
    const tel = _vcfPhone(c.phone); if (!tel) return;
    const nm = String(c.name || '').trim() || tel;
    const br = c.branch_name || (branches.find(b => b.key_name === c.branch_key) || {}).display_name || c.branch_key || '';
    const note = ['زبون GMT', br ? 'الفرع: ' + br : '', c.customer_type === 'wholesale' ? 'جملة' : c.customer_type === 'retail' ? 'مفرق' : '', c.notes || ''].filter(Boolean).join(' · ');
    out.push('BEGIN:VCARD', 'VERSION:3.0', 'N:' + _vcfEsc(nm) + ';;;;', 'FN:' + _vcfEsc(nm), 'TEL;TYPE=CELL:' + tel,
      ...(c.address ? ['ADR;TYPE=HOME:;;' + _vcfEsc(c.address) + ';;;;'] : []), 'ORG:' + _vcfEsc('عملاء General Media Tech'), 'NOTE:' + _vcfEsc(note), 'END:VCARD');
  });
  return out.join('\r\n') + (out.length ? '\r\n' : '');
}
async function exportCustomersVcf() {
  const t0 = Date.now(), list = (_custShown || allCustomers || []).filter(c => _vcfPhone(c.phone));
  if (!list.length) { showToast('لا عملاء بأرقام جوال لتنزيلهم', 'err'); return; }
  const blob = new Blob([customersVcf(list)], { type: 'text/vcard' });
  const name = 'عملاء-GMT-' + (window.GMTLedger && GMTLedger.localYMD ? GMTLedger.localYMD(new Date()) : new Date().toISOString().slice(0, 10)) + '.vcf';
  try {
    if (window.GMTShare && GMTShare.deliver) await GMTShare.deliver(blob, name, { t0, title: 'جهات اتصال العملاء (' + list.length + ')' });
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
    showToast('📇 ' + list.length + ' جهة اتصال — افتح الملفّ على الهاتف لإضافتها كلّها', 'ok');
  } catch (e) { showToast('تعذّر تجهيز الملفّ: ' + (e.message || e), 'err'); }
}
window.exportCustomersVcf = exportCustomersVcf;

/* (2026-10-06 ش) البند ١٥: «زرّ سياديّ: حذف بيانات عميلٍ أُدخلت خطأً». يطلب كلمة السرّ السياديّة،
