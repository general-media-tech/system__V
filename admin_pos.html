/* ══ ملف الزبون الموحّد (2026-08-26 · طلب المالك: «موجود بس مو موسّع — زبّطه») ══
   كان يعرض عدد الفواتير والمجموع فقط. الآن يجمع **كل** ما يخصّ الزبون من:
     • نقطة البيع (invoices + invoice_items)  — قاعدة MAIN
     • الأوردرات (gmt_orders)                 — قاعدة MAIN
     • الكفالات (warranties)                  — قاعدة WARRANTY
   المفتاح: رقم الهاتف. قراءة فقط. */
function _normPhone(p){ return (window.GMTPhone ? GMTPhone.norm(p) : String(p||'').replace(/\D/g,'').replace(/^(00963|963|0)/,'')); }  /* يفوّض لـGMTPhone (المصدر الوحيد) */

async function openCustomerProfile(phone, name) {
  const key = _normPhone(phone);
  const old = document.getElementById('cust-profile'); if (old) old.remove();
  const w = document.createElement('div');
  w.id = 'cust-profile';
  w.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:0;direction:rtl;font-family:inherit';
  w.onclick = e => { if (e.target === w) w.remove(); };
  const shell = (inner) => '<div style="background:var(--bg,#f8fafc);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0" onclick="event.stopPropagation()">' +
    '<div style="background:#0f172a;color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2">' +
    '<div><div style="font-size:16px;font-weight:900">👤 ' + escH(name || '—') + '</div>' +
    '<div style="font-size:11px;opacity:.7;font-weight:700;direction:ltr;text-align:right">' + escH(phone || '') + '</div></div>' +
    '<button onclick="document.getElementById(\'cust-profile\').remove()" style="background:rgba(255,255,255,.15);border:0;color:#fff;width:32px;height:32px;border-radius:10px;font-size:16px;cursor:pointer">✕</button></div>' +
    '<div style="padding:14px 16px">' + inner + '</div></div>';
  w.innerHTML = shell('<div style="text-align:center;padding:30px;color:#5b6472;font-weight:700">⏳ جارٍ جمع ملف الزبون من كل الأقسام…</div>');
  document.body.appendChild(w);

  // ① فواتير نقطة البيع (من الذاكرة المحمّلة)
  const invs = (allInvoices || []).filter(i => _normPhone(i.customer_phone) === key && key)
    .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
  // ② بنود الفواتير — ما اشتراه فعلاً
  let items = [];
  if (invs.length) {
    const ids = invs.slice(0, 60).map(i => i.id).join(',');
    try { items = await sb('GET', `/rest/v1/invoice_items?invoice_id=in.(${ids})&select=invoice_id,product_name,qty,unit_price,total`) || []; } catch (_) {}
  }
  // ③ الأوردرات
  let orders = [];
  try {
    const raw = String(phone || '').trim();
    orders = await sb('GET', `/rest/v1/gmt_orders?phone=ilike.*${encodeURIComponent(key.slice(-8))}*&select=id,serial_code,status,price,product,shipping_company,created_at&order=created_at.desc&limit=30`) || [];
  } catch (_) {}
  // ④ الكفالات (قاعدة WARRANTY مستقلّة)
  let warr = [];
  try {
    const W = window.GMT_DB && GMT_DB.WARRANTY;
    if (W && key) {
      const r = await fetch(`${W.url}/rest/v1/warranties?phone_no=ilike.*${encodeURIComponent(key.slice(-8))}*&select=short_id,product_name,serial_no,warranty_type,expiry,created_at&order=created_at.desc&limit=30`,
        { headers: { apikey: W.key, Authorization: 'Bearer ' + W.key } });
      if (r.ok) warr = await r.json();
    }
  } catch (_) {}

  // ── الحساب ──
  const f = n => (Number(n) || 0).toFixed(2);
  const sales   = invs.filter(i => Number(i.total) > 0);
  const refunds = invs.filter(i => Number(i.total) < 0);
  const spent   = sales.reduce((s, i) => s + (Number(i.total) || 0), 0);
  const refunded= Math.abs(refunds.reduce((s, i) => s + (Number(i.total) || 0), 0));
  const unpaid  = invs.reduce((s, i) => s + (Number(i.remaining_amount) || 0), 0);
  const ordTotal= orders.reduce((s, o) => s + (Number(o.price) || 0), 0);
  const first   = [...invs, ...orders].map(x => x.created_at).filter(Boolean).sort()[0];
  const last    = [...invs, ...orders].map(x => x.created_at).filter(Boolean).sort().pop();
  // أكثر ما يشتريه
  const byProd = {};
  items.forEach(it => {
    const k = it.product_name || '—';
    byProd[k] = byProd[k] || { qty: 0, total: 0 };
    byProd[k].qty += Number(it.qty) || 0; byProd[k].total += Number(it.total) || 0;
  });
  const top = Object.entries(byProd).sort((a, b) => b[1].total - a[1].total).slice(0, 8);
  const now = Date.now();
  const activeW = warr.filter(x => x.expiry && new Date(x.expiry) > now).length;

  const stat = (lbl, val, col) => '<div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px 12px">' +
    '<div style="font-size:10px;color:#5b6472;font-weight:800">' + lbl + '</div>' +
    '<div style="font-size:16px;font-weight:900;color:' + col + '">' + val + '</div></div>';
  const sec = (t) => '<div style="font-size:12px;font-weight:900;color:#0f172a;margin:16px 0 8px">' + t + '</div>';
  const d = s => s ? new Date(s).toLocaleDateString('ar-SY') : '—';
  const stAr = { pending:'⏳ بالانتظار', prepared:'📦 جاهز', shipped:'🚚 بالطريق', delivered:'📍 للتحصيل', completed:'✅ مكتمل' };

  let html =
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
      stat('إجمالي مشترياته (نقطة البيع)', f(spent) + ' $', '#047857') +
      stat('أوردرات الشحن', orders.length + ' · ' + f(ordTotal) + ' $', '#1d4ed8') +
      stat('عدد الفواتير', sales.length + (refunds.length ? ' · ' + refunds.length + ' مرتجع' : ''), '#0f172a') +
      stat('عليه (آجل غير مدفوع)', f(unpaid) + ' $', unpaid > 0 ? '#dc2626' : '#94a3b8') +
      stat('الكفالات', warr.length + (activeW ? ' · ' + activeW + ' سارية' : ''), '#D5001C') +
      stat('زبون منذ', d(first), '#475569') +
    '</div>' +
    (refunded > 0 ? '<div style="font-size:11px;color:#b91c1c;font-weight:800;margin-top:8px">↩️ مرتجعات بقيمة ' + f(refunded) + ' $</div>' : '') +
    (last ? '<div style="font-size:11px;color:#526077;font-weight:700;margin-top:4px">آخر نشاط: ' + d(last) + '</div>' : '');

  if (top.length) {
    html += sec('🛍️ أكثر ما يشتريه');
    html += top.map(([n, v]) => '<div style="display:flex;justify-content:space-between;padding:7px 10px;background:#fff;border:1px solid #f1f5f9;border-radius:9px;margin-bottom:4px;font-size:12px;font-weight:700">' +
      '<span>' + escH(n) + ' <span style="color:#526077">×' + v.qty + '</span></span><b>' + f(v.total) + ' $</b></div>').join('');
  }
  if (sales.length) {
    html += sec('🧾 فواتير نقطة البيع (' + invs.length + ')');
    html += invs.slice(0, 15).map(i => '<div style="display:flex;justify-content:space-between;padding:7px 10px;background:#fff;border:1px solid #f1f5f9;border-radius:9px;margin-bottom:4px;font-size:12px;font-weight:700">' +
      '<span>' + d(i.created_at) + ' · ' + escH(i.branch_name || i.branch_key || '') + ' · ' + escH(i.sale_type || '') + '</span>' +
      '<b style="color:' + (Number(i.total) < 0 ? '#dc2626' : '#0f172a') + '">' + f(i.total) + ' $</b></div>').join('');
  }
  if (orders.length) {
    html += sec('🚚 أوردرات الشحن (' + orders.length + ')');
    html += orders.slice(0, 15).map(o => '<div style="display:flex;justify-content:space-between;padding:7px 10px;background:#fff;border:1px solid #f1f5f9;border-radius:9px;margin-bottom:4px;font-size:12px;font-weight:700">' +
      '<span>' + d(o.created_at) + ' · ' + escH(o.serial_code || '#' + o.id) + ' · ' + (stAr[o.status] || escH(o.status || '')) + '</span>' +
      '<b>' + f(o.price) + ' $</b></div>').join('');
  }
  if (warr.length) {
    html += sec('🛡️ الكفالات (' + warr.length + ')');
    html += warr.slice(0, 15).map(x => {
      const alive = x.expiry && new Date(x.expiry) > now;
      return '<div style="padding:7px 10px;background:#fff;border:1px solid #f1f5f9;border-radius:9px;margin-bottom:4px;font-size:12px;font-weight:700">' +
        escH(x.product_name || '—') + (x.serial_no ? ' <span style="color:#526077">· ' + escH(x.serial_no) + '</span>' : '') +
        '<div style="font-size:10px;margin-top:2px;color:' + (alive ? '#047857' : '#94a3b8') + '">' +
        (alive ? '✅ سارية حتى ' : '⏹️ منتهية ') + d(x.expiry) + ' · ' + escH(x.short_id || '') + '</div></div>';
    }).join('');
  }
  if (!invs.length && !orders.length && !warr.length) {
    html += '<div style="text-align:center;padding:24px;color:#5b6472;font-weight:700">لا توجد مشتريات أو أوردرات أو كفالات مسجّلة لهذا الرقم</div>';
  }
  w.innerHTML = shell(html);
}

async function toggleBlockCustomer(custId, block, name) {
  const msg = block ? `حظر العميل "${name}"؟` : `رفع الحظر عن "${name}"؟`;
  if (!await GMTAsk.confirm(msg)) return;
  try {
    await sb('PATCH', `/rest/v1/gmt_customers?id=eq.${custId}`,
      { is_blocked: block }, { Prefer: 'return=minimal' });
    const c = allCustomers.find(x => String(x.id) === String(custId));
    if (c) c.is_blocked = block;
    showToast(block ? '🚫 تم حظر العميل' : '✅ تم رفع الحظر', block ? 'err' : 'ok');
    renderCustomers();
  } catch(e) {
    showToast('خطأ: ' + e.message + ' (تأكد من وجود جدول gmt_customers)', 'err');
  }
}

/* ══ (11 ت١ · طلب المالك) «ادخل نقطة البيع كأني موظّف فيها وأنا الأدمن، بنفس واجهتهم تماماً» ══
   يفتح نقطة البيع نفسها (pos.html) على فرع تختاره: مخزونه وكاشيره كما يراهما الموظف. الجلسة في sessionStorage (هذا التبويب فقط) فلا تمسّ
   جلسة أيّ موظف على الجهاز. كل فاتورة تُكتب باسمك «الأدمن …» ومعها ملاحظة «نيابةً عن نقطة X»، ولا عمولة تلقائية لها. شريط ثابت أعلى الصفحة
   يذكّرك بأنك داخل كأدمن وفيه زرّ الخروج. */
async function adminEnterPos(branchKey) {
  const b = (branches || []).find(x => x.key_name === branchKey);
  if (!b) { showToast('اختر نقطة بيع', 'err'); return; }
  if (!(await GMTRole.requireAdmin('الدخول إلى نقطة بيع كموظف'))) return;
  let nm = '';
  try { nm = ((window.GMTRole && GMTRole.name && GMTRole.name()) || localStorage.getItem('gmt_operator_name') || '').trim(); } catch (_) {}
  if (!nm) {
    const n = await GMTAsk.prompt('اكتب اسمك — يُكتب على كل فاتورة تنشئها داخل نقطة البيع («الأدمن …»).', { title: 'اسم الأدمن', okText: 'متابعة' });
    if (n === null || !String(n).trim()) return;
    nm = String(n).trim();
    try { localStorage.setItem('gmt_operator_name', nm); } catch (_) {}
  }
  try { sessionStorage.setItem('gmt_acting', JSON.stringify({ branch_key: b.key_name, branch_name: b.display_name || b.key_name, admin: nm, at: Date.now() })); } catch (_) { showToast('تعذّر فتح الجلسة (التخزين محجوب)', 'err'); return; }
  try { await GMTAudit?.log?.({ action: 'admin_enter_pos', entity: 'pos', entityId: b.key_name, entityName: b.display_name || b.key_name, reason: 'دخول الأدمن ' + nm + ' إلى نقطة البيع كموظف' }); } catch (_) {}
  location.href = 'pos.html?acting=1';
}
window.adminEnterPos = adminEnterPos;

  else { area.style.opacity = '0.5'; area.style.pointerEvents = 'none'; }

function aiSearchProducts(q) {
  const box = document.getElementById('ai-search-results');
  q = (q || '').trim().toLowerCase();
  if (!q) { box.style.display = 'none'; return; }

  const matches = _aiProducts.filter(p =>
    (p.name || '').toLowerCase().includes(q) || (p.barcode || '').includes(q)
  ).slice(0, 20);
  if (!matches.length) { box.innerHTML = '<div style="padding:12px;color:var(--text3);font-size:12px;">لا نتائج</div>'; box.style.display = 'block'; return; }
  box.innerHTML = matches.map(p => {
    const stock = Number(p[branchKey]) || 0;
    return `<div onclick="aiAddToCart('${escH(String(p.id))}')" style="padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;" onmouseover="this.style.background='#f9fafb'" onmouseout="this.style.background='#fff'">
      <div style="flex:1;min-width:0;">
        <div style="font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escH(p.name || '')}</div>
        <div style="font-size:10px;color:var(--text3);">${p.barcode ? escH(p.barcode) + ' · ' : ''}متوفر: ${stock} · ${Number(p.price||0).toFixed(2)}$</div>
      </div>
      ${stock <= 0 ? '<span style="font-size:10px;color:var(--danger);font-weight:800;">نفد</span>' : ''}
    </div>`;
  }).join('');
  box.style.display = 'block';
}

function aiAddToCart(productId) {
  const branchKey = document.getElementById('ai-branch').value;
  const p = _aiProducts.find(x => String(x.id) === String(productId));
  if (!p) return;
  const stock = Number(p[branchKey]) || 0;
  const existing = _aiCart.find(x => String(x.id) === String(productId));
  if (existing) {
    if (existing.qty < stock) existing.qty++;
    else { showToast('الكمية تجاوزت المتوفر بالفرع', 'err'); }
  } else {
    _aiCart.push({ id: p.id, name: p.name, barcode: p.barcode || '', price: Number(p.price) || 0, qty: 1, stock });
  }
  document.getElementById('ai-search').value = '';
  document.getElementById('ai-search-results').style.display = 'none';
  aiRenderCart();
}

/* ══════════════════════════════════════════════════════════════════════════
   📦 استيراد منتجات أوردر إلى فاتورة الإدارة — (2026-09-27 · طلب المالك)
   نفس الوحدة المشتركة التي تستعملها نقطة البيع: قاعدة واحدة للمخزون ولليقين،
   فلا يُرحَّل من هنا ما يُمنَع هناك.
   ══════════════════════════════════════════════════════════════════════════ */
let _aiOrders = [];
/* (٨ ث — تدقيق المطابقة) فاتورة الأدمن من أوردر **لم تكن تُربط به**: لا order_id على الفاتورة ولا رقمُها على الأوردر ⇒
   الأوردر يبقى «بلا فاتورة» ويُفوتَر مرّةً ثانية، والعمولة تُكتب عليه رغم قرار ت٩. الآن تُربط كما تربط نقطة البيع. */
let _aiLinkedOrder = null;
function aiShowLinkedOrder() {
  let el = document.getElementById('ai-linked-order');
  const res = document.getElementById('ai-order-results');
  if (!el && res) { el = document.createElement('div'); el.id = 'ai-linked-order'; res.parentNode.insertBefore(el, res.nextSibling); }
  if (!el) return;
  const o = _aiLinkedOrder;
  el.style.cssText = o ? 'display:flex;align-items:center;gap:8px;background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:9px;padding:8px 10px;margin-bottom:10px;font-size:12.5px;font-weight:800;color:#1e3a8a;' : 'display:none';
  el.innerHTML = o ? `<span style="flex:1">مرتبطة بالأوردر #${escH(o.serial_code || o.id)} — ${escH(o.name || '')} · بلا عمولة (قرار ت٩)</span>
    <button type="button" onclick="_aiLinkedOrder=null;aiShowLinkedOrder()" style="border:0;background:#fff;border-radius:7px;padding:4px 9px;font-family:'Cairo',sans-serif;font-weight:800;cursor:pointer;color:#b91c1c">فكّ الربط</button>` : '';
  const cm = document.getElementById('ai-commission');
  if (cm && o) cm.checked = false;
}
window.aiShowLinkedOrder = aiShowLinkedOrder;

async function aiFindOrder() {
  const branchKey = document.getElementById('ai-branch').value;
  if (!branchKey) { showToast('اختر الفرع أولاً — المخزون يُقرأ منه', 'err'); return; }
  const q = (document.getElementById('ai-order-q').value || '').trim();
  const box = document.getElementById('ai-order-results');
  box.innerHTML = '<div style="padding:10px;font-size:12px;color:var(--text3);text-align:center;">…جارٍ البحث</div>';
  box.style.display = 'block';
  try {
    const filter = q
      ? `or=(name.ilike.*${encodeURIComponent(q)}*,serial_code.ilike.*${encodeURIComponent(q)}*,phone.ilike.*${encodeURIComponent(q)}*)&is_locked=eq.false`
      : `status=eq.pending&is_locked=eq.false`;
    const rows = await sb('GET', `/rest/v1/gmt_orders?${filter}&order=created_at.desc&limit=${q ? 15 : 20}&select=*`);
    _aiOrders = Array.isArray(rows) ? rows : [];
    if (!_aiOrders.length) {
      box.innerHTML = '<div style="padding:10px;font-size:12px;color:var(--text3);text-align:center;">لا نتائج (الأوردرات المقفولة لا تظهر)</div>';

    }
    box.innerHTML = _aiOrders.map(o => `
      <div onclick="aiImportOrder('${escH(String(o.id))}')" style="padding:9px 12px;border-bottom:1px solid var(--border);cursor:pointer;">
        <div style="font-size:12.5px;font-weight:800;">${escH(o.name || '')} — $${(Number(o.price)||0).toFixed(2)}</div>
        <div style="font-size:10px;color:var(--text3);">#${escH(o.serial_code || o.id)} · ${escH(o.branch || '')}</div>

  } catch (e) {
    box.innerHTML = `<div style="padding:10px;font-size:12px;color:var(--danger);text-align:center;">تعذّر البحث: ${escH(e.message || '')}</div>`;

}
window.aiFindOrder = aiFindOrder;

function aiImportOrder(id) {
  const o = _aiOrders.find(x => String(x.id) === String(id));
  if (!o) return;
  const branchKey = document.getElementById('ai-branch').value;
  document.getElementById('ai-order-results').style.display = 'none';
  if (!window.GMTOrderToInvoice) { showToast('وحدة ترحيل الأوردر غير محمّلة', 'err'); return; }
  GMTOrderToInvoice.open({
    order: o,
    catalog: _aiProducts,
    stockOf: p => Number(p[branchKey]) || 0,
    priceOf: p => Number(p.price) || 0,
    /* 🔴 (2026-10-03 · بلاغ المالك) «لما بكتب أفوتر يدوياً ما عبّا بيانات العميل».
       كانت تعبئة اسم العميل داخل `onConfirm` **وحدها**. فمن ضغط «أفوتر يدوياً»
       أو جاءه أوردرٌ بلا قطع يخرج بحقل عميلٍ فارغ — رغم أنّ الأوردر بين يديه
       واسمُ صاحبه معروف. التعبئة لا علاقة لها بالقطع: هي من الأوردر لا منها.
       ⇒ صارت في دالّةٍ واحدة تُستدعى من المسارات الثلاثة. */
    onEmpty: () => { aiFillCustomerFrom(o); showToast('هذا الأوردر بلا قائمة قطع — أضف المنتجات يدوياً', 'inf'); },
    onSkip:  () => { aiFillCustomerFrom(o); showToast('فوترة يدوية — بيانات العميل عُبِّئت من الأوردر', 'inf'); },
    onConfirm: (picked, left) => {
      picked.forEach(x => {
        const p = x.product;
        const stock = Number(p[branchKey]) || 0;
        const qty = Math.min(Math.max(1, Number(x.qty) || 1), stock);   // لا نتجاوز المتوفّر
        const ex = _aiCart.find(c => String(c.id) === String(p.id));
        if (ex) ex.qty = Math.min(ex.qty + qty, stock);
        else _aiCart.push({ id: p.id, name: p.name, barcode: p.barcode || '',
                            price: Number(x.price) || Number(p.price) || 0, qty, stock });
      });
      aiRenderCart();
      aiFillCustomerFrom(o);
      if (picked.length) showToast(`✅ نُقلت ${picked.length} قطعة من الأوردر #${o.serial_code || o.id}`, 'ok');
      if (left)          showToast(`⚠️ ${left} قطعة لم تُنقَل — أضفها يدوياً`, 'err');
    }
  });
}
/* يعبّئ بيانات العميل من الأوردر — من أي مسار (نقل · تخطٍّ · أوردر بلا قطع).
   لا يدهس ما كتبه المستخدم بيده. */
function aiFillCustomerFrom(o) {
  if (!o) return;
  if (!o.is_locked && !o.invoice_id) { _aiLinkedOrder = o; aiShowLinkedOrder(); }
  else showToast('⚠️ هذا الأوردر مرتبطٌ مسبقاً بفاتورة #' + (o.invoice_number || o.invoice_id) + ' — لن تُربط به هذه', 'err');
  const cust = document.getElementById('ai-customer');
  if (cust && !cust.value.trim() && o.name) cust.value = o.name;
  const ph = document.getElementById('ai-phone');
  if (ph && !ph.value.trim() && o.phone) ph.value = o.phone;
}
window.aiFillCustomerFrom = aiFillCustomerFrom;

window.aiImportOrder = aiImportOrder;

function aiRenderCart() {
  const box = document.getElementById('ai-cart-items');
  if (!_aiCart.length) {
    box.innerHTML = '<p style="text-align:center;color:var(--text3);font-size:13px;padding:20px 0;">لم تُضف منتجات بعد</p>';
    aiUpdateTotal();
    return;
  }
  box.innerHTML = _aiCart.map((it, i) => `
    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);">
      <div style="flex:1;min-width:0;">
        <div style="font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escH(it.name)}</div>
        <div style="font-size:10px;color:var(--text3);">متوفر: ${it.stock}</div>
      </div>
      <input type="number" min="0" step="0.01" value="${it.price}" onchange="aiSetPrice(${i}, this.value)" title="السعر" style="width:80px;padding:7px;border:1.5px solid var(--border);border-radius:7px;text-align:center;font-size:12px;font-weight:700;font-family:'Cairo',sans-serif;">
      <input type="number" min="1" max="${it.stock}" value="${it.qty}" onchange="aiSetQty(${i}, this.value)" title="الكمية" style="width:60px;padding:7px;border:1.5px solid var(--border);border-radius:7px;text-align:center;font-size:12px;font-weight:800;font-family:'Cairo',sans-serif;">
      <span style="width:70px;text-align:left;font-size:13px;font-weight:800;color:var(--red);">${(it.price*it.qty).toFixed(2)}$</span>
      <button onclick="aiRemoveItem(${i})" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:16px;padding:4px;">✕</button>
    </div>`).join('');
  aiUpdateTotal();
}

function aiSetPrice(i, val) { if (_aiCart[i]) { _aiCart[i].price = Math.max(0, Number(val) || 0); aiRenderCart(); } }
function aiSetQty(i, val) {
  if (!_aiCart[i]) return;
  let q = parseInt(val) || 1;
  if (q > _aiCart[i].stock) { q = _aiCart[i].stock; showToast('الكمية القصوى = المتوفر بالفرع', 'err'); }
  if (q < 1) q = 1;
  _aiCart[i].qty = q;
  aiRenderCart();
}
function aiRemoveItem(i) { _aiCart.splice(i, 1); aiRenderCart(); }

function aiUpdateTotal() {
  const subtotal = _aiCart.reduce((s, it) => s + it.price * it.qty, 0);
  const discount = Number(document.getElementById('ai-discount')?.value) || 0;
  const total = Math.max(0, subtotal - discount);
  const el = document.getElementById('ai-grand-total');
  if (el) el.textContent = total.toFixed(2) + ' $';
}

let __aiBusy = false;
async function aiCreateInvoice() {   /* (11 ت١ · D3) قفل نقر يشمل نافذة التأكيد (كانت الأزرار تُعطَّل بعدها فقط ⇒ ضغطتان = فاتورتان) */
  if (__aiBusy) return; __aiBusy = true;
  try { return await _aiCreateInvoiceInner(); } finally { __aiBusy = false; }
}
async function _aiCreateInvoiceInner() {
  const branchKey = document.getElementById('ai-branch').value;
  const branchObj = branches.find(b => b.key_name === branchKey);
  const branchName = branchObj?.display_name || branchKey;
  const customer = document.getElementById('ai-customer').value.trim();
  const discount = Number(document.getElementById('ai-discount').value) || 0;
  const _lo = _aiLinkedOrder;
  const withCommission = document.getElementById('ai-commission').checked && !_lo;   /* ت٩: فاتورة الأوردر بلا عمولة */

  if (!branchKey) { showToast('اختر الفرع أولاً', 'err'); return; }
  if (!_aiCart.length) { showToast('أضف منتجاً واحداً على الأقل', 'err'); return; }

  const subtotal = _aiCart.reduce((s, it) => s + it.price * it.qty, 0);
  const total = Math.max(0, subtotal - discount);
  const itemsCount = _aiCart.reduce((s, it) => s + it.qty, 0);

  if (!await GMTAsk.confirm(`إنشاء فاتورة من الإدارة على فرع "${branchName}":\n\n• المنتجات: ${_aiCart.length} (${itemsCount} قطعة)\n• الإجمالي: ${total.toFixed(2)}$\n• العمولة: ${withCommission ? 'نعم' : 'لا'}\n\nسيُخصم من مخزون الفرع فوراً، وتظهر للفرع كفاتورة تحتاج تنفيذ.`)) return;

  /* (٢٠٢٦-١٠-١١ · ملاحظات ٨ ت١ ٨:٠٧م) «فواتير اللي بينشاها الأدمن… ينكتب إنه تم الإنشاء بواسطة الأدمن الفلاني».
     كان cashier_name = اسم الفرع عمداً «ليظهر كأن الفرع أنشأها» ⇒ لا أثر لمن أنشأها فعلاً. الآن يُكتب اسم الأدمن
     (يُسأل مرّةً واحدة على هذا الجهاز ويُحفظ بنفس مفتاح «اسم المشغّل» في الأوردرات). والفرع يبقى في branch_key/branch_name. */
  let _admName = '';
  try { _admName = ((window.GMTRole && GMTRole.name && GMTRole.name()) || localStorage.getItem('gmt_operator_name') || '').trim(); } catch (_) {}   /* الأدمن بحساب باسمه ⇒ اسمه */
  if (!_admName) {
    const _n = await GMTAsk.prompt('اكتب اسمك — يُكتب على كل فاتورةٍ تنشئها من الإدارة («تم الإنشاء بواسطة الأدمن …»). مرّةً واحدة على هذا الجهاز.', { title: 'اسم الأدمن', okText: 'حفظ' });
    if (_n === null || !String(_n).trim()) { showToast('لم تُنشأ الفاتورة — اسم الأدمن مطلوب', 'err'); return; }
    _admName = String(_n).trim();
    try { localStorage.setItem('gmt_operator_name', _admName); } catch (_) {}
  }

  const btn = document.getElementById('ai-create-btn');
  btn.disabled = true; btn.textContent = 'جارٍ الإنشاء...';

  try {
    // 1. توليد رقم فاتورة (بادئة الفرع + رقم)
    const prefix = (branchKey || 'INV').slice(0, 3).toUpperCase();
    let invNumber = `${prefix}-${Date.now().toString().slice(-6)}`;

    // 2. إنشاء الفاتورة (تظهر كفاتورة رئيسية عادية + علامة أنشأها الأدمن + حالة تحتاج تنفيذ)
    const now = new Date().toISOString();
    const invPayload = {
      inv_number: invNumber,
      branch_key: branchKey,
      branch_name: branchName,
      total: Math.round(total * 100) / 100,
      items_count: itemsCount,
      discount_amount: discount > 0 ? Math.round(Math.min(discount, subtotal) * 100) / 100 : null,   /* (11 ت١ · D2) كان الخصم يُطرح من الإجمالي ولا يُسجَّل فلا يظهر بالتقارير */
      customer_name: customer || null,
      customer_phone: ((document.getElementById('ai-phone') || {}).value || '').trim() || null,
      sale_type: 'نقدي',
      payment_status: 'paid',   /* (٨ ت) كانت 'مدفوعة' هنا و'paid' في كل مكان آخر */
      cashier_name: 'الأدمن ' + _admName,   // (١١ ت١) من أنشأها فعلاً — لا اسم الفرع
      created_by_admin: true,
      admin_exec_status: 'pending',
      notes: 'تم الإنشاء بواسطة الإدارة — الأدمن ' + _admName,
      created_at: now,
    };
    if (_lo) { invPayload.order_id = _lo.id; invPayload.order_serial = _lo.serial_code || null; }
    let invRes;
    for (let tries = 0; ; tries++) {      /* إسقاطٌ دقيق للعمود الناقص وحده ثم إعادة المحاولة */
      try { invRes = await sb('POST', '/rest/v1/invoices', invPayload); break; }
      catch (e0) {
        const m = String((e0 && e0.message) || '');
        if (tries > 4) throw e0;
        if (/discount_amount/i.test(m) && 'discount_amount' in invPayload) { delete invPayload.discount_amount; continue; }
        if (_lo && /order_serial/i.test(m) && 'order_serial' in invPayload) { delete invPayload.order_serial; continue; }
        if (_lo && /order_id/i.test(m) && 'order_id' in invPayload) { delete invPayload.order_id; continue; }
        if (_lo && 'order_serial' in invPayload) { delete invPayload.order_serial; continue; }   /* القاعدة لا تعرف order_serial/order_id ⇒ نحفظ بلا العمودين، والربط يبقى على الأوردر */
        if (_lo && 'order_id' in invPayload) { delete invPayload.order_id; continue; }
        throw e0;
      }
    }
    const invId = Array.isArray(invRes) && invRes[0] ? invRes[0].id : null;
    let orderLinkErr = '';
    if (_lo && invId) {
      try {
        await sb('PATCH', `/rest/v1/gmt_orders?id=eq.${encodeURIComponent(_lo.id)}&or=(is_locked.is.null,is_locked.is.false)`,
          { invoice_id: invId, invoice_number: String(invNumber), linked_invoice_id: invId, is_locked: true }, { Prefer: 'return=minimal' });
      } catch (e) {
        try { await sb('PATCH', `/rest/v1/gmt_orders?id=eq.${encodeURIComponent(_lo.id)}`, { invoice_id: invId, invoice_number: String(invNumber) }, { Prefer: 'return=minimal' }); }
        catch (e2) { orderLinkErr = e2.message || 'تعذّر'; }
      }
    }

    // 3. حفظ البنود
    if (invId) {
      const itemsPayload = _aiCart.map(it => ({
        invoice_id: invId,
        product_id: String(it.id),
        product_name: it.name,
        barcode: it.barcode || null,
        qty: it.qty,
        unit_price: it.price,
        total: it.price * it.qty,
      }));
      /* (11 ت١ · D4) كان `.catch(() => {})` ⇒ فاتورة بلا بنود يُخصم مخزونها ويُعلَن نجاحها. الآن: فشل البنود = إلغاء الفاتورة قبل أي خصم. */
      let _itErr = null;
      try { await sb('POST', '/rest/v1/invoice_items', itemsPayload); }
      catch (e1) { _itErr = e1; }
      if (_itErr && /Could not find the '(?:[^']+)' column|column/i.test(String(_itErr.message || ''))) {      // عمود ناقص: barcode مثلاً ⇒ بلا الحقول الاختيارية
        try { await sb('POST', '/rest/v1/invoice_items', itemsPayload.map(r => { const { barcode, ...rest } = r; return rest; })); _itErr = null; } catch (e2) { _itErr = e2; }
      }
      if (_itErr) {
        let gone = false;
        try { const dr = await sb('DELETE', `/rest/v1/invoices?id=eq.${encodeURIComponent(invId)}`); gone = Array.isArray(dr) ? dr.length > 0 : true; } catch (_) {}
        if (gone && _lo) { try { await sb('PATCH', `/rest/v1/gmt_orders?id=eq.${encodeURIComponent(_lo.id)}&invoice_id=eq.${encodeURIComponent(invId)}`, { invoice_id: null, invoice_number: null, linked_invoice_id: null, is_locked: false }, { Prefer: 'return=minimal' }); } catch (_) {} }
        throw new Error('تعذّر حفظ بنود الفاتورة (' + (_itErr.message || _itErr) + ')' + (gone ? ' — أُلغيت الفاتورة ولم يُخصم شيء' : ' — ⛔ تعذّر إلغاء الفاتورة، أبلغ الإدارة'));
      }
    }

    // 4. خصم المخزون من الفرع — (٨ ت — تدقيق المطابقة) كان ينادي `decrement_branch_stock` وهي غير موجودة في أيّ
    //    ملف SQL، بلا مسارٍ احتياطيّ ⇒ فاتورة الأدمن لا تُنقص المخزون أبداً (ثبت: 6 ⇐ 6). الآن الوحدة المشتركة
    //    GMTStock.move — نفسُ ما يستعمله الجرد والنقل: الدالّة الذرّية deduct_branch_stock وإلّا الاحتياطيّ المتحقَّق.
    let stockErrors = 0;
    for (const it of _aiCart) {
      try {
        if (window.GMTStock && GMTStock.move) {
          const mv = await GMTStock.move('deduct', String(it.id), branchKey, it.qty);
          if (!mv || !mv.ok) stockErrors++;
        } else {
          await sb('POST', '/rest/v1/rpc/deduct_branch_stock', { p_product_id: String(it.id), p_branch_key: branchKey, p_qty: it.qty });
        }
      } catch(e) { stockErrors++; }
    }

    // 5. العمولة (إن فُعّلت) — تُسجّل بجدول العمولات كبقية الفواتير
    let commError = '';
    if (withCommission && invId) {
      try {
        /* (11 ت١ · D2) كان amount:0 دائماً («سجلّ فارغ») — الآن عمولة محسوبة بنفس صيغة نقطة البيع: (سعر البيع الفعلي بعد الخصم − الجملة) × النسبة × الكمية */
        let _rate = 0.5;
        try { const rr = await sb('GET', '/rest/v1/gmt_settings?key=eq.commission_rate&select=value'); const v = parseFloat(((Array.isArray(rr?.data) ? rr.data : rr)[0] || {}).value); if (isFinite(v) && v >= 0 && v <= 1) _rate = v; } catch (_) {}
        let _wsMap = {};
        try { const pr = await sb('GET', `/rest/v1/products?id=in.(${_aiCart.map(it => it.id).join(',')})&select=id,wholesale_price`); (Array.isArray(pr?.data) ? pr.data : pr).forEach(r => { _wsMap[String(r.id)] = Number(r.wholesale_price) || 0; }); } catch (_) {}
        const _ratio = subtotal > 0 ? Math.max(0, Math.min(1, total / subtotal)) : 1;
        const _cAmt = Math.round(_aiCart.reduce((t, it) => { const ws = _wsMap[String(it.id)] || 0; return ws > 0 ? t + (it.price * _ratio - ws) * _rate * it.qty : t; }, 0) * 100) / 100;

    }

    // 6. إشعار تيليجرام
    sendTelegram(
`<b>🧾 فاتورة من الإدارة</b>
━━━━━━━━━━━━━━━
<b>الفرع:</b> ${branchName}

<b>الحالة:</b> بانتظار تنفيذ الفرع
${stockErrors ? `⚠️ تعذّر خصم ${stockErrors} منتج من المخزون` : ''}`
    );

    showToast(stockErrors ? `⚠️ أُنشئت الفاتورة لكن تعذّر خصم ${stockErrors} منتج` : (commError ? '⚠️ أُنشئت الفاتورة لكن فشل سجلّ العمولة — أضِفها يدوياً' : (orderLinkErr ? '⚠️ أُنشئت الفاتورة لكن تعذّر ربطها بالأوردر — اربطه من الأوردرات' : '✅ تم إنشاء الفاتورة وخصمها من الفرع' + (_lo ? ' وربطها بالأوردر #' + (_lo.serial_code || _lo.id) : ''))), (stockErrors||commError||orderLinkErr) ? 'err' : 'ok');
    _aiCart = []; _aiLinkedOrder = null;

    try { await Promise.all([loadInvoices(), loadCommissions()]); } catch (_) {}

let _allProductsCache = [];
/* ══════════════════════════════════════════════════════════════════════════
   🔴 (2026-10-03 · بلاغ المالك) «إنشاء فاتورة من الأدمن: بحدّد منتجات بيقلّي
   غير موجودة بالفرع».

   الجذر: قائمة الأعمدة هنا كانت
       select=id,name,price,wholesale_price,group_name
   و**لا تحوي أعمدة الفروع إطلاقاً**. وبعدها في `aiAddToCart`:
       const stock = Number(p[branchKey]) || 0;   ⇒ undefined ⇒ 0
   فيصير مخزون **كل** منتج صفراً مهما كان الواقع، ويُرَدّ كل تحديدٍ برسالة
   «الكمية تجاوزت المتوفر بالفرع». لا علاقة للقاعدة ولا للمخزون — عمودٌ لم
   يُطلَب أصلاً.

   ⚠️ أسماء أعمدة الفروع **ديناميكية** (من `inv_columns`)، فلا يصحّ تثبيتها في
      الكود. نبنيها من `branches` المحمَّلة أصلاً عند الإقلاع.
   🛡️ قراءة متدرّجة (نمط PostgREST P1): عمودٌ مجهولٌ واحد يرفض الاستعلام كلّه،
      فنسقط إلى `*` ثمّ إلى الحدّ الأدنى — ولا نترك الشاشة فارغة أبداً.
   ══════════════════════════════════════════════════════════════════════════ */
async function loadProductsForAdmin() {
  if (_allProductsCache.length) return _allProductsCache;
  const keys = (Array.isArray(branches) ? branches : [])
    .map(b => b && b.key_name).filter(Boolean);
  const base = 'id,name,price,wholesale_price,group_name,barcode,image_url,min_stock';
  const tries = [
    base + (keys.length ? ',' + keys.join(',') : ''),
    '*',
    'id,name,price,wholesale_price,group_name',
  ];
  for (const sel of tries) {
    try {
      /* (٨ ث — تدقيق المطابقة) كانت limit=500 — المنتج رقم ٥٠١ لا يظهر في فاتورة الأدمن. الآن كلّها صفحةً صفحة. */
      const rows = await _sbAll('/rest/v1/products?select=' + sel + '&order=group_name.asc,name.asc');
      if (Array.isArray(rows)) {
        _allProductsCache = rows;
        if (keys.length && rows.length && !(keys[0] in rows[0])) {
          console.warn('[GMT] أعمدة الفروع غائبة عن نتيجة المنتجات — المخزون سيُقرأ صفراً');
        }
        return _allProductsCache;
      }
    } catch (e) { /* جرّب الأقلّ طمعاً */ }
  }
  _allProductsCache = [];
  return _allProductsCache;
}

async function saveOffer() {
  const name  = document.getElementById('of-name')?.value.trim();

  let products = [];

  let originalPrice = null;
  if (_offerType === 'bundle') {
    document.querySelectorAll('.of-prod-check:checked').forEach(cb => {
      products.push({ id: cb.value, name: cb.dataset.name, price: parseFloat(cb.dataset.price)||0 });

    // العرض المفرد لازم يرتبط بمنتج جرد محدد
    if (!_ofSingleProdId) { showToast('اختر المنتج المرتبط بالعرض المفرد', 'err'); return; }
    productId = _ofSingleProdId;
    originalPrice = _ofSingleProdPrice || null;
  }

  try {
    await sb('POST', '/rest/v1/gmt_offers', {
      name, description: desc || null, image_url: img || null, reel_url: reel || null,
      offer_price: price, offer_type: _offerType,
      products: products.length ? JSON.stringify(products) : null,
      product_id: productId,
      original_price: originalPrice,
      ends_at: endsAt,
      is_active: true,
    });
    showToast('✅ تم حفظ العرض بنجاح', 'ok');
    closeModal();
    renderOffers();
    // إشعار تيليجرام
    sendTelegram(
`<b>🎁 عرض جديد — GMT Admin</b>
━━━━━━━━━━━━━━━
<b>الاسم:</b> ${name}
<b>السعر:</b> ${price.toFixed(2)} $

${endsAt ? `<b>ينتهي:</b> ${new Date(endsAt).toLocaleString('ar-SY')}` : ''}
${desc ? `<b>الوصف:</b> ${desc}` : ''}
<b>التوقيت:</b> ${new Date().toLocaleString('ar-SY')}`

}

let _cpType = 'percent';
function setCpType(type) {
  _cpType = type;
  document.getElementById('cp-type-pct').className = type==='percent' ? 'btn btn-red btn-sm' : 'btn btn-ghost btn-sm';
  document.getElementById('cp-type-fix').className = type==='fixed'   ? 'btn btn-red btn-sm' : 'btn btn-ghost btn-sm';
  document.getElementById('cp-type-pct').style.width = '100%';
  document.getElementById('cp-type-fix').style.width = '100%';
  const h = document.getElementById('cp-val-hint');
  if (h) h.textContent = type === 'percent' ? 'مثال: 20 = خصم 20% (الحد الأقصى 100)' : 'مثال: 5 = خصم $5';
  const maxEl = document.getElementById('cp-max')?.parentElement;
  if (maxEl) maxEl.style.display = type === 'percent' ? 'block' : 'none';
}

function generateCouponCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 8; i++) code += chars[Math.floor(Math.random() * chars.length)];
  const el = document.getElementById('cp-code');
  if (el) el.value = code;
}

async function saveCoupon() {
  const code   = document.getElementById('cp-code')?.value.trim().toUpperCase();
  const cust   = document.getElementById('cp-cust')?.value.trim();
  const val    = parseFloat(document.getElementById('cp-val')?.value || 0);
  const minP   = parseFloat(document.getElementById('cp-min')?.value || 0);
  const maxD   = parseFloat(document.getElementById('cp-max')?.value || 0);
  const exp    = document.getElementById('cp-exp')?.value;

  if (!code) { showToast('أدخل كود الكوبون', 'err'); return; }
  if (!val || val <= 0) { showToast('أدخل قيمة الخصم', 'err'); return; }
  if (_cpType === 'percent' && val > 100) { showToast('نسبة الخصم لا يمكن أن تتجاوز 100%', 'err'); return; }

  const prods = [];
  document.querySelectorAll('.cp-prod-check:checked').forEach(cb => {
    prods.push({ id: cb.value, name: cb.dataset.name });
  });

  /* 🛡️ (2026-08-24) منع الكود المكرّر — ثغرة خصم مزدوج:
     كوبونان بالكود نفسه ⇒ الختم الذرّي يختم واحداً ويبقى الآخر صالحاً،
     فيُطبَّق الخصم مرّتين على فاتورتين. الفحص هنا + قيد فريد في SQL ‏2️⃣2️⃣. */
  try {
    const dup = await sb('GET', `/rest/v1/gmt_coupons?code=eq.${encodeURIComponent(code)}&select=id,is_used&limit=1`);
    const rows = Array.isArray(dup?.data) ? dup.data : (Array.isArray(dup) ? dup : []);
    if (rows.length) {
      showToast('⛔ الكود «' + code + '» مستعمَل مسبقاً' + (rows[0].is_used ? ' (كوبون مستهلَك)' : ' (كوبون فعّال)') + ' — اختر كوداً آخر', 'err');
      return;
    }
  } catch (e) {
    showToast('⚠️ تعذّر التحقّق من تكرار الكود — لم يُحفظ تفادياً للازدواج', 'err');
    return;
  }

  try {
    const _res = await sb('POST', '/rest/v1/gmt_coupons', {
      code,
      customer_name      : cust || null,
      discount_type      : _cpType,
      discount_value     : val,
      min_purchase       : minP > 0 ? minP : null,
      max_discount       : maxD > 0 ? maxD : null,
      expires_at         : exp ? new Date(exp + 'T23:59:59').toISOString() : null,
      applicable_products: prods.length ? JSON.stringify(prods) : null,
      is_used            : false,
    });
    /* 🛡️ لا رسالة نجاح بلا تحقّق — الحفظ الصامت يوهم بوجود كوبون غير موجود */
    if (_res && _res.error) { showToast('⛔ لم يُحفظ الكوبون: ' + (_res.error.message||_res.error), 'err'); return; }
    showToast('✅ تم إنشاء الكوبون: ' + code, 'ok');
    closeModal();
    renderCoupons();
  } catch(e) {
    if (e.message?.includes('duplicate') || e.message?.includes('unique')) {
      showToast('⚠️ هذا الكود موجود مسبقاً — اختر كوداً آخر', 'err');
    } else {
      showToast('خطأ: ' + e.message + ' — تأكد من وجود جدول gmt_coupons في Supabase', 'err');
    }
  }
}

function copyCouponCode(code) {
  navigator.clipboard.writeText(code).then(() => showToast('✅ تم نسخ الكود: ' + code, 'ok'));
}

async function markCouponUsed(id) {
  if (!await GMTAsk.confirm('تعليم هذا الكوبون كمستخدَم؟')) return;

}

async function deleteCoupon(id) {
  if (!await GMTAsk.confirm('حذف هذا الكوبون؟')) return;

    await sb('DELETE', `/rest/v1/gmt_coupons?id=eq.${id}`, null, { Prefer: 'return=minimal' });

// UTILS
// ══════════════════════════════════════════
/* ══════════════════════════════════════════════════════════════════════
   إصلاح 2026-07-12 (فحص عميق) — ثلاث دوال كانت **مستدعاة ولم تُعرَّف قط**:
     • escHtml()    — استُدعيت 12 مرة داخل قالب طباعة فاتورة النقل
     • showLoading() — أول سطر في printTransfer()
     • hideLoading() — مرتان بنفس الدالة
   الأثر الفعلي: `showLoading(...)` هو **أول سطر تنفيذي** في دالة طباعة فاتورة
   النقل ⇒ ReferenceError فوري ⇒ **الدالة تموت قبل أن تفعل شيئاً، ولا تُطبع
   فاتورة نقل أبداً.** زر يُضغط ولا يحدث شيء — خطأ صامت نموذجي.
   السبب على الأرجح: نُسخت الدالة من ملف آخر كان يملك هذه المساعدات.
   الحل: escHtml اسم بديل لـ escH الموجودة، و showLoading/hideLoading تُبنيان
   على showToast + مؤشّر تحميل بسيط.
   ══════════════════════════════════════════════════════════════════════ */
function escHtml(s){ return escH(s); }

let _gmtLoadEl = null;
function showLoading(msg){
  hideLoading();
  _gmtLoadEl = document.createElement('div');
  _gmtLoadEl.className = 'gmt-modal-bg';
  _gmtLoadEl.style.zIndex = '9800';
  _gmtLoadEl.innerHTML =
    '<div class="gmt-card" style="text-align:center;min-width:210px;">'
    + '<div style="font-size:26px;margin-bottom:8px;">⏳</div>'
    + '<div class="gmt-strong" style="font-size:13px;">' + escH(msg || 'جارٍ التنفيذ…') + '</div></div>';
  document.body.appendChild(_gmtLoadEl);
}
function hideLoading(){
  if (_gmtLoadEl) { _gmtLoadEl.remove(); _gmtLoadEl = null; }
}

function escH(s){ /* (٨ ث) نسخةٌ واحدة: GMTUtil.esc في gmt-core.js */ return GMTUtil.esc(s); }
function showToast(msg,type=''){
  const t=document.createElement('div');t.className='toast '+(type==='ok'?'ok':type==='err'?'err':'');t.textContent=msg;
  document.getElementById('toast-wrap').appendChild(t);
  setTimeout(()=>{t.style.transition='opacity 0.3s';t.style.opacity='0';setTimeout(()=>t.remove(),300);},3000);
}

function showOnboarding(force) {
  /* (2026-10-06) «إذا بحطّ شي بلوحة الوصول السريع ما لازم كل ما أفتحه يعطيني انترو» + البند ١٧١ «انسفوها وابنِها»:
     لا شرحٌ يبدأ وحده عند فتح الصفحة — يبدأ فقط بضغطة منك (شرح النظام / الجولة). */
  if (!force && !(navigator.userActivation && navigator.userActivation.isActive)) return;
  if (localStorage.getItem(ONBOARD_KEY)) return;
  let step = 0;
  const overlay = document.createElement('div');
  overlay.id = 'onboard-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;padding:20px;';

  function render() {
    const s = ONBOARD_STEPS[step];
    overlay.innerHTML = `
      <div style="background:white;border-radius:24px;padding:28px 22px;width:100%;max-width:380px;box-shadow:0 24px 64px rgba(0,0,0,0.5);">
        <div style="text-align:center;margin-bottom:18px;">
          <div style="font-size:52px;margin-bottom:10px;">${s.icon}</div>
          <div style="font-size:18px;font-weight:900;color:#111;margin-bottom:8px;">${s.title}</div>
          <div style="font-size:13px;color:#5b6472;font-weight:600;line-height:1.7;">${s.text}</div>
        </div>
        <!-- نقاط التقدم -->
        <div style="display:flex;justify-content:center;gap:6px;margin-bottom:18px;">
          ${ONBOARD_STEPS.map((_,i) => `<div style="width:${i===step?18:7}px;height:7px;border-radius:4px;background:${i===step?'#d5001c':'#e5e7eb'};transition:all 0.3s;"></div>`).join('')}
        </div>
        <div style="display:flex;gap:8px;">
          ${step > 0 ? `<button onclick="onboardPrev()" style="flex:1;background:#f3f4f6;color:#374151;border:none;border-radius:12px;padding:12px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:800;cursor:pointer;">→ السابق</button>` : ''}
          ${step < ONBOARD_STEPS.length-1
            ? `<button onclick="onboardNext()" style="flex:2;background:linear-gradient(135deg,#d42b2b,#dc2626);color:white;border:none;border-radius:12px;padding:12px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:800;cursor:pointer;">التالي ←</button>`
            : `<button onclick="onboardDone()" style="flex:2;background:linear-gradient(135deg,#15803d,#22c55e);color:white;border:none;border-radius:12px;padding:12px;font-family:'Cairo',sans-serif;font-size:14px;font-weight:900;cursor:pointer;">✅ ابدأ الاستخدام</button>`}
        </div>
        <div style="text-align:center;margin-top:10px;">
          <button onclick="onboardDone()" style="font-size:11px;color:#5b6472;background:none;border:none;cursor:pointer;font-family:'Cairo',sans-serif;">تخطي الشرح</button>
        </div>
      </div>`;
  }

  window.onboardNext = () => { if (step < ONBOARD_STEPS.length-1) { step++; render(); } };
  window.onboardPrev = () => { if (step > 0) { step--; render(); } };
  window.onboardDone = () => {
    localStorage.setItem(ONBOARD_KEY, '1');
    overlay.remove();
    setTimeout(() => window._gmtTour?.start(), 300);
  };

  render();
  document.body.appendChild(overlay);
}

// إظهار شاشة الترحيب بعد تسجيل الدخول (أول مرة فقط) — أو الجولة التفاعلية مباشرة إن كانت الشاشة التعريفية قد عُرضت سابقاً

}

/* 🔧 (2026-10-03 · صهرٌ وتوحيد) هذه القائمة كانت مكتوبةً **ثلاث مرّات** في
   ثلاث صفحات بثلاثة أسماء ونفس المحتوى. صارت في `GMTBranch` في gmt-core.js،
   وبقي الاسمُ المحلّي غلافاً كي لا ينكسر أي نداءٍ قائم. إضافةُ كتبةٍ جديدة
   لحلب تُكتب **هناك وحدها** فتسري على الصفحات الثلاث معاً. */
const ACC_HALEB_KEYS = (window.GMTBranch && window.GMTBranch.mgmtKeys) || ['haleb', 'aleppo', 'hlb', 'halb', 'حلب'];
function isHalebBranch(key) {
  if (window.GMTBranch) return window.GMTBranch.isMgmt(key);
  return ACC_HALEB_KEYS.some(k => (key||'').toLowerCase().includes(k));
}

// ── فلترة بحسب الشهر المُختار (افتراضياً الشهر الحالي) ──
/* (مراجعة ACCT-11) الأشهر بالتوقيت المحلّي لا UTC — فاتورة بعد منتصف الليل بتوقيت دمشق كانت تُحسب في الشهر السابق */
const __ymLocal = (v) => { const s = String(v == null ? '' : v); if (s.length <= 10) return s.slice(0, 7); const d = new Date(s); if (isNaN(d.getTime())) return s.slice(0, 7); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
let accSelectedMonth = __ymLocal(new Date().toISOString()); // 'YYYY-MM' | 'all'
let __accUserPicked = false;   /* لم يختر المستخدم شهراً بعد ⇒ إن خلا الشهر الحاليّ من الفواتير نفتح «كل الفترة» بدل صفرٍ صامت */

function accInMonth(dateStr, ym) {
  if (!dateStr) return false;
  if (ym === 'all') return true;          /* (٨ ج) «كل الفترة» */
  return __ymLocal(dateStr) === ym;
}

/* ══ (٨ ج) رصيد الصندوق الافتتاحيّ — رقمٌ واحد في gmt_settings (acc_opening_balance) ══
   الصندوق المتراكم = افتتاحي + كل ما دخل − كل ما خرج منذ أوّل حركةٍ مسجَّلة. من دون افتتاحيّ يبدأ من الصفر
   (ويُظهر سالباً إن صُرف أكثر مما سُجّل دخوله — كمشتريات دفعتَها من مالٍ سابق للنظام). */
let accOpeningBalance = 0;
async function accLoadOpening() {
  try {
    const r = await sb('GET', '/rest/v1/gmt_settings?key=eq.acc_opening_balance&select=value');
    const row = (Array.isArray(r) ? r : (r && r.data) || [])[0];
    accOpeningBalance = row ? (parseFloat(row.value) || 0) : 0;
  } catch (e) { accOpeningBalance = 0; }
}
async function accEditOpening() {
  const v = await GMTAsk.prompt('الرصيد الافتتاحيّ للصندوق المركزي بالدولار — ما كان معك قبل أوّل حركةٍ في النظام (أو رأس المال الذي وضعتَه):', { title: 'رصيد افتتاحيّ', value: String(accOpeningBalance || 0), inputType: 'number', dir: 'ltr' });
  if (v === null) return;
  const n = parseFloat(String(v).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)));
  if (!isFinite(n)) { showToast('أدخل رقماً صحيحاً', 'err'); return; }
  const rounded = Math.round(n * 100) / 100;
  try {
    try { await sb('POST', '/rest/v1/gmt_settings?on_conflict=key', { key: 'acc_opening_balance', value: String(rounded) }, { Prefer: 'resolution=merge-duplicates,return=minimal' }); }
    catch (e1) { await sb('PATCH', '/rest/v1/gmt_settings?key=eq.acc_opening_balance', { value: String(rounded) }, { Prefer: 'return=minimal' }); }
    const back = await sb('GET', '/rest/v1/gmt_settings?key=eq.acc_opening_balance&select=value');
    const row = (Array.isArray(back) ? back : (back && back.data) || [])[0];
    if (!row || Math.abs((parseFloat(row.value) || 0) - rounded) > 0.004) throw new Error('لم يثبت الرقم في القاعدة (راجع صلاحيات gmt_settings)');
    accOpeningBalance = rounded;
    try { if (window.GMTAudit) await GMTAudit.log({ action: 'acc_opening_balance', entity: 'gmt_settings', entityId: 'acc_opening_balance', entityName: 'رصيد افتتاحي', reason: 'تعديل الرصيد الافتتاحيّ للصندوق المركزي إلى ' + rounded + '$' }); } catch (_) {}
    showToast('✅ حُفظ الرصيد الافتتاحيّ', 'ok');
    renderAccounting();
  } catch (e) { showToast('تعذّر الحفظ: ' + ((e && e.message) || e), 'err'); }
}
window.accEditOpening = accEditOpening;

/* ربط فواتير الشراء بالمصاريف — دفتر إضافيّ (gmt-ledger.js)؛ يُعرَض ما سيُسجَّل قبل الكتابة ولا شيء يتغيّر بلا موافقتك */
let __accLinkBusy = false;
async function accLinkPurchases() {
  if (__accLinkBusy) return; __accLinkBusy = true;
  try {
    const list = GMTLedger.drift(allPurchases, allExpenses, allTransfers);
    if (!list.length) { showToast('كل فواتير الشراء مربوطة بالمحاسبة', 'ok'); return; }
    const lines = list.slice(0, 12).map(d => '• #' + (d.purchase.inv_number || d.purchase.id) + ' ' + (d.purchase.supplier || '') + (d.orphan ? ' (فاتورة محذوفة — عكس قيودها)' : '') +
      (Math.abs(d.dg) >= 0.005 ? ' · دفعة ' + (d.dg > 0 ? '+' : '') + d.dg.toFixed(2) + '$' : '') +
      (Math.abs(d.dc) >= 0.005 ? ' · جمارك/شحن ' + (d.dc > 0 ? '+' : '') + d.dc.toFixed(2) + '$' : '') +
      (d.missingMoves ? ' · ' + d.missingMoves + ' حركة درج ناقصة' : '')).join('\n');
    if (!await GMTAsk.confirm('سيُسجَّل في المصاريف (خروج نقد لا مصروف ربح) ما دُفع على ' + list.length + ' فاتورة شراء، بتواريخ فواتيرها، ودافعُها «' + ((window.GMTRole && GMTRole.name && GMTRole.name()) || 'الإدارة') + '»:\n\n' + lines + (list.length > 12 ? '\n… و' + (list.length - 12) + ' أخرى' : '') + '\n\nمتابعة؟', { title: 'ربط فواتير الشراء بالمحاسبة' })) return;
    const api = { sb: (m, p2, b, x) => sb(m, p2, b, x) };
    const payer = (window.GMTRole && GMTRole.name && GMTRole.name()) || 'الإدارة';
    let posted = 0, failed = 0, firstErr = '';
    for (const d of list) {
      /* 🔴 (مراجعة I-03) لا نُزامن أبداً من صفٍّ مخبَّأ: بين فتح الصفحة وضغط «متابعة» قد تُعدَّل الفاتورة من شاشة الشراء فتُسجَّل
         «تخفيضات» وهمية. نعيد قراءتها الآن؛ وإن اختفت (محذوفة) فنعكس قيودها اليتيمة. */
      let fresh = d.purchase;
      try {
        const rows = await sb('GET', '/rest/v1/import_log?id=eq.' + encodeURIComponent(d.purchase.id) + '&select=*');
        fresh = (Array.isArray(rows) && rows[0]) || { id: d.purchase.id, inv_number: d.purchase.inv_number, cash_payment: 0, costs_paid: false };
      } catch (e) { failed++; firstErr = firstErr || (e && e.message) || 'تعذّرت قراءة الفاتورة'; continue; }
      const r = await GMTLedger.syncPurchase(api, fresh, { payer, backdate: fresh.created_at || fresh.inv_date || undefined });
      posted += (r.posted || []).length; if (r.error) { failed++; firstErr = firstErr || r.error; }
    }
    await loadExpenses();
    showToast(failed ? ('⚠️ رُبط ' + posted + ' وتعذّر ' + failed + ': ' + firstErr) : ('✅ رُبطت ' + posted + ' دفعة بالمحاسبة'), failed ? 'err' : 'ok');
    renderAccounting();
  } finally { __accLinkBusy = false; }
}
window.accLinkPurchases = accLinkPurchases;

/* 🔴 (مراجعة ACCT-8) مصاريف فروعٍ معتمدة قبل أن تعمل حركات الصندوق (جدولك رفض كل إدراج: أعمدة البضاعة الإلزاميّة) ليس لها حركة خصم من درج فرعها —
   فتُحسب في الربح ولا تنقص صندوق الفرع. نكتشفها (فرع + مبلغ + عنوان ⇢ لا حركة type='expense' مطابقة) ونعرضها للموافقة قبل أيّ كتابة. */
function legacyBranchExpenses() {
  if (!window.GMTLedger) return [];
  const trs = (allTransfers || []).filter(t => t && t.type === 'expense');
  const used = new Set();
  return (allExpenses || []).filter(e => {
    if (!e || !e.approved || e.voided || !e.branch_key || GMTLedger.poInfo(e) || GMTLedger.cashSource(e) !== 'branch') return false;
    const a = Math.abs(GMTLedger.usd(e)), title = String(e.title || '');
    const k = trs.findIndex((t, ix) => !used.has(ix) && t.branch_key === e.branch_key && Math.abs(Math.abs(Number(t.amount) || 0) - a) < 0.011 &&
      (!title || String(t.note || '').indexOf(title) >= 0));
    if (k >= 0) { used.add(k); return false; }
    return a >= 0.005;
  });
}
let __accLegacyBusy = false;
async function accLinkLegacyExpenses() {
  if (__accLegacyBusy) return; __accLegacyBusy = true;
  try {
    const list = legacyBranchExpenses();
    if (!list.length) { showToast('كل مصاريف الفروع المعتمدة لها خصمٌ في صندوق فرعها', 'ok'); return; }
    const tot = list.reduce((s2, e) => s2 + Math.abs(GMTLedger.usd(e)), 0);
    const lines = list.slice(0, 12).map(e => '• ' + ((branches.find(b => b.key_name === e.branch_key) || {}).display_name || e.branch_key) + ' · ' + (e.title || '—') + ' · ' + Math.abs(GMTLedger.usd(e)).toFixed(2) + '$').join('\n');
    if (!await GMTAsk.confirm('سيُخصم من صناديق الفروع (بتواريخ اعتماد مصاريفها) ' + tot.toFixed(2) + '$ هي ' + list.length + ' مصروفاً معتمداً دُفع من الفرع ولم يُخصم أصلاً:\n\n' + lines + (list.length > 12 ? '\n… و' + (list.length - 12) + ' أخرى' : '') + '\n\nإن كانت الإدارة هي من دفعتها فلا توافق وعدّل المصروف أولاً.\nمتابعة؟', { title: 'خصم مصاريف الفروع القديمة من صناديقها' })) return;
    let ok = 0, bad = 0, firstErr = '';
    for (const e of list) {
      try {
        const b = branches.find(x => x.key_name === e.branch_key);
        const res = await adminCashPost({
          branch_key: e.branch_key, branch_name: b?.display_name || e.branch_key, amount: -Math.abs(GMTLedger.usd(e)), type: 'expense',
          note: 'مصروف: ' + (e.title || ''), created_by: 'الإدارة (ربط مصروف قديم)', created_at: e.approved_at || e.created_at || new Date().toISOString()
        });
        const t = Array.isArray(res) ? res[0] : (Array.isArray(res?.data) ? res.data[0] : res);
        if (t && t.branch_key) allTransfers.push(t); ok++;
      } catch (e2) { bad++; firstErr = firstErr || ((e2 && e2.message) || String(e2)); }
    }
    showToast(bad ? ('⚠️ خُصم ' + ok + ' وتعذّر ' + bad + ': ' + firstErr) : ('✅ خُصم ' + ok + ' مصروفاً من صناديق فروعها'), bad ? 'err' : 'ok');
    await loadTransfers();
    renderAccounting();
  } finally { __accLegacyBusy = false; }
}
window.accLinkLegacyExpenses = accLinkLegacyExpenses;


/* ══ (2026-10-05 ن-٣) كشف الحساب الشهري — البند ٤٧ ودراسة P0-د
   «كشف حساب شهري لنقطة البيع أو للبائع أو للزبون، فيه كل قطعة وعمولتها».
   كان ينتظر المرتجع (صار يعكس المخزون والعمولة) والمصاريف المعتمدة (صارت بموافقة) — فاكتمل أساسه.
   القراءة من البيانات المحمّلة نفسها (allInvoices · allComm · allExpenses · allTransfers) + بنود الفواتير.
   ألوانُه مسارُ المستندات المحاسبيّة: كحليّ #1f348f وأزرقُ باهت — كالفاتورة. ══ */
function openStatement(ym) {
  const old = document.getElementById('gmt-stmt'); if (old) old.remove();
  const months = [...new Set(allInvoices.map(i => __ymLocal(i.created_at || '')).filter(Boolean))].sort().reverse();
  if (ym && !months.includes(ym)) months.unshift(ym);
  const sellers = [...new Set(allInvoices.map(i => i.cashier_name).filter(Boolean))].sort();
  const w = document.createElement('div'); w.id = 'gmt-stmt'; w.setAttribute('data-keep-fab', '1');
  w.style.cssText = 'position:fixed;inset:0;z-index:9500;background:rgba(15,18,25,.45);display:grid;place-items:center;padding:14px;direction:rtl;font-family:inherit';
  const sel = 'width:100%;border:1px solid #d6dfee;border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;background:#fff;box-sizing:border-box';
  const lab = 'display:block;font-size:12px;font-weight:800;color:#475569;margin:10px 0 4px';
  w.innerHTML = '<div style="width:100%;max-width:440px;background:#fff;border-radius:22px;padding:18px;box-shadow:0 30px 80px rgba(15,18,25,.25)">' +
    '<div style="font-size:17px;font-weight:900;color:#1f348f">كشف حساب شهري</div>' +
    '<label style="' + lab + '">الشهر</label><select id="st-ym" style="' + sel + '">' + months.map(m => '<option' + (m === ym ? ' selected' : '') + '>' + m + '</option>').join('') + '</select>' +
    '<label style="' + lab + '">نقطة البيع</label><select id="st-br" style="' + sel + '"><option value="">كل الفروع</option>' +
      branches.filter(b => !isExcludedBranch(b.key_name)).map(b => '<option value="' + escH(b.key_name) + '">' + escH(b.display_name || b.key_name) + '</option>').join('') + '</select>' +   /* (٨ ت) لا ألمانيا/الصين */
    '<label style="' + lab + '">البائع (اختياري)</label><select id="st-sl" style="' + sel + '"><option value="">الكل</option>' + sellers.map(s => '<option>' + escH(s) + '</option>').join('') + '</select>' +
    '<label style="' + lab + '">الزبون — اسم أو رقم (اختياري)</label><input id="st-cu" style="' + sel + '" placeholder="مثال: 0988… أو سهير">' +
    '<div id="st-err" style="min-height:1.2em;margin-top:8px;color:#b91c1c;font-size:13px;font-weight:800"></div>' +
    '<div style="display:flex;gap:8px"><button id="st-go" style="flex:1;background:#1f348f;color:#fff;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:900;cursor:pointer">عرض الكشف وطباعته</button>' +
    '<button id="st-x" style="background:#f1f5f9;color:#334155;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer">إغلاق</button></div></div>';
  document.body.appendChild(w);
  const $ = id => w.querySelector('#' + id);
  $('st-x').onclick = () => w.remove();
  w.addEventListener('click', e => { if (e.target === w) w.remove(); });
  $('st-go').onclick = async () => {
    $('st-go').disabled = true; $('st-go').textContent = 'لحظة…';
    /* (٨ ث) النافذة تُفتح عند الضغط نفسه — بعد جلب البنود كان المتصفّح يمنعها كنافذةٍ منبثقة */
    const _pw = window.open('', '_blank');
    try { await buildStatement($('st-ym').value, $('st-br').value, $('st-sl').value, $('st-cu').value.trim(), _pw); w.remove(); }
    catch (e) { try { if (_pw && !_pw.closed) _pw.close(); } catch (_) {} $('st-err').textContent = 'تعذّر: ' + (e.message || e); $('st-go').disabled = false; $('st-go').textContent = 'عرض الكشف وطباعته'; }
  };
}

async function buildStatement(ym, bk, seller, cust, preWin) {
  const inM = d => __ymLocal(d || '') === ym;
  const usd = e => e.currency === 'usd' || !e.currency ? Number(e.amount) || 0 : (Number(e.amount) || 0) / (Number(e.exchange_rate) || (window.GMT_DEFAULT_RATE || 140));
  const isRet = i => String(i.sale_type || '').includes('مرتجع') || Number(i.total) < 0;
  const cq = (cust || '').toLowerCase();
  const invs = allInvoices.filter(i => inM(i.created_at) && (!bk || i.branch_key === bk) && (!seller || i.cashier_name === seller) &&
                                 !String(i.customer_name || '').startsWith('[تدريب]') &&
                                 (!cq || String(i.customer_name || '').toLowerCase().includes(cq) || String(i.customer_phone || '').includes(cq)))
                       .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  /* بنود الفواتير — دفعاتٌ من ٨٠ معرّفاً */
  const items = {};
  const ids = invs.map(i => i.id);
  for (let k = 0; k < ids.length; k += 80) {
    const part = ids.slice(k, k + 80).join(',');
    const rows = await sb('GET', `/rest/v1/invoice_items?invoice_id=in.(${part})&select=*`);
    (Array.isArray(rows) ? rows : []).forEach(r => { (items[r.invoice_id] = items[r.invoice_id] || []).push(r); });
  }
  const commOf = id => Number((invComm(id) || {}).amount) || 0;
  /* (٨ ث — تدقيق المطابقة) «فيه كل قطعة **وعمولتها**»: نقطة البيع تكتب صفّ عمولةٍ لكل بند ومُلاحظته تبدأ باسم المنتج —
     فنطابق كلّ قطعةٍ بصفّها. ما لا يطابق (تعديلٌ يدويّ مثلاً) يبقى على سطر الفاتورة. */
  const commRowsOf = id => invCommRows(id).slice();
  const _paidByAdmin = e => /دفعتها الإدارة/.test(String(e.note || ''));
  /* 🔴 (مراجعة ACCT-6) قيود دفتر الشراء [PO:…] خروجُ نقدٍ لا مصروفُ ربح: لا تدخل «المصاريف المعتمدة» ولا الصافي (فالبضاعة كلفة داخل net_cost) —
     تُعرض في جدولٍ منفصل. وصندوق الفرع يُحدَّد بـ GMTLedger.cashSource لا بالبحث عن «دفعتها الإدارة» في الملاحظة. */
  const _isPO = e => !!(window.GMTLedger && GMTLedger.poInfo(e));
  const _fromBox = e => (window.GMTLedger ? GMTLedger.cashSource(e) === 'branch' : !_paidByAdmin(e));
  const expsAll = (bk || !seller) ? allExpenses.filter(e => e.approved && inM(e.created_at) && (!bk || e.branch_key === bk)) : [];
  const exps = expsAll.filter(e => !_isPO(e));
  const poRows = expsAll.filter(_isPO);
  const trs = bk ? (allTransfers || []).filter(t => inM(t.created_at) && t.branch_key === bk && t.type !== 'expense') : [];
  const T = { sales: 0, ret: 0, comm: 0, exp: 0, cap: 0, dr: 0, tr: 0, col: 0, pcs: 0, due: 0, expBox: 0, po: 0 };
  const _cap = e => /^رأسمالي/.test(String(e.kind || '')) || /النوع:\s*رأسمالي/.test(String(e.note || ''));
  const _dr = e => !!(window.GMTLedger && GMTLedger.isDrawing && GMTLedger.isDrawing(e));   /* (TASK-0204) مسحوبات المدير خارج المصروفات */
  const f2 = n => (Number(n) || 0).toFixed(2);
  let rowsHtml = '';
  invs.forEach(inv => {
    const r = isRet(inv), its = items[inv.id] || [], c = commOf(inv.id);
    if (r) T.ret += Math.abs(Number(inv.total) || 0); else T.sales += Number(inv.total) || 0;
    T.comm += c;
    const cr = commRowsOf(inv.id);
    invCommRows(inv.id).forEach(x => { if (x.approved && !x.paid && !x.zeroed) T.due += Number(x.amount) || 0; });
    const itHtml = its.map(it => {
      const q = Number(it.qty) || 0, pr = Number(it.unit_price || it.price) || 0;
      if (!r) T.pcs += q;
      const nm = String(it.product_name || '').trim();
      const k = nm ? cr.findIndex(x => { const n = String(x.note || '').trim(); return n === nm || n.startsWith(nm + ' ·'); }) : -1;
      const ic = k >= 0 ? (Number(cr.splice(k, 1)[0].amount) || 0) : null;
      return `<tr class="it"><td></td><td></td><td colspan="2">• ${escH(nm || '—')}</td><td class="n">${q}</td><td class="n">${f2(pr)}</td><td class="n">${f2(q * pr)}</td><td class="n">${ic === null ? '' : f2(ic)}</td></tr>`;
    }).join('');
    const rest = cr.reduce((s, x) => s + (Number(x.amount) || 0), 0);
    rowsHtml += `<tr class="${r ? 'ret' : 'inv'}"><td>${new Date(inv.created_at).toLocaleDateString('en-GB')}</td><td>${escH(inv.inv_number || inv.id)}${r ? ' <b>مرتجع</b>' : ''}</td>` +
      `<td>${escH(inv.customer_name || '—')}</td><td>${escH(inv.cashier_name || '—')}</td><td></td><td></td><td class="n">${f2(inv.total)}</td><td class="n">${c ? f2(c) + (its.length && Math.abs(rest) > 0.004 && Math.abs(rest - c) > 0.004 ? '<br><small>منها على الفاتورة ' + f2(rest) + '</small>' : '') : '—'}</td></tr>` + itHtml;
  });
  exps.forEach(e => { if (_cap(e)) T.cap += usd(e); else if (_dr(e)) T.dr += usd(e); else T.exp += usd(e); if (_fromBox(e)) T.expBox += usd(e); });
  poRows.forEach(e => { T.po += usd(e); if (_fromBox(e)) T.expBox += usd(e); });
  /* المصاريف مفصّلةً — كان سطراً واحداً بالمجموع */
  const expHtml = exps.length ? `<h3 style="font-size:13px;color:#1f348f;margin:14px 0 6px">المصاريف المعتمدة (${exps.length})</h3>
<table><thead><tr><th style="width:11%">التاريخ</th><th>البند</th><th style="width:14%">الفرع</th><th style="width:13%">المبلغ</th><th style="width:9%">الصرف</th><th style="width:10%">بالدولار</th><th style="width:15%">من</th></tr></thead><tbody>${
    exps.slice().sort((a, b) => new Date(a.created_at) - new Date(b.created_at)).map(e => `<tr><td>${new Date(e.created_at).toLocaleDateString('en-GB')}</td><td>${escH(e.title || '—')}${_cap(e) ? ' <b>رأسمالي</b>' : ''}${_dr(e) ? ' <b>مسحوبات شخصية للمدير</b>' : ''}</td>` +
      `<td>${escH((branches.find(b => b.key_name === e.branch_key) || {}).display_name || e.branch_key || 'عام')}</td><td class="n">${f2(e.amount)} ${e.currency === 'usd' ? '$' : 'ل.س'}</td>` +
      `<td class="n">${e.currency === 'usd' ? '—' : escH(e.exchange_rate || (window.GMT_DEFAULT_RATE || 140))}</td><td class="n">${f2(usd(e))}</td><td>${_fromBox(e) ? 'صندوق الفرع' : 'دفعتها الإدارة'}</td></tr>`).join('')}</tbody></table>` : '';
  const poHtml = poRows.length ? `<h3 style="font-size:13px;color:#1f348f;margin:14px 0 6px">مشتريات وجمارك مدفوعة — خروج نقد لا مصروف ربح (${poRows.length})</h3>
<table><thead><tr><th style="width:11%">التاريخ</th><th>البند</th><th style="width:13%">بالدولار</th><th style="width:26%">من دفع</th></tr></thead><tbody>${poRows.slice().sort((a, b) => new Date(a.created_at) - new Date(b.created_at)).map(e => `<tr><td>${new Date(e.created_at).toLocaleDateString('en-GB')}</td><td>${escH(e.title || '—')}</td><td class="n">${f2(usd(e))}</td><td>${escH(((/دفعها:\s*([^·\]]+)/.exec(String(e.note || '')) || [])[1] || e.requested_by || '—').trim())}</td></tr>`).join('')}</tbody></table>` : '';
  trs.forEach(t => { if (t.type === 'collection') T.col += Math.abs(Number(t.amount) || 0); else T.tr += Number(t.amount) || 0; });
  const bName = bk ? ((branches.find(b => b.key_name === bk) || {}).display_name || bk) : 'كل الفروع';
  const net = T.sales - T.ret - T.comm - T.exp;
  const html = `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>كشف حساب ${escH(bName)} ${ym}</title>
<style>@page{size:A4;margin:10mm}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}body{font-family:Cairo,Tahoma,Arial,sans-serif;color:#1e293b;margin:0}

td.n{text-align:left;direction:ltr}tr.inv td{background:#f7f9fd;font-weight:700}tr.ret td{background:#fff1f2;font-weight:700;color:#b91c1c}tr.it td{color:#475569}

function renderAccounting() {
  if (!__accUserPicked && accSelectedMonth !== 'all' && allInvoices.length && !allInvoices.some(i => accInMonth(i.created_at, accSelectedMonth))) accSelectedMonth = 'all';
  const ym = accSelectedMonth;
  const c = document.getElementById('app-content');
  c.innerHTML = `<div class="empty-state"><div style="font-size:32px;">⏳</div><p style="margin-top:8px;font-weight:700;">جارٍ تجميع البيانات المحاسبية...</p></div>`;

  // ════════ 1) المبيعات الكلية لكل الفروع (غير حلب) — هذه "تُرحَّل" إلى حلب ════════
  const nonHalebInvoices = allInvoices.filter(i => !isHalebBranch(i.branch_key) && !isExcludedBranch(i.branch_key));
  const halebInvoices    = allInvoices.filter(i => isHalebBranch(i.branch_key));

  const totalSalesAllBranches = allInvoices
    .filter(i => !isExcludedBranch(i.branch_key))
    .reduce((s,i) => s + (Number(i.total)||0), 0);

  // المعلّق (غير مرحَّل بعد) من كل الفروع
  const totalPendingNotTransferred = (() => {
    const visibleBranches = branches.filter(b => !isExcludedBranch(b.key_name) && !isHalebBranch(b.key_name));
    return visibleBranches.reduce((sum, b) => {
      const bInvs = allInvoices.filter(i => i.branch_key === b.key_name);
      /* (٨ ت) نفس رقم صندوق الفرع في كل الشاشات — GMTCash */
      if (window.GMTCash) return sum + GMTCash.expected(bInvs, allTransfers.filter(t => t.branch_key === b.key_name)).expected;
      const sales = bInvs.reduce((s,i)=>s+(Number(i.total)||0),0);
      const bTrans = allTransfers.filter(t => t.branch_key === b.key_name && t.type !== 'expense');
      const transferred = bTrans.reduce((s,t)=>s+(Number(t.amount)||0),0);
      return sum + Math.max(0, sales - transferred);
    }, 0);
  })();

  // ════════ 4) المصاريف المعلّقة (الاعتماد والصندوق والربح من gmt-ledger.js) ════════
  /* (2026-10-05 ن-٣) البند ٢٠٩ — «مشتريات مو للبيع (سيارة · لابتوب · رفوف)»: المصروف الرأسمالي أصلٌ يبقى،
     فلا يُطرح من ربح الشهر. يُعرض وحده تحت «مشتريات رأسماليّة». النوع من عمود kind (SQL ٢٣)،
     أو من «النوع: رأسمالي» في الملاحظة إن سُجِّل قبل تشغيله. */
  const pendingExpenses = allExpenses.filter(e => !e.approved);

  // ════════ 5) فواتير الشراء — قيمة المنتجات + التكاليف المؤجَّلة (جمارك/شحن) ════════
  const purchasesThisMonth = allPurchases.filter(p => accInMonth(p.created_at || p.inv_date, ym));
  // التكاليف المؤجَّلة غير المدفوعة (جمارك + شحن + نقل + محلي)
  const unpaidCostsShipments = allPurchases.filter(p => {
    const hasCosts = (Number(p.cost_customs)||0) + (Number(p.cost_shipping)||0) + (Number(p.cost_transport)||0) + (Number(p.cost_local)||0) > 0;
    return hasCosts && !p.costs_paid;
  });
  const totalUnpaidCosts = unpaidCostsShipments.reduce((s,p) =>
    s + (Number(p.cost_customs)||0) + (Number(p.cost_shipping)||0) + (Number(p.cost_transport)||0) + (Number(p.cost_local)||0), 0);

  // البضائع قيد الاستيراد (لم تصل بعد)
  const inTransitShipments = allPurchases.filter(p => p.status && p.status !== 'arrived');
  const inTransitValue = inTransitShipments.reduce((s,p) => s + (Number(p.total_amount)||0), 0);

  // ════════ 6) المعلّق عند شركات الشحن (من الأوردرات) ════════
  const shippingPending = {};
  allOrdersAcc.forEach(o => {
    if ((o.status === 'shipped' || o.status === 'delivered') && o.shipping_company) {
      shippingPending[o.shipping_company] = (shippingPending[o.shipping_company]||0) + (Number(o.price)||0);
    }
  });
  const totalShippingPending = Object.values(shippingPending).reduce((s,v)=>s+v,0);

  // ════════ 7) عرابين الحجوزات + المتبقي ════════
  const activeReservations = allReservationsAcc.filter(r => r.status !== 'completed' && r.status !== 'cancelled');
  const totalDeposits  = activeReservations.reduce((s,r) => s + (Number(r.deposit)||0), 0);
  const totalRemaining = activeReservations.reduce((s,r) => {
    const full = Number(r.total_price || r.price || r.full_price) || 0;
    const dep  = Number(r.deposit) || 0;
    return s + Math.max(0, full - dep);
  }, 0);

  // ════════ 8) الديون اليدوية ════════
  const manualOwedToMe = allManualDebts.filter(d => d.direction === 'owed_to_me' && !d.settled).reduce((s,d)=>s+(Number(d.amount)||0),0);
  const manualIOwe     = allManualDebts.filter(d => d.direction === 'i_owe'      && !d.settled).reduce((s,d)=>s+(Number(d.amount)||0),0);

function purchaseCostsPendingRowHtml(p) {
  const totalCosts = (Number(p.cost_customs)||0) + (Number(p.cost_shipping)||0) + (Number(p.cost_transport)||0) + (Number(p.cost_local)||0);
  const dateStr = new Date(p.created_at || p.inv_date).toLocaleDateString('ar-SY',{day:'2-digit',month:'2-digit',year:'numeric'});
  return `
  <div class="inv-card" style="border-right:4px solid #be123c;margin-bottom:8px;cursor:default;">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">
      <div style="min-width:0;flex:1;">
        <div style="font-size:13px;font-weight:900;">${escH(p.supplier||'مورّد')} · #${escH(p.inv_number||p.id)}</div>
        <div style="font-size:11px;color:var(--text3);font-weight:700;">${dateStr} · ${escH(p.source_branch||'')}</div>
        <div style="font-size:10px;color:var(--text3);margin-top:3px;">
          ${p.cost_customs?`جمارك: ${Number(p.cost_customs).toFixed(2)}$ · `:''}
          ${p.cost_shipping?`شحن: ${Number(p.cost_shipping).toFixed(2)}$ · `:''}
          ${p.cost_transport?`نقل: ${Number(p.cost_transport).toFixed(2)}$ · `:''}
          ${p.cost_local?`محلي: ${Number(p.cost_local).toFixed(2)}$`:''}
        </div>
      </div>
      <div style="text-align:left;flex-shrink:0;">
        <div style="font-size:17px;font-weight:900;color:#be123c;">${totalCosts.toFixed(2)}$</div>
      </div>
    </div>
    <button onclick="markPurchaseCostsPaid('${p.id}')"
      style="width:100%;margin-top:8px;background:#dcfce7;color:#15803d;border:1.5px solid #86efac;border-radius:8px;
             padding:8px;font-family:'Cairo',sans-serif;font-size:11px;font-weight:800;cursor:pointer;">
      ✅ تسجيل الدفع — تم دفع هذه التكاليف
    </button>
  </div>`;
}

async function markPurchaseCostsPaid(purchaseId) {
  const p = allPurchases.find(x => String(x.id) === String(purchaseId));
  if (!p) return;
  const totalCosts = GMTLedger.costsTotal(p);
  const payer = await GMTAsk.prompt(`تأكيد دفع تكاليف الجمارك/الشحن (${totalCosts.toFixed(2)}$) لفاتورة #${p.inv_number||p.id}.\nمن دفعها؟ (يُحفظ اسمه على القيد)`, { title: 'من دفع الجمارك والشحن؟', value: (window.GMTRole && GMTRole.name && GMTRole.name()) || 'الإدارة' });
  if (payer === null) return;
  try {
    /* (٨ ج) لا مصروفٌ عامّ يُحسب مرّتين (الكلفة داخل net_cost + المصروف): قيدُ دفترٍ مرتبطٌ بالفاتورة، خروجَ نقدٍ فقط */
    await sb('PATCH', `/rest/v1/import_log?id=eq.${purchaseId}`, { costs_paid: true }, { Prefer:'return=minimal' });
    p.costs_paid = true;
    /* (مراجعة I-03) الصفّ الطازج لا المخبَّأ: الدفعة على الفاتورة قد تكون عُدّلت من شاشة الشراء بعد فتح هذه الصفحة */
    let fresh = p;
    try { const rows = await sb('GET', `/rest/v1/import_log?id=eq.${encodeURIComponent(purchaseId)}&select=*`); if (Array.isArray(rows) && rows[0]) { fresh = rows[0]; const ix = allPurchases.findIndex(x => String(x.id) === String(purchaseId)); if (ix >= 0) allPurchases[ix] = fresh; } } catch (_) {}
    const r = await GMTLedger.syncPurchase({ sb: (m, pp, b, x) => sb(m, pp, b, x) }, fresh, { payer: String(payer).trim() || 'الإدارة' });
    if (r.error) {
      showToast('⚠️ سُجّل «تُدفع» لكن تعذّر قيد المحاسبة: ' + r.error + ' — اضغط «اربطها الآن»', 'err');
    } else {
      showToast('✅ تم تسجيل الدفع — دخل المحاسبة (دافعها: ' + (String(payer).trim() || 'الإدارة') + ')', 'ok');
    }
    await loadExpenses();
    renderAccounting();
  } catch(e) { showToast('خطأ: ' + e.message, 'err'); }
}

async function printStockTransferInvoice(transferId) {
  /* (٨ ت — الصهر) كانت هنا نسخةٌ ثانية (~١٩٠ سطراً) من قالب الجرد، تطبع مكان الصورة مربّعاً رماديّاً لأنّ
     نافذة الطباعة بلا محمِّل صور ⇒ فاتورة نقل بلا صور. الآن القالبُ الواحد في gmt-transfer-print.js. */
  if (!transferId) return;
  const t = (allStockTransfersAdmin || []).find(x => String(x.id) === String(transferId));
  if (!t || !window.GMTTransferPrint) return;
  /* نافذة الطباعة تُفتح أوّلاً (قبل أيّ انتظار — كي لا يمنعها المتصفّح)، ثم نجلب البنود وصورَ منتجاتها */
  const _o = { products: _allProductsCache };
  _o.fetchItems = async (id) => {
    const res = await sb('GET', `/rest/v1/stock_transfer_items?transfer_id=eq.${id}&select=*`);
    const its = Array.isArray(res?.data) ? res.data : (Array.isArray(res) ? res : []);
    try { _o.products = await loadProductsForAdmin(); } catch (_) {}
    return its;
  };
  return GMTTransferPrint.print(t, _o);
}
