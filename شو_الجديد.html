  :root{ --red:#D5001C; --ink:#111827; --mut:#5b6472; --line:#E9ECF1; --bg:#F7F8FA; --card:#FFFFFF; }
  /* (TASK-0143) النظام فاتحٌ دائماً بهويّته — أُزيلت قاعدة الوضع الداكن للهاتف (طلب المالك 9 ت1 · seq 43) */ :root{color-scheme:light}
  :root[data-theme="dark"]{ --ink:#F3F4F6; --mut:#5b6472; --line:#2A2F3A; --bg:#12151B; --card:#1A1E26; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Cairo","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.85}

  header img{height:42px;width:auto;object-fit:contain;flex-shrink:0}

  .item{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:9px}
  .tag{border-radius:8px;padding:1px 9px;font-size:10.5px;font-weight:900}

  .pg{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .pg a{font-size:10.5px;font-weight:800;color:#A80016;background:rgba(213,0,28,.07);
        border-radius:7px;padding:1px 8px;text-decoration:none}
  .empty{text-align:center;padding:36px;color:var(--mut);font-weight:800}

<script src="gmt-whatsnew.js?v=20261025l"></script>
<script>
(function () {
  'use strict';
  var N = (window.GMTWhatsNew && window.GMTWhatsNew.news) || [];
  var listEl = document.getElementById('list');
  var subEl = document.getElementById('sub');
  var chipsEl = document.getElementById('chips');
  var filter = '';

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function fmt(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); }
  var TAGC = { 'جديد':['#065F46','#D1FAE5'],'إصلاح':['#92400E','#FEF3C7'],
               'أمان':['#991B1B','#FEE2E2'],'تغيير':['#1E40AF','#DBEAFE'] };

  subEl.textContent = N.length + ' تحديثاً · آخر دفعة ' + (window.GMTWhatsNew ? window.GMTWhatsNew.version : '—');

  var tags = [];
  N.forEach(function(n){ if (tags.indexOf(n.tag)===-1) tags.push(n.tag); });
  chipsEl.innerHTML = '<button class="chip on" data-t="">الكل</button>' +
    tags.map(function(t){ return '<button class="chip" data-t="'+esc(t)+'">'+esc(t)+'</button>'; }).join('');
  chipsEl.addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if(!b) return;
    filter = b.getAttribute('data-t') || '';
    [].forEach.call(chipsEl.querySelectorAll('.chip'), function(x){ x.classList.toggle('on', x===b); });
    render();
  });

  function render() {
    var rows = filter ? N.filter(function(n){ return n.tag===filter; }) : N.slice();
    if (!rows.length) { listEl.innerHTML = '<div class="empty">ما في بنود</div>'; return; }
    var byV = {}, order = [];
    rows.forEach(function(n){ if(!byV[n.v]){byV[n.v]=[];order.push(n.v);} byV[n.v].push(n); });
    order.sort(function(a,b){ return b-a; });
    listEl.innerHTML = order.map(function(v){
      return '<div class="batch"><b>الدفعة '+v+'</b><i></i></div>' +
        byV[v].map(function(n){
          var c = TAGC[n.tag] || ['#374151','#F3F4F6'];
          return '<div class="item">' +
            '<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">' +
              '<span class="tag" style="background:'+c[1]+';color:'+c[0]+'">'+esc(n.tag)+'</span>' +
              '<span class="t">'+esc(n.t)+'</span></div>' +
            '<div class="d">'+fmt(n.d)+'</div>' +
            (n.w ? '<div class="w">'+fmt(n.w)+'</div>' : '') +
            (n.pages && n.pages.length
              ? '<div class="pg">'+n.pages.map(function(p){
                  return '<a href="'+esc(p)+'">'+esc(p)+'</a>'; }).join('')+'</div>'
              : '<div class="pg"><span style="font-size:10.5px;font-weight:800;color:var(--mut)">كل الصفحات</span></div>') +
          '</div>';
        }).join('');
    }).join('');
  }
  render();
})();
</script>
