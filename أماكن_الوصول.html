<!DOCTYPE html>

<head>
<script>/* 🔒 صفحة داخلية — تسمح بالواجهات الداخلية (تلميحات · مفتّش · فحص ذاتي).
   الغياب = صفحة عامّة: المنع افتراضياً كي لا يكون النسيان تسريباً. */
window.GMT_INTERNAL = 1;
/* (٨ ث — تدقيق المطابقة) الزبون يفتحها من صفحة التتبّع بـ ?public=1 — كانت تظهر له أدواتنا الداخليّة
   (التلميحات · جرس الإشعارات · «ما الجديد»). الإعلان الصريح يقطعها كلّها. */
if (/[?&]public=1/.test(location.search)) window.GMT_PUBLIC = 1;</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أماكن الوصول — مكاتب شركات الشحن</title>
<link rel="icon" type="image/jpeg" href="logo.jpg">

<style>
  :root{ --red:#D5001C; --ink:#111827; --mut:#5b6472; --line:#E9ECF1; --bg:#F7F8FA; --card:#FFFFFF; }
  /* (2026-10-04 ك) بلاغك ١١: «شوف الألوان كيف خارج عن هويتنا… نحن عندنا اللون الأبيض، والخط غير
     مقروء». السبب: الصفحة كانت تتبع **الوضع الليلي للهاتف** فتنقلب داكنة. هويتنا بيضاء — أُزيل
     الانقلاب، وكبُر الخطّ وأزرار اللمس. */
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Cairo","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8}
  .wrap{max-width:1000px;margin:0 auto;padding:16px 14px 60px}
  header{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;
         display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header img{height:44px;width:auto;object-fit:contain;flex-shrink:0}
  .hbar{padding-inline-start:12px;border-inline-start:2px solid var(--line)}
  h1{font-size:17px;font-weight:900;color:var(--red)}
  .sub{font-size:11.5px;color:var(--mut);font-weight:700}
  .tools{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0 10px}
  input[type=search]{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);
    background:var(--card);color:var(--ink);font-family:inherit;font-size:14px;font-weight:700;outline:none;text-align:center}
  input[type=search]:focus{border-color:var(--red)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}
  .chip{padding:7px 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);
    color:var(--ink);font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer}
  .chip.on{background:var(--red);color:#fff;border-color:var(--red)}
  .cityhead{display:flex;align-items:center;gap:8px;margin:18px 0 8px}
  .cityhead b{font-size:14px;font-weight:900}
  .cityhead span{font-size:11px;color:var(--mut);font-weight:700}
  .cityhead i{flex:1;height:1px;background:var(--line);display:block}
  .grid{display:grid;grid-template-columns:1fr;gap:8px}
  @media(min-width:620px){ .grid{grid-template-columns:1fr 1fr} }
  @media(min-width:940px){ .grid{grid-template-columns:1fr 1fr 1fr} }
  .off{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 13px}
  .off b{display:block;font-size:15px;font-weight:900;margin-bottom:2px}
  .off p{font-size:13px;color:#4b5563;font-weight:700;line-height:1.75}
  .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .act{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);
    background:#fff;color:var(--ink);font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;text-decoration:none}
  .act:hover{border-color:rgba(213,0,28,.35)}
  .act.p{background:var(--ink);color:#fff;border-color:var(--ink)}
  .act.w svg{color:#25D366}
  .act.t{color:var(--ink)}
  .co{display:inline-block;font-size:10px;font-weight:900;color:var(--red);background:rgba(213,0,28,.08);
      border-radius:7px;padding:1px 8px;margin-top:6px}
  .empty{text-align:center;padding:40px 16px;color:var(--mut);font-weight:800;font-size:13px}
  .back{display:inline-block;margin-bottom:10px;font-size:12px;font-weight:800;color:var(--mut);text-decoration:none}
  .back:hover{color:var(--red)}
  @media print{ .tools,.back,.row{display:none!important} body{background:#fff} .off{break-inside:avoid} }
</style>

<body>
<div class="wrap">
  <a class="back" href="orders.html">→ رجوع للأوردرات</a>

  <header>
    <img src="logo.png" alt="مجموعة ميديا تيك"
         onerror="this.onerror=null;this.src='logo.jpg'">
    <div class="hbar">
      <h1>📍 أماكن الوصول</h1>
      <div class="sub" id="count">…</div>
    </div>
  </header>

  <!-- ══════════════════════════════════════════════════════════════════════
       (2026-09-26 · بلاغ المالك) «زرّ أماكن الوصول ما لازم يطلع منبثق، لأنّه
       عم يكون سيّئ… ليست مريحة وفيها شيء عم يختفي، شيء مو ضابط».
       ⇒ صفحة كاملة بدل نافذة: لا سقف ارتفاع يقطع القائمة، ولا طبقة تحجب،
       ولا تمرير داخل تمرير. وتُفتح في تبويب، وتُطبَع، وتُرسَل للموظّف كرابط.
       المصدر نفسه: GMTOffices — أي مكتب يُضاف هناك يظهر هنا تلقائياً.
       ══════════════════════════════════════════════════════════════════════ -->
  <div class="tools">
    <input type="search" id="q" placeholder="ابحث: دمشق · جرمانا · محراب · رقم هاتف…" autocomplete="off">
    <div class="chips" id="chips"></div>
  </div>

  <div id="list"></div>
</div>

<script src="gmt-brand.js?v=20261003"></script>
<script src="gmt-shipping-offices.js?v=20261003"></script>
<script>
(function () {
  'use strict';
  var co = '';
  var qEl = document.getElementById('q');
  var listEl = document.getElementById('list');
  var chipsEl = document.getElementById('chips');
  var countEl = document.getElementById('count');

  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  if (!window.GMTOffices) {
    listEl.innerHTML = '<div class="empty">ملفّ المكاتب غير محمّل (gmt-shipping-offices.js)</div>';
    return;
  }

  var G = window.GMTOffices;
  var companies = G.companies();
  countEl.textContent = G.all().length + ' مكتباً · ' + companies.length + ' شركات — اسأل الزبون من أي مكتب يستلم';

  chipsEl.innerHTML =
    '<button class="chip on" data-co="">كل الشركات</button>' +
    companies.map(function (c) {
      var t = G.trackUrlOf && G.trackUrlOf(c);
      return '<button class="chip" data-co="' + esc(c) + '">' + esc(c) + (t ? ' 📡' : '') + '</button>';
    }).join('');
  chipsEl.addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    co = b.getAttribute('data-co') || '';
    [].forEach.call(chipsEl.querySelectorAll('.chip'), function (x) { x.classList.toggle('on', x === b); });
    render();
  });
  qEl.addEventListener('input', render);

  function render() {
    var q = qEl.value.trim();
    /* بلا بحث: كل المكاتب مرتّبة بالمدينة — الموظّف يتصفّح. مع بحث: نتائج المحرّك
       نفسه الذي يستعمله حقل العنوان، فما يجده هنا يجده هناك. */
    var rows = q ? G.search(q, co || null, 400) : G.all(co || null);
    if (!rows.length) {
      listEl.innerHTML = '<div class="empty">ما في مكتب مطابق<br><span style="font-weight:700;font-size:12px">جرّب اسم المدينة أو جزءاً من اسم المكتب</span></div>';
      return;
    }
    /* تجميع بالمدينة — 166 مكتباً بلا تجميع كتلةٌ لا تُقرأ */
    var byCity = {}, order = [];
    rows.forEach(function (o) {
      if (!byCity[o.city]) { byCity[o.city] = []; order.push(o.city); }
      byCity[o.city].push(o);
    });
    listEl.innerHTML = order.map(function (city) {
      return '<div class="cityhead"><b>' + esc(city) + '</b><span>' + byCity[city].length + '</span><i></i></div>' +
        '<div class="grid">' + byCity[city].map(function (o) {
          var tel = String(o.phone || '').replace(/[^0-9+]/g, '');
          var track = G.trackUrlOf && G.trackUrlOf(o.company);
          return '<div class="off">' +
            '<b>' + esc(o.name) + '</b>' +
            '<p>' + esc(o.addr || '—') + (o.phone ? '<br><span dir="ltr">☎ ' + esc(o.phone) + '</span>' : '') + '</p>' +
            '<span class="co">' + esc(o.company) + '</span>' +
            '<div class="row">' +
              (tel ? '<a class="act p" href="tel:' + esc(tel) + '">اتصال</a>' : '') +
              (tel && !PUBLIC ? '<a class="act w" href="' + esc(waLink(o)) + '" target="_blank" rel="noopener" title="مراسلة المكتب على واتساب برسالةٍ جاهزة">' +
                     '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>واتساب</a>' : '') +
              '<button class="act" data-copy="' + esc(block(o)) + '">نسخ العنوان</button>' +
              (track ? '<a class="act t" href="' + esc(track) + '" target="_blank" rel="noopener">تتبّع</a>' : '') +
            '</div>' +
          '</div>';
        }).join('') + '</div>';
    }).join('');
  }

  /* ══ (2026-10-04 ك) بلاغك ١١ و١٢: «بدنا زرّ واتساب يأخذنا فوراً للواتساب بزنس برسالةٍ معبّأة:
     مرحباً، معكم أ. <الاسم المكتوب في الأوردرات> من مجموعة ميديا تيك التجارية، حابّين نستفسر
     عن شغلة من حضرتكم — مو حضرتكم شركة <الشركة> فرع <الفرع أو العنوان بلا الرقم>؟» ══ */
  /* (2026-10-05 س) البند ٩٨: «أماكن الاستلام» من صفحة التتبّع للزبون ⇒ نفس الملف **بلا كليشة الواتساب**
     (رسالتنا «معكم أ. … من مجموعة ميديا تيك» للموظّف لا للزبون). يبقى الاتصال ونسخ العنوان. */
  var PUBLIC = /[?&]public=1/.test(location.search);
  function operatorName() {
    try { if (window.GMTRole && GMTRole.isAdmin && GMTRole.isAdmin() && GMTRole.name && GMTRole.name()) return GMTRole.name(); } catch (_) {}
    try { var n = localStorage.getItem('gmt_operator_name'); if (n) return n; } catch (_) {}
    try { var s = JSON.parse(localStorage.getItem('gmt_session') || 'null'); if (s && s.display_name) return s.display_name; } catch (_) {}
    return '';
  }
  function intlPhone(p) {
    var d = String(p || '').replace(/[^0-9+]/g, '');
    if (d.indexOf('+') === 0) return d.slice(1);
    if (d.indexOf('00') === 0) return d.slice(2);
    if (d.indexOf('0') === 0) return '963' + d.slice(1);
    return d;
  }
  function waLink(o) {
    var who = operatorName();
    var msg = 'مرحباً، معكم ' + (who ? 'أ. ' + who + ' ' : '') + 'من مجموعة ميديا تيك التجارية. ' +
              'حابّين نستفسر عن شغلة من حضرتكم — مو حضرتكم شركة ' + (o.company || '') + ' فرع ' + (o.name || o.city || '') + '؟';
    var ph = intlPhone(o.phone);
    var web = 'https://wa.me/' + ph + '?text=' + encodeURIComponent(msg);
    /* على أندرويد: واتساب بزنس تحديداً (com.whatsapp.w4b)، وإن لم يكن مثبّتاً يفتح الرابط العاديّ */
    if (/Android/i.test(navigator.userAgent || '')) {
      return 'intent://send/?phone=' + ph + '&text=' + encodeURIComponent(msg) +
             '#Intent;scheme=whatsapp;package=com.whatsapp.w4b;S.browser_fallback_url=' + encodeURIComponent(web) + ';end';
    }
    return web;
  }

  function block(o) {
    var L = [o.city + ' — ' + o.name];
    if (o.addr) L.push(o.addr);
    if (o.phone) L.push(o.phone);
    if (o.company) L.push('(' + o.company + ')');
    return L.join('\n');
  }

  listEl.addEventListener('click', function (e) {
    var b = e.target.closest('[data-copy]');
    if (!b) return;
    var t = b.getAttribute('data-copy');
    try {
      navigator.clipboard.writeText(t);
      var old = b.textContent;
      b.textContent = '✅ نُسخ';
      setTimeout(function () { b.textContent = old; }, 1400);
    } catch (_) { /* بعض المتصفّحات تمنع الحافظة بلا إيماءة — الاختيار اليدوي يبقى */ }
  });

  render();
})();
</script>
