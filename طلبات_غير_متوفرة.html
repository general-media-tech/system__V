<html lang="ar" dir="rtl">
<head>

<title>ما يطلبه الزبائن ولا نملكه — GMT</title>

<!-- ══ (١١ ت١ — Notes ٨ ت١ ١٠:٢٠م) «لما يكون شيء مو متوفّر عندنا ولا شبيهه تلقائياً يُضاف الطلب لمكانٍ معيّن — أداة تنشئها: من طلب من عندنا هذا
     الشيء وما عنا منه ولا عنا شبيه له، ونحن بنشوف شو الشيء اللي عم ينطلب كتير ونتسوّقه.»
     يُملأ تلقائياً من «تحليل الشاشة» في عقل النظام (وبإدخال يدويّ هنا). مخزَّنٌ في gmt_audit (إضافةٌ فقط) — لا جدول جديد. للإدارة وحدها. ══ -->
<style>
:root{--red:#D5001C;--ln:rgba(15,18,25,.1);--tx:#0f1219;--mu:#5b6472}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 400px at 100% -10%,#ffe3e6 0,transparent 60%),#f7f8fa;color:var(--tx);font:15px/1.7 'Segoe UI',Tahoma,system-ui,sans-serif;background-repeat:no-repeat;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:14px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}.top h1{margin:0;font-size:20px;flex:1}
.sub{color:var(--mu);font-size:12.5px;margin:0 0 12px}
.card{background:#fff;border:1px solid var(--ln);border-radius:20px;padding:14px 16px;box-shadow:0 1px 2px rgba(15,18,25,.05),0 10px 30px rgba(15,18,25,.06);margin-bottom:12px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.in{border:1.5px solid var(--ln);border-radius:11px;padding:8px 11px;font:inherit;font-size:14px;background:#f8fafc;outline:none;min-width:150px;flex:1}.in:focus{border-color:var(--red);background:#fff}
.btn{border:1.5px solid var(--ln);background:#fff;border-radius:11px;padding:8px 14px;font:inherit;font-size:13.5px;font-weight:800;cursor:pointer;color:inherit;text-decoration:none}.btn.p{background:var(--red);border-color:var(--red);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{border:1.5px solid var(--ln);background:#fff;border-radius:99px;padding:5px 13px;font:inherit;font-size:13px;font-weight:800;color:#475569;cursor:pointer}.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.it{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--ln);border-radius:16px;padding:10px 14px;margin-bottom:8px}
.cnt{width:54px;height:54px;border-radius:14px;background:#fef2f2;color:#b91c1c;display:grid;place-items:center;font-weight:900;font-size:20px}
.it.res{opacity:.55}.it.res .cnt{background:#ecfdf5;color:#047857}
.tm{font-weight:900;font-size:15px}.mt{font-size:12px;color:var(--mu);margin-top:2px;line-height:1.8}
.ch{display:inline-block;border-radius:99px;padding:0 9px;font-size:11.5px;font-weight:900;margin-inline-end:4px}.ch.n{background:#fee2e2;color:#991b1b}.ch.o{background:#fef3c7;color:#92400e}.ch.r{background:#dcfce7;color:#166534}
.ex{font-size:12px;color:#334155;background:#f8fafc;border-radius:10px;padding:6px 10px;margin-top:6px;line-height:1.8}
.em{text-align:center;color:var(--mu);padding:28px 8px}
.warn{padding:11px 14px;border-radius:14px;background:#fffbeb;border:1px solid #fde68a;color:#78350f;font-weight:700;font-size:13px;line-height:1.8;margin-bottom:10px}
@media (max-width:560px){.it{grid-template-columns:48px 1fr}.it .act{grid-column:1/-1}.cnt{width:48px;height:48px}}
/* (TASK-0143) النظام فاتحٌ دائماً بهويّته — أُزيلت قاعدة الوضع الداكن للهاتف (طلب المالك 9 ت1 · seq 43) */ :root{color-scheme:light}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="btn" href="home.html">→ الرئيسيّة</a><h1>ما يطلبه الزبائن ولا نملكه</h1></div>
  <p class="sub">الأصناف التي طلبها زبائنكم ولم نجد لها مطابقاً ولا شبيهاً (أو نفدت). تُسجَّل تلقائياً من «تحليل الشاشة» في عقل النظام. الأكثر طلباً أولاً — لتقرّروا ما تتسوّقونه.</p>
  <div class="card">
    <div class="ctl">
      <input class="in" id="q" type="search" placeholder="بحث في الأصناف">
      <input class="in" id="add-t" placeholder="سجّل طلباً يدوياً: اسم الصنف" style="flex:2">
      <button class="btn p" id="add-b">إضافة</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div id="note"></div>
  <div id="list"><div class="em">جارٍ التحميل…</div></div>
  <div class="ctl" style="margin-top:10px"><button class="btn" id="cp">نسخ القائمة (الأعلى طلباً)</button><button class="btn" id="rl">تحديث</button></div>
</div>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function db() { return (window.GMT_DB && GMT_DB.MAIN) || null; }
  var S = { ev: [], f: { days: 30, kind: '', res: false, q: '' }, items: [] };
  function normKey(s) {
    return String(s || '').toLowerCase().replace(/[ً-ٟـ]/g, '').replace(/[إأآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
      .replace(/[^a-z0-9ء-ي\s]/g, ' ').replace(/\s+/g, ' ').trim();
  }
  async function load() {
    var d = db(); if (!d) { $('list').innerHTML = '<div class="warn">إعدادات القاعدة غير محمّلة.</div>'; return; }
    $('list').innerHTML = '<div class="em">جارٍ التحميل…</div>'; $('note').innerHTML = '';
    try { if (window.GMTOpLog) await GMTOpLog.flush(); } catch (_) {}
    try {
      var r = await fetch(d.url + '/rest/v1/gmt_audit?select=at,actor,action,entity_name,entity_id,field,new_value,meta&action=in.(unmet_demand,unmet_resolved)&order=at.desc&limit=3000',
        { headers: { apikey: d.key, Authorization: 'Bearer ' + d.key }, cache: 'no-store' });
      if (!r.ok) { $('list').innerHTML = '<div class="warn">' + ((r.status === 404 || r.status === 400) ? 'جدول <b>gmt_audit</b> غير منشأ — شغّل ملف SQL الأساس («0_الأساس_الرئيسية_جزء1.sql»).' : 'تعذّرت القراءة (HTTP ' + r.status + ').') + '</div>'; return; }
      S.ev = await r.json();
    } catch (e) { $('list').innerHTML = '<div class="warn">لا اتصال بالقاعدة — أعد المحاولة.</div>'; return; }
    build(); paint();
  }
  /* تجميع الأحداث (من الأحدث للأقدم) بمفتاح الصنف. «عولج» = آخر حدثٍ للمفتاح هو unmet_resolved؛ والطلبات بعده تفتحه من جديد */
  function build() {
    var map = {};
    S.ev.forEach(function (e) {
      var nv = {}; try { nv = e.new_value ? JSON.parse(e.new_value) : {}; } catch (_) {}
      var k = nv.k || e.entity_id || normKey(e.entity_name); if (!k) return;
      var it = map[k] || (map[k] = { k: k, term: e.entity_name || k, n: 0, none: 0, out: 0, last: e.at, first: e.at, actors: {}, ex: [], resolvedAt: null, terms: {} });
      if (e.action === 'unmet_resolved') { if (!it.resolvedAt && !it.seenDemand) it.resolvedAt = e.at; return; }
      it.seenDemand = true;
      if (it.resolvedAt && e.at <= it.resolvedAt) return;      // ما قبل المعالجة لا يُعدّ
      it.n++; if (e.field === 'out') it.out++; else it.none++;
      it.first = e.at; it.actors[e.actor || '—'] = 1; it.terms[e.entity_name] = (it.terms[e.entity_name] || 0) + 1;
      if (nv.msg && it.ex.length < 3 && it.ex.indexOf(nv.msg) < 0) it.ex.push(nv.msg);
    });
    var items = Object.keys(map).map(function (k) { var it = map[k]; var best = Object.keys(it.terms).sort(function (a, b) { return it.terms[b] - it.terms[a]; })[0]; if (best) it.term = best; it.keys = [k]; return it; })
      .filter(function (it) { return it.n > 0 || it.resolvedAt; });
    S.items = mergeSimilar(items);
  }
  /* «حامل ثلاثي كاربون» و«حامل ثلاثي كاربون خفيف» صنفٌ واحد: ندمج ما تطابقت كلماته (احتواء ≥ ٢ كلمة أو تشابه ≥ ٦٠٪) —
     وحالةُ المعالجة تُحفَظ بكل مفاتيح الدمج فلا ينفصل المدموج عند «تمّ توفيره» */
  function toks(s) { return normKey(s).split(' ').filter(function (t) { return t.length >= 2; }); }
  function mergeSimilar(items) {
    var list = items.slice().sort(function (a, b) { return (b.n - a.n) || (new Date(b.last) - new Date(a.last)); }), out = [];
    list.forEach(function (it) {
      var ta = toks(it.term), host = null;
      for (var i = 0; i < out.length && !host; i++) {
        var o = out[i]; if ((o.n > 0) !== (it.n > 0)) continue;          // لا نخلط المفتوح بالمعالَج
        var tb = toks(o.term); if (!ta.length || !tb.length) continue;
        var inter = ta.filter(function (t) { return tb.indexOf(t) >= 0; }).length;
        var small = Math.min(ta.length, tb.length), union = ta.length + tb.length - inter;
        if ((inter >= 2 && inter === small) || inter / union >= 0.6) host = o;
      }
      if (!host) { out.push(it); return; }
      host.n += it.n; host.none += it.none; host.out += it.out; host.keys = host.keys.concat(it.keys);
      if (new Date(it.last) > new Date(host.last)) host.last = it.last; if (new Date(it.first) < new Date(host.first)) host.first = it.first;
      Object.keys(it.actors).forEach(function (a) { host.actors[a] = 1; });
      it.ex.forEach(function (m) { if (host.ex.length < 3 && host.ex.indexOf(m) < 0) host.ex.push(m); });
      if (it.resolvedAt && (!host.resolvedAt || it.resolvedAt > host.resolvedAt)) host.resolvedAt = it.resolvedAt;
    });
    return out;
  }
  function visible() {
    var f = S.f, since = f.days ? Date.now() - f.days * 864e5 : 0, q = normKey(f.q);
    return S.items.filter(function (it) {
      var open = it.n > 0 && !(it.resolvedAt && !it.n);
      if (!f.res && !(it.n > 0)) return false;
      if (f.res && it.n > 0) return false;
      if (since && new Date(it.last).getTime() < since && it.n > 0) return false;
      if (f.kind === 'none' && !it.none) return false;
      if (f.kind === 'out' && !it.out) return false;
      if (q && normKey(it.term).indexOf(q) < 0) return false;
      return true;
    }).sort(function (a, b) { return b.n - a.n || new Date(b.last) - new Date(a.last); });
  }
  function fd(at) { try { return new Date(at).toLocaleDateString('ar-SY', { day: 'numeric', month: 'short' }); } catch (_) { return ''; } }
  function paint() {
    var defs = [['d7', 'آخر ٧ أيام'], ['d30', 'آخر ٣٠ يوماً'], ['d0', 'كل الوقت'], ['kn', 'غير موجود أصلاً'], ['ko', 'نفد عندنا'], ['rs', 'المعالَجة']];
    $('chips').innerHTML = defs.map(function (d) {
      var on = (d[0] === 'd' + S.f.days) || (d[0] === 'kn' && S.f.kind === 'none') || (d[0] === 'ko' && S.f.kind === 'out') || (d[0] === 'rs' && S.f.res);
      return '<button class="chip' + (on ? ' on' : '') + '" data-c="' + d[0] + '">' + d[1] + '</button>';
    }).join('');
    var list = visible();
    if (!list.length) { $('list').innerHTML = '<div class="em">' + (S.items.length ? 'لا نتائج بهذا الفلتر.' : 'لا طلبات مسجّلة بعد. تُضاف هنا تلقائياً حين يحلّل «تحليل الشاشة» طلباً لا نملكه، أو يدوياً من الأعلى.') + '</div>'; return; }
    $('list').innerHTML = list.slice(0, 300).map(function (it) {
      var res = S.f.res;
      return '<div class="it' + (res ? ' res' : '') + '" data-k="' + esc(it.k) + '"><div class="cnt">' + (res ? '✓' : it.n) + '</div><div><div class="tm">' + esc(it.term) + '</div>' +
        '<div class="mt">' + (it.none ? '<span class="ch n">لا نملكه ' + it.none + '</span>' : '') + (it.out ? '<span class="ch o">نفد عندنا ' + it.out + '</span>' : '') +
        (res ? '<span class="ch r">عولج ' + fd(it.resolvedAt) + '</span>' : 'آخر طلب ' + fd(it.last) + ' · أوّل طلب ' + fd(it.first)) + ' · بواسطة ' + esc(Object.keys(it.actors).slice(0, 3).join('، ')) + '</div>' +
        (it.ex.length && !res ? '<div class="ex">' + it.ex.map(function (m) { return '«' + esc(m) + '»'; }).join('<br>') + '</div>' : '') + '</div>' +
        '<div class="act">' + (res ? '' : '<button class="btn" data-done>تمّ توفيره / عولج</button>') + '</div></div>';
    }).join('');
  }
  function logEv(action, term, k, extra) {
    if (!window.GMTOpLog) return false;
    GMTOpLog.log({ action: action, entity: 'demand', entityName: term, entityId: k, field: extra && extra.kind, newValue: Object.assign({ k: k }, extra || {}) });
    return true;
  }
  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest('[data-c]'); if (!b) return; var c = b.getAttribute('data-c');
    if (c[0] === 'd') { S.f.days = +c.slice(1); S.f.res = false; } else if (c === 'kn') S.f.kind = S.f.kind === 'none' ? '' : 'none'; else if (c === 'ko') S.f.kind = S.f.kind === 'out' ? '' : 'out'; else if (c === 'rs') S.f.res = !S.f.res;
    paint();
  });
  $('q').addEventListener('input', function () { S.f.q = this.value; paint(); });
  $('list').addEventListener('click', async function (e) {
    var b = e.target.closest('[data-done]'); if (!b) return; var row = b.closest('[data-k]'), k = row.getAttribute('data-k');
    var it = S.items.filter(function (x) { return x.k === k; })[0]; if (!it) return;
    if (!(await GMTAsk.confirm('تعليم «' + it.term + '» كمعالَج (وفّرناه أو قرّرنا تجاهله)؟ يعود للقائمة إن طُلب من جديد.', { title: 'تمّ توفيره', okText: 'نعم' }))) return;
    (it.keys || [k]).forEach(function (kk) { logEv('unmet_resolved', it.term, kk, { src: 'manual' }); });
    it.n = 0; it.none = 0; it.out = 0; it.resolvedAt = new Date().toISOString(); paint();
    try { await GMTOpLog.flush(); } catch (_) {}
  });
  $('add-b').addEventListener('click', async function () {
    var t = $('add-t').value.trim(); if (t.length < 2) return;
    var k = normKey(t).split(' ').filter(Boolean).join(' '); if (!k) return;
    logEv('unmet_demand', t, k, { kind: 'none', src: 'manual', msg: 'سُجّل يدوياً' });
    $('add-t').value = ''; try { await GMTOpLog.flush(); } catch (_) {} load();
  });
  $('cp').addEventListener('click', function () {
    var list = visible().slice(0, 40); if (!list.length) return;
    var txt = 'ما يطلبه الزبائن ولا نملكه — ' + new Date().toISOString().slice(0, 10) + '\n' + list.map(function (it, i) { return (i + 1) + '. ' + it.term + ' × ' + it.n + (it.out && !it.none ? ' (نفد)' : ''); }).join('\n');
    try { navigator.clipboard.writeText(txt); GMTAsk.alert('نُسخت ' + list.length + ' سطراً.', { title: 'تمّ' }); } catch (_) {}
  });
  $('rl').addEventListener('click', load);
  load();
})();
</script>
