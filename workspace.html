     workspace.html — مساحة العمل (TASK-B0516 · المالك seq 830 «ADVANCED MULTI-WINDOW & MULTI-WORKSPACE SYSTEM» · seq 834 «نفذها»)

     قشرةٌ تحمل صفحات النظام **كما هي** — كلّ تبويبٍ أو نافذةٍ إطارٌ مستقلّ من نفس الموقع:
       • لا إعادة تحميل عند التنقّل: الإطار يبقى حيّاً، فتعود للأوردرات وتجد ما كتبته.
       • استقلالية: لكلّ إطارٍ متغيّراته ونوافذه — لا تختلط بيانات نافذتين، ويُفتح القسم نفسه أكثر من مرّة.
       • الصلاحيات: كلّ صفحةٍ تحرس نفسها داخل إطارها كما تفعل خارجه.
       • النظام الحالي لم يتغيّر: من لا يفتح مساحة العمل يستعمل الصفحات كما اليوم.
     الاختصارات التي يحجزها المتصفّح (Ctrl+T · Ctrl+W · Ctrl+Tab · Alt+Tab) لها بدائل Alt+… وتُخصَّص من «⌨︎ الاختصارات».

<style>

      { t: 'الاختصارات', d: 'عرض وتخصيص', k: 'keys', run: keysDialog },
      { t: 'سجلّ التراجع في الصفحة الحالية', d: 'ما يمكن التراجع عنه فعلاً', k: 'hist', run: function () { var w = null; try { w = frames[S.active].contentWindow; } catch (_) {} if (w && w.GMTUndo && w.GMTUndo.panel) w.GMTUndo.panel(); else toast('هذه الصفحة لا تدعم التراجع بعد — المدعوم: الجرد والأوردرات'); } }
    ].filter(function (c) { return !c.hide; });
    spaces().forEach(function (w) { C.push({ t: 'مساحة: ' + w.name, d: w.urls.map(titleOf).join(' · '), k: 'ws', run: function () { applyWs(w); } }); });
    return C;
  }
  var palIdx = 0;
  function palette(q0) {
    var ov = layer('<div class="mh">' + ic('search', 18) + '<input id="pq" placeholder="اكتب اسم صفحة أو أمر… (Enter تبويب · Shift+Enter نافذة عائمة · Alt+Enter تقسيم)" autocomplete="off" aria-label="بحث في الصفحات والأوامر"></div><div class="mb" id="pr"></div>');
    var inp = ov.querySelector('#pq'), res = ov.querySelector('#pr'), items = [];
    inp.value = q0 || '';
    function draw() {
      var q = inp.value.trim(), r = role() === 'guest' ? 'guest' : 'admin', n = window.GMTTools ? GMTTools.norm(q) : q;
      var tools = (T ? T.search(q, r) : []).filter(function (x) { return canOpen(x.f); }).slice(0, 30);
      var cmds = commands().filter(function (c) { return !q || (window.GMTTools ? GMTTools.norm(c.t + ' ' + c.d) : c.t).indexOf(n) >= 0; });
      var open = S.tabs.concat(S.floats).filter(function (t) { return q && (window.GMTTools ? GMTTools.norm(t.title) : t.title).indexOf(n) >= 0; });
      items = [];
      var html = '';
      if (open.length) { html += '<div class="sec">مفتوحة الآن</div>'; open.forEach(function (t) { items.push({ go: function () { if (findTab(t.id)) activate(t.id); else { var fl = findFloat(t.id); fl.min = false; placeFloat(fl); raise(fl); paintDock(); } } }); html += row(items.length - 1, iconOf(t.url), t.title, 'انتقل إليها', ''); }); }
      if (cmds.length) { html += '<div class="sec">أوامر</div>'; cmds.forEach(function (c) { items.push({ go: c.run }); html += row(items.length - 1, 'grid', c.t, c.d, keyLabel(c.k)); }); }
      if (tools.length) { html += '<div class="sec">صفحات النظام</div>'; tools.forEach(function (x) { items.push({ url: x.f }); html += row(items.length - 1, x.ic, x.t, x.d, ''); }); }
      res.innerHTML = html || '<div class="sec">لا نتائج</div>';
      palIdx = Math.min(palIdx, Math.max(0, items.length - 1)); hl();
    }
    function row(i, icn, t, d, k) { return '<div class="row" data-i="' + i + '" role="option"><span class="ic">' + ic(icn, 17) + '</span><span style="min-width:0"><b>' + esc(t) + '</b><small>' + esc(d) + '</small></span><span class="k">' + k + '</span></div>'; }
    function hl() { [].forEach.call(res.querySelectorAll('.row'), function (r) { r.classList.toggle('on', +r.getAttribute('data-i') === palIdx); }); var on = res.querySelector('.row.on'); if (on) on.scrollIntoView({ block: 'nearest' }); }
    function go(i, how) { var it = items[i]; if (!it) return; closeLayers(); if (it.go) it.go(); else if (how === 'float') openFloat(it.url); else if (how === 'split') { var t = openTab(it.url, { bg: true }); if (t) splitWith(t.id); } else openTab(it.url); }

      else if (e.key === 'Escape') closeLayers();
    });
    res.addEventListener('click', function (e) { var r = e.target.closest('.row'); if (r) go(+r.getAttribute('data-i'), e.shiftKey ? 'float' : 'tab'); });
    res.addEventListener('contextmenu', function (e) { var r = e.target.closest('.row'); if (!r) return; e.preventDefault(); var i = +r.getAttribute('data-i'); if (!items[i] || !items[i].url) return; menu(e.clientX, e.clientY, [['افتح في تبويب', function () { go(i, 'tab'); }], ['افتح نافذة عائمة', function () { go(i, 'float'); }], ['افتح في القسم الثاني', function () { go(i, 'split'); }, MOBILE()]]); });
    draw(); setTimeout(function () { inp.focus(); }, 30);
  }
  /* كل الصفحات المفتوحة — بطاقات (للهاتف خاصّةً) */
  function allOpen() {
    var ov = layer('<div class="mh"><b style="flex:1">الصفحات المفتوحة (' + (S.tabs.length + S.floats.length) + ')</b><button class="ib" type="button" data-new>' + ic('plus', 15) + '<span class="lb">جديدة</span></button><button class="ib" type="button" data-x aria-label="إغلاق">' + (ic('close', 15) || '×') + '</button></div><div class="grid" id="ag"></div>');
    function draw() {
      ov.querySelector('#ag').innerHTML = S.tabs.map(function (t) { return card(t, 'tab'); }).join('') + S.floats.map(function (t) { return card(t, 'float'); }).join('');
    }
    function card(t, kind) {
      var on = t.id === S.active || t.id === S.split.right;
      return '<div class="card' + (on ? ' on' : '') + '" data-id="' + t.id + '" data-k="' + kind + '"><span style="color:var(--red);display:grid">' + ic(iconOf(t.url), 20) + '</span><b>' + (dirty[t.id] ? '● ' : '') + esc(t.title) + '</b><small>' + (kind === 'float' ? (t.min ? 'نافذة مصغّرة' : 'نافذة عائمة') : 'تبويب') + '</small><button class="x" type="button" data-cl aria-label="إغلاق">' + (ic('close', 13) || '×') + '</button></div>';
    }
    ov.addEventListener('click', function (e) {
      if (e.target.closest('[data-x]')) { closeLayers(); return; }

      var c = e.target.closest('.card'); if (!c) return; var id = c.getAttribute('data-id'), k = c.getAttribute('data-k');
      if (e.target.closest('[data-cl]')) { (k === 'tab' ? closeTab : closeFloat)(id); setTimeout(draw, 300); return; }
      closeLayers(); if (k === 'tab') activate(id); else { var fl = findFloat(id); fl.min = false; placeFloat(fl); raise(fl); paintDock(); }
    });

    ov.addEventListener('pointerdown', function (e) { el = e.target.closest('.card'); sx = el ? e.clientX : null; });

    draw();
  }

  /* ═══ مساحات العمل ═══ */
  var PRESETS = [
    { name: 'المبيعات', urls: ['orders.html', 'sales_log.html', 'admin_pos.html?tab=customers', 'inventory.html'] },
    { name: 'الإدارة', urls: ['sales_log.html', 'admin_pos.html?tab=expenses', 'admin_pos.html?tab=transfers', 'admin_pos.html?tab=users'] },
    { name: 'الجرد', urls: ['inventory.html', 'المنتجات.html', 'admin_pos.html?tab=stocktransfers'] }
  ];
  function spaces() {
    var mine = lsGet(LS_WSS, []);
    return PRESETS.concat(Array.isArray(mine) ? mine : []).map(function (w) { return { name: w.name, urls: (w.urls || []).filter(canOpen), mine: PRESETS.indexOf(w) < 0 }; }).filter(function (w) { return w.urls.length; });
  }
  async function applyWs(w) {
    var d = S.tabs.filter(function (t) { return isDirty(t.id); });
    if (d.length && !(await GMTAsk.confirm('في ' + d.length + ' صفحة تغييرات غير محفوظة. نفتح «' + w.name + '» بجانبها ونترك المفتوح كما هو؟', { title: 'مساحة عمل', okText: 'افتح بجانبها' }))) return;
    var first = null;
    w.urls.forEach(function (u) { var ex = S.tabs.find(function (t) { return t.url === u; }); if (ex) { if (!first) first = ex.id; return; } var t = { id: uid(), url: u, title: titleOf(u) }; S.tabs.push(t); if (!first) first = t.id; });
    S.ws = w.name; $('ws-name').textContent = w.name; if (first) activate(first); toast('مساحة «' + w.name + '» · ' + w.urls.length + ' صفحات');
  }
  async function saveWs() {
    var name = await GMTAsk.prompt('اسم مساحة العمل (تُحفظ على هذا الجهاز لحسابك):', { title: 'حفظ مساحة العمل', okText: 'حفظ', value: S.ws || '' });
    if (!name || !String(name).trim()) return;
    var mine = lsGet(LS_WSS, []); mine = (Array.isArray(mine) ? mine : []).filter(function (w) { return w.name !== name; });
    mine.push({ name: String(name).trim(), urls: S.tabs.map(function (t) { var u = t.url; try { u = relUrl(frames[t.id].contentWindow.location.href) || u; } catch (_) {} return u; }) });
    lsSet(LS_WSS, mine); S.ws = name; $('ws-name').textContent = name; save(); toast('حُفظت مساحة «' + name + '»');
  }
  function wsMenu(x, y) {
    var items = spaces().map(function (w) { return [(S.ws === w.name ? '✓ ' : '') + w.name + ' (' + w.urls.length + ')', function () { applyWs(w); }]; });
    items.push(null, ['حفظ المفتوح الآن كمساحة…', saveWs]);
    var mine = lsGet(LS_WSS, []); if (Array.isArray(mine) && mine.length) items.push(['حذف مساحة محفوظة…', async function () { var k = await GMTAsk.choose('أيّ مساحة تحذف؟', { title: 'حذف مساحة', choices: mine.map(function (w) { return { k: w.name, t: w.name }; }) }); if (!k) return; lsSet(LS_WSS, mine.filter(function (w) { return w.name !== k; })); toast('حُذفت «' + k + '»'); }]);
    menu(x, y, items);
  }

  /* ═══ الاختصارات — قابلة للتخصيص مع كشف التعارض ═══ */
  var ACTIONS = [
    ['palette', 'مركز الأوامر', 'Ctrl+K'], ['new', 'تبويب جديد', 'Alt+T'], ['close', 'إغلاق التبويب الحالي', 'Alt+W'],
    ['next', 'التبويب التالي', 'Alt+ArrowLeft'], ['prev', 'التبويب السابق', 'Alt+ArrowRight'], ['split', 'تقسيم / إلغاء التقسيم', 'Alt+S'],
    ['float', 'الصفحة الحالية نافذة عائمة', 'Alt+F'], ['floats', 'التنقّل بين النوافذ العائمة', 'Alt+`'], ['ws', 'أوامر مساحة العمل', 'Alt+P'],
    ['all', 'كل الصفحات المفتوحة', 'Alt+A'], ['undo', 'تراجع', 'Ctrl+Z'], ['redo', 'إعادة', 'Ctrl+Y'], ['redo2', 'إعادة (بديل)', 'Ctrl+Shift+Z']
  ];
  /* ما يحجزه المتصفّح أو نظام التشغيل أو ما يخصّ الكتابة — لا يُسمح بتعيينه */
  var RESERVED = ['Ctrl+C', 'Ctrl+V', 'Ctrl+X', 'Ctrl+A', 'Ctrl+T', 'Ctrl+W', 'Ctrl+N', 'Ctrl+Tab', 'Ctrl+Shift+Tab', 'Alt+Tab', 'Ctrl+Shift+N', 'Ctrl+L', 'Ctrl+R', 'Ctrl+P', 'Alt+F4'];
  function keymap() { var m = lsGet(LS_KEYS, {}); var out = {}; ACTIONS.forEach(function (a) { out[a[0]] = (m && m[a[0]]) || a[2]; }); return out; }
  function keyLabel(k) { var m = keymap(), map = { all: 'all', split: 'split', float: 'float', new: 'new', keys: '', ws: 'ws', savews: '' }; var key = m[map[k] || k]; return key ? '<kbd>' + esc(key) + '</kbd>' : ''; }
  function comboOf(e) {
    var k = e.key; if (!k || /^(Control|Shift|Alt|Meta)$/.test(k)) return '';
    if (k.length === 1) k = k.toUpperCase();
    if (e.code && /^Key[A-Z]$/.test(e.code)) k = e.code.slice(3);           /* مستقلّ عن لغة لوحة المفاتيح (عربي/إنكليزي) */
    if (e.code === 'Backquote') k = '`';
    return (e.ctrlKey || e.metaKey ? 'Ctrl+' : '') + (e.altKey ? 'Alt+' : '') + (e.shiftKey ? 'Shift+' : '') + k;
  }
  function typing(e) { var t = e.target; return !!(t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))); }
  function onKey(e, fromFrame) {
    var c = comboOf(e); if (!c) return;
    var m = keymap(), act = null; Object.keys(m).forEach(function (k) { if (m[k] === c) act = k; });
    if (!act) return;
    /* التراجع والإعادة داخل خانة كتابة تبقى للخانة نفسها — لا نستولي عليها */
    if ((act === 'undo' || act === 'redo' || act === 'redo2') && typing(e)) return;
    e.preventDefault(); e.stopPropagation();
    run(act);
  }
  function run(act) {
    if (act === 'palette') palette('');
    else if (act === 'new') palette('');
    else if (act === 'close') { var fl = S.floats.filter(function (x) { return !x.min; }).sort(function (a, b) { return (b.z || 0) - (a.z || 0); })[0]; var fe = document.activeElement && document.activeElement.closest && document.activeElement.closest('.fw'); if (fl && fe) closeFloat(fl.id); else closeTab(S.split.on && S.focus === 1 ? S.split.right : S.active); }
    else if (act === 'next') cycle(1); else if (act === 'prev') cycle(-1);
    else if (act === 'split') { S.split.on ? unsplit() : splitWith(); }
    else if (act === 'float') tabToFloat(S.split.on && S.focus === 1 ? S.split.right : S.active);
    else if (act === 'floats') cycleFloats();
    else if (act === 'ws') { var r = $('b-ws').getBoundingClientRect(); wsMenu(r.right, r.bottom + 4); }
    else if (act === 'all') allOpen();
    else if (act === 'undo' || act === 'redo' || act === 'redo2') undoRedo(act === 'undo' ? 'undo' : 'redo');
  }
  /* التراجع والإعادة: يُمرَّران للصفحة النشطة إن كانت تدعمهما فعلاً (GMTUndo) — لا تراجع وهميّ */
  function undoRedo(kind) {
    var id = S.split.on && S.focus === 1 ? S.split.right : S.active;
    var fl = S.floats.filter(function (x) { return !x.min; }).sort(function (a, b) { return (b.z || 0) - (a.z || 0); })[0];
    var fe = document.activeElement && document.activeElement.tagName === 'IFRAME' && document.activeElement.closest('.fw'); if (fe && fl) id = fl.id;
    var w = null; try { w = frames[id] && frames[id].contentWindow; } catch (_) {}
    var U = w && w.GMTUndo;
    if (U && U[kind]) { Promise.resolve(U[kind]()).then(function (r) { toast(r && r.msg ? r.msg : (kind === 'undo' ? 'تمّ التراجع' : 'تمّت الإعادة')); }, function (e) { toast('تعذّر: ' + ((e && e.message) || e)); }); }
    else toast(kind === 'undo' ? 'لا عملية قابلة للتراجع في هذه الصفحة' : 'لا عملية لإعادتها');
  }
  addEventListener('keydown', function (e) { onKey(e, false); }, true);
  function keysDialog() {
    var m = keymap(), wait = null;
    var ov = layer('<div class="mh"><b style="flex:1">الاختصارات</b><button class="ib" type="button" data-reset>الافتراضي</button><button class="ib" type="button" data-x aria-label="إغلاق">' + (ic('close', 15) || '×') + '</button></div><div class="mb"><div class="kb" id="kb"></div><p style="padding:0 12px 12px;margin:0;color:var(--mu);font-size:12px">اضغط الزرّ ثمّ الاختصار الجديد. محجوزة للمتصفّح أو للكتابة ولا تُعيَّن: ' + RESERVED.map(function (k) { return '<kbd>' + k + '</kbd>'; }).join(' ') + '</p></div>');
    function draw(bad) {
      ov.querySelector('#kb').innerHTML = ACTIONS.map(function (a) { return '<span class="cap">' + esc(a[1]) + '</span><button type="button" data-k="' + a[0] + '"' + (wait === a[0] ? ' class="wait"' : '') + '>' + (wait === a[0] ? 'اضغط الاختصار…' : esc(m[a[0]])) + '</button>'; }).join('') + (bad ? '<div class="bad">' + esc(bad) + '</div>' : '');
    }
    ov.addEventListener('click', function (e) {
      if (e.target.closest('[data-x]')) { closeLayers(); return; }
      if (e.target.closest('[data-reset]')) { lsSet(LS_KEYS, {}); m = keymap(); draw(); toast('رجعت الاختصارات الافتراضية'); return; }
      var b = e.target.closest('[data-k]'); if (b) { wait = b.getAttribute('data-k'); draw(); }
    });
    ov.addEventListener('keydown', function (e) {
      if (!wait) return; var c = comboOf(e); if (!c) return; e.preventDefault(); e.stopPropagation();
      if (c === 'Escape') { wait = null; draw(); return; }
      if (RESERVED.indexOf(c) >= 0) { draw('«' + c + '» محجوز للمتصفّح أو للكتابة — اختر غيره'); return; }
      if (!/^(Ctrl|Alt)\+/.test(c)) { draw('الاختصار يحتاج Ctrl أو Alt'); return; }
      var clash = ACTIONS.find(function (a) { return a[0] !== wait && m[a[0]] === c; });
      if (clash) { draw('«' + c + '» مستعمل لـ«' + clash[1] + '» — غيّر ذاك أوّلاً'); return; }
      m[wait] = c; var st = lsGet(LS_KEYS, {}); st[wait] = c; lsSet(LS_KEYS, st); wait = null; draw();
    }, true);
    draw();
  }

  /* ═══ الأزرار ═══ */

  $('b-all').onclick = allOpen;
  $('b-split').onclick = function () { S.split.on ? unsplit() : splitWith(); };
  $('b-cmd').onclick = function () { palette(''); };

  [].forEach.call(document.querySelectorAll('[data-ic]'), function (el) { el.innerHTML = ic(el.getAttribute('data-ic'), 17); });
  if (S.ws) $('ws-name').textContent = S.ws;

  /* ═══ الجلسة: تغيّر الحساب أو خروجه من أيّ تبويب ⇒ القشرة تتبعه فوراً (لا بيانات بعد الخروج) ═══ */
  var who0 = role() + ':' + ((session() || {}).id || '');
  addEventListener('storage', function (e) {
    if (e.key !== 'gmt_session' && e.key !== 'gmt_active_acct' && e.key !== null) return;
    var who = role() + ':' + ((session() || {}).id || ''); if (who === who0) return;
    Object.keys(frames).forEach(killFrame); S.tabs = [{ id: uid(), url: 'home.html', title: 'الرئيسية' }]; S.active = S.tabs[0].id; S.floats = []; S.split = { on: false, right: null, ratio: 0.5 };
    [].forEach.call(document.querySelectorAll('.fw'), function (x) { x.parentNode.removeChild(x); });
    who0 = who; render(); toast('تغيّر الحساب — أُغلقت الصفحات المفتوحة');
  });
  addEventListener('beforeunload', function (e) {
    save();
    var any = S.tabs.concat(S.floats).some(function (t) { return isDirty(t.id); });
    if (any) { e.preventDefault(); e.returnValue = ''; return ''; }
  });
  addEventListener('resize', function () { S.floats.forEach(placeFloat); if (MOBILE() && S.split.on && innerWidth < 700) unsplit(); });

  /* واجهة للصفحات داخل الإطارات (الرئيسيّة تفتح أدواتها تبويباتٍ) */
  window.GMTWS = { open: function (u, o) { return openTab(u, o); }, float: openFloat, split: function (u) { var t = openTab(u, { bg: true }); if (t) splitWith(t.id); }, home: function () { activate(S.tabs[0].id); }, dirty: function (w, v) { for (var id in frames) { try { if (frames[id].contentWindow === w) setDirty(id, v); } catch (_) {} } } };

  render();
  S.floats.forEach(function (fl) { mountFloat(fl); }); paintDock();
})();
