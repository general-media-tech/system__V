<!-- ═══════════════════════════════════════════════════════════════════════════
     home.html — الواجهة الرئيسية · (2026-10-04 م)

     طلبُك بنصّه: «لأيّ تصميمٍ بعطيك ياه انسخ التصميم حرفياً، ضيف عليه الأشياء اللي
     ما موجودة واحذف منه الأشياء الموجودة — لكن التفاصيل: الانحناءات، الألوان، أشكال
     الجداول، الأشكال بشكلٍ عام انسخها حرفياً».

     فالأنماطُ أدناه منسوخةٌ **حرفاً** من نموذجك «GMT · الهوية البصرية 2.0 · معاينة»:
     ‹:root› ‹.side› ‹.ni› ‹.tb› ‹.hero› ‹.card› ‹.tool› ‹.ico› ‹.pill› ‹.flow› ‹.dots›
     ‹.bar› ‹.btn› ‹.chip› ‹.note› ‹.logo-b› … بالقيم نفسها. الإضافاتُ تحت «إضافاتنا».
     المحتوى محتوانا: الأدوات من gmt-tools.js، والأرقام حقيقيّة من gmt-home.js،
     وخطوةُ «انتظار موافقة الإدارة» حُذفت لأنّ قرارك «أي حدا بيعمل حساب».
     ═══════════════════════════════════════════════════════════════════════════ -->
<style>
/* ═══ منسوخٌ حرفياً من النموذج ═══ */
:root{--red:#D5001C;--rd:#A80016;--rs:#fff1f2;--bg:#f7f8fa;--sf:#fff;--gl:rgba(255,255,255,.78);--ln:rgba(15,18,25,.08);--tx:#0f1219;--mu:#5b6472;--ok:#15803d;--wn:#b45309;--r1:22px;--r2:14px;--r3:10px;--sh:0 1px 2px rgba(15,18,25,.05),0 10px 30px rgba(15,18,25,.06);--ease:cubic-bezier(.2,.7,.2,1);padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);box-sizing:border-box}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(900px 400px at 100% -10%,#ffe3e6 0,transparent 60%),radial-gradient(700px 400px at -10% 110%,#e8eef9 0,transparent 60%),var(--bg);color:var(--tx);font:15px/1.7 'Segoe UI',Tahoma,system-ui,-apple-system,sans-serif;min-height:100%;background-repeat:no-repeat;min-height:100vh}/* (٧ ي-٤) كان التدرّج الوردي يتكرّر أشرطةً عرضيّة حين الصفحة أقصر من الشاشة */
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:232px 1fr;min-height:720px}.phone .app{grid-template-columns:1fr}.phone .side{display:none}
.side{background:var(--gl);backdrop-filter:blur(14px);border-inline-end:1px solid var(--ln);padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px}.brand img{width:40px;height:40px;object-fit:contain;border-radius:12px;background:#fff;border:1px solid var(--ln);padding:3px}.brand b{display:block;line-height:1.2}.brand small{color:var(--mu);font-size:11px}
.side h6{margin:14px 10px 4px;font-size:11px;color:var(--mu);letter-spacing:.3px}
.ni{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r3);border:0;background:none;color:var(--mu);width:100%;text-align:start;transition:.2s var(--ease);position:relative}
.ni:hover{background:rgba(15,18,25,.04);color:var(--tx)}.ni.on{background:var(--rs);color:var(--red);font-weight:700}.ni.on:before{content:"";position:absolute;inset-inline-start:-12px;top:8px;bottom:8px;width:4px;border-radius:4px;background:var(--red)}
.col{min-width:0;display:flex;flex-direction:column}
.tb{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--ln);background:var(--gl);backdrop-filter:blur(14px);position:sticky;top:0;z-index:5}
.tb h1{margin:0;font-size:18px}.sp{flex:1}.row{display:flex;align-items:center;gap:10px}.wr{flex-wrap:wrap}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);display:grid;place-items:center;transition:.2s}.ib:hover{border-color:var(--red);color:var(--red)}
.srch{display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:0 12px;min-width:220px}.srch input{border:0;outline:0;background:none;padding:8px 0;width:100%}
.phone .srch.dk,.phone .rolechip{display:none}
.rolechip{font-size:12px;font-weight:700;padding:3px 11px;border-radius:99px;background:var(--rs);color:var(--red)}.rolechip.st{background:#eef2f7;color:#475569}
.main{padding:20px;animation:in .4s var(--ease) both;flex:1}.phone .main{padding:14px 14px 96px}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.pill{display:none;position:sticky;bottom:14px;margin:0 14px;background:#0f1219;border-radius:99px;padding:6px;justify-content:space-around;box-shadow:0 14px 34px rgba(15,18,25,.35);z-index:6}
.phone .pill{display:flex}.pill .ni{flex-direction:column;gap:0;width:auto;padding:6px 14px;font-size:10px;border-radius:99px;color:#9aa1ad}.pill .ni.on{background:var(--red);color:#fff}.pill .ni.on:before{display:none}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r1);padding:16px;box-shadow:var(--sh)}
.g{display:grid;gap:14px}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
.phone .c2{grid-template-columns:1fr}.phone .c3,.phone .c4{grid-template-columns:1fr 1fr}.phone .c3.k1{grid-template-columns:1fr}
.mu{color:var(--mu);font-size:13px}.num{font-size:26px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}.sm{font-size:12px}
.hero{border-radius:var(--r1);padding:20px;color:#fff;background:linear-gradient(135deg,#0f172a,#1e293b);position:relative;overflow:hidden;box-shadow:var(--sh)}
.hero:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;inset-inline-end:-70px;top:-110px;background:radial-gradient(circle,rgba(213,0,28,.55),transparent 68%)}.hero>*{position:relative}
.hero .mu{color:#b9c0cc}
.btn{border:1px solid var(--ln);background:var(--sf);border-radius:var(--r3);padding:8px 14px;font-weight:600;transition:.2s var(--ease);display:inline-flex;align-items:center;gap:7px}
.btn:hover:not(:disabled){border-color:var(--red);color:var(--red);transform:translateY(-1px)}.btn.p{background:var(--red);color:#fff;border-color:var(--red)}.btn.p:hover:not(:disabled){background:var(--rd);color:#fff}.btn.dk{background:#0f1219;color:#fff;border-color:#0f1219}
.btn:disabled{opacity:.38;cursor:not-allowed;filter:grayscale(1)}.btn.sm{padding:5px 10px;font-size:13px}
.chip{display:inline-flex;align-items:center;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#eef0f3;color:#475569;border:0}.chip.ok{background:#e6f6ec;color:var(--ok)}.chip.wn{background:#fef3e2;color:var(--wn)}.chip.rd{background:var(--rs);color:var(--red)}
.tool{display:flex;flex-direction:column;gap:5px;padding:14px;border:1px solid var(--ln);border-radius:var(--r2);background:var(--sf);text-align:start;transition:.25s var(--ease);position:relative}.tool:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:rgba(213,0,28,.35)}
.ico{width:40px;height:40px;border-radius:13px;background:var(--rs);color:var(--red);display:grid;place-items:center}
input.in{width:100%;border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:9px 12px;outline:0;transition:.2s}input.in:focus{border-color:var(--red);box-shadow:0 0 0 4px var(--rs)}
.bar{height:7px;border-radius:9px;background:#eceef2;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),#ff5a6e);border-radius:9px;transition:width 1.1s var(--ease)}
.toast{position:fixed;bottom:22px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:#0f1219;color:#fff;padding:10px 18px;border-radius:99px;opacity:0;transform:translateY(14px);transition:.3s;pointer-events:none;z-index:9100}.toast.on{opacity:1;transform:none}
.flow{min-height:720px;display:grid;place-items:center;padding:24px;background:radial-gradient(500px 300px at 80% 0,#ffd9de,transparent 70%),linear-gradient(160deg,#fff,#f1f4f9)}.fc{width:100%;max-width:480px;text-align:center;animation:in .5s var(--ease)}.fc .card{text-align:start}
.dots{display:flex;gap:6px;justify-content:center;margin:0 0 18px}.dots i{width:22px;height:5px;border-radius:5px;background:#dfe3e9}.dots i.on{background:var(--red)}
.logo-b{width:96px;height:96px;margin:0 auto 14px;border-radius:28px;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;animation:pop .8s var(--ease)}.logo-b img{width:70px}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.note{padding:10px 14px;border-radius:var(--r2);background:var(--rs);color:var(--rd);font-size:13px}
details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ═══ إضافاتنا — ما لم يكن في النموذج ═══ */
.dev{min-height:100vh}
.app{min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;scrollbar-width:thin}
.flow{min-height:100vh}
svg.gmt-i{flex:none}
a.ni,a.tool{text-decoration:none;color:inherit}
a.ni{color:var(--mu)}
.ni .lk,.tool .lk{margin-inline-start:auto;color:#9aa1ad;display:grid}
.tool .lk{position:absolute;top:12px;inset-inline-end:12px}
.tool.locked .ico{background:#f1f3f6;color:#9aa1ad}
.tool b{font-size:15px}
.tool .x{display:none;position:absolute;top:8px;inset-inline-end:8px;width:28px;height:28px;border-radius:9px;background:#fff;border:1px solid var(--ln);place-items:center;color:var(--red);box-shadow:var(--sh);padding:0}
.editing .tool .x{display:grid}
.kpi .y{font-size:12px;color:var(--mu)}.kpi .y .up{color:var(--ok);font-weight:700}.kpi .y .dn{color:var(--red);font-weight:700}
.sk{border-radius:10px;background:linear-gradient(90deg,#eef0f3 25%,#f6f7f9 50%,#eef0f3 75%);background-size:200% 100%;animation:skl 1.2s linear infinite}@keyframes skl{to{background-position:-200% 0}}
.warn{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:11px 14px;border-radius:var(--r2);background:#fffbeb;border:1px solid #fde68a;color:#78350f;font-size:13.5px}
.allp summary{display:flex;align-items:center;gap:10px}
.allp .gt{margin:16px 2px 8px;font-size:12px;color:var(--mu);font-weight:700;display:flex;align-items:center;gap:8px}
.lr{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:12px;text-decoration:none;color:inherit;transition:.2s}
.lr:hover{background:#fafbfc}.lr .ico{width:34px;height:34px;border-radius:11px}.lr b{display:block;font-size:14px;line-height:1.35}.lr small{display:block;color:var(--mu);font-size:12px}
.lr.locked .ico{background:#f1f3f6;color:#9aa1ad}.lr .lk{margin-inline-start:auto;color:#9aa1ad;display:grid}
.lr-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 10px}.phone .lr-grid{grid-template-columns:1fr}
#gmt-refresh-bar{display:flex!important;align-items:center;gap:8px;position:static!important;inset:auto!important;transform:none!important;background:none!important;box-shadow:none!important;border:0!important;padding:0!important;margin:0!important;width:auto!important;height:auto!important}
#gmt-refresh-bar>*{position:relative!important;inset:auto!important}
#gmt-refresh-bar>button{width:38px!important;height:38px!important;min-width:38px!important;border-radius:12px!important;border:1px solid var(--ln)!important;background:var(--sf)!important;display:grid!important;place-items:center!important;padding:0!important;color:var(--tx)!important;box-shadow:none!important}
#gmt-refresh-bar>button:hover{border-color:var(--red)!important;color:var(--red)!important}
#gmt-refresh-bar .gr-txt{display:none!important}
.role-guest #gmt-wn-fab,.role-guest #gmt-notify-btn,.role-guest #gmt-refresh-btn,.role-guest #gmt-tools-btn,.role-guest #gmt-sound-btn,.role-guest #gmt-refresh-bar{display:none!important}  /* (٧ ي) شاشة الدخول: لا أزرار أدوات شاردة أسفلها */
.av{width:34px;height:34px;border-radius:11px;object-fit:cover;background:#0f1219;color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.me{margin-top:auto;border:1px solid var(--ln);background:var(--sf);border-radius:var(--r2);padding:10px}
.me .row b{display:block;font-size:13px;line-height:1.3}.me small{display:block;color:var(--mu);font-size:11px}
/* الطبقات: بحث · قائمة · ورقة */
.ov{position:fixed;inset:0;background:rgba(15,18,25,.45);backdrop-filter:blur(4px);z-index:9000;display:grid;place-items:center;padding:16px;animation:fd .2s}@keyframes fd{from{opacity:0}}
.md{background:var(--sf);border-radius:26px;padding:20px;max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pop .3s var(--ease)}
.phone .ov{place-items:end stretch;padding:0}.phone .md{border-radius:26px 26px 0 0;max-width:none;max-height:86vh;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.res .lr.on{background:var(--rs)}
.menu{position:fixed;z-index:9002;min-width:220px;padding:6px;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r2);box-shadow:0 14px 38px rgba(2,6,23,.16);animation:fd .12s}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:9px;font-size:13.5px;font-weight:600;text-align:start;color:#334155}
.mi:hover,.mi:focus-visible{background:#fafbfc;color:var(--tx)}
.phone .mi{padding:13px 10px;font-size:15px}
.fbtm{margin-top:18px;font-size:12.5px;color:#4b5563}
.fbtm a,.fbtm button{color:#A80016;font-weight:700;text-decoration:none;border:0;background:none;padding:2px 4px}/* (٧ ي-٤) تباين ٤٫٢ ⇐ ٦ فوق التدرّج الورديّ */
.fc label{display:block;font-size:12.5px;color:var(--mu);margin:10px 0 4px}
.fc .err{min-height:1.2em;margin-top:10px;color:var(--red);font-size:13px;font-weight:700}
.pv{margin-top:12px;padding:12px 14px;border-radius:var(--r2);border:1px solid var(--ln);background:#fafbfc;text-align:start;font-size:13px}
.ph-btn{display:inline-flex;align-items:center;gap:8px;margin-top:10px}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ══ (٧ ي) شاشة الدخول أوّلاً — طلبك: «شاشة تسجيل الدخول تكون أوّل ما يدخل الشخص على الرابط الأساسي» ══
   رموز النموذج نفسها (.flow .fc .card .logo-b .btn.p input.in) — والإضافة: مبدّلُ «دخول ⇄ حساب جديد»،
   وأزرارُ الفروع، ولوحةُ الهويّة جانب النموذج على الحاسوب (الهاتف: عمودٌ واحد بلا لوحة). */
.auth-w{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);max-width:980px;width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:28px;box-shadow:var(--sh);overflow:hidden;animation:in .5s var(--ease)}
.auth-w .fc{max-width:none;padding:30px 34px 24px;animation:none}
.auth-b{position:relative;overflow:hidden;color:#fff;background:linear-gradient(150deg,#0f172a,#1e293b);padding:34px;display:flex;flex-direction:column;justify-content:space-between;gap:22px;min-height:560px}
.auth-b:before{content:"";position:absolute;width:380px;height:380px;border-radius:50%;inset-inline-end:-120px;top:-150px;background:radial-gradient(circle,rgba(213,0,28,.55),transparent 68%)}
.auth-b>*{position:relative}
.auth-b .lg{width:64px;height:64px;border-radius:20px;background:#fff;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}.auth-b .lg img{width:48px}
.auth-b h2{margin:16px 0 6px;font-size:26px;line-height:1.35}
.auth-b p{margin:0;color:#b9c0cc;font-size:14px;line-height:1.9}
.auth-b ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.auth-b li{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.auth-b li i{width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-style:normal;flex:none;color:#fff}
.auth-b small{color:#8b93a1;font-size:12px;line-height:1.8}
.phone .auth-w{display:block;max-width:480px;background:none;border:0;box-shadow:none;border-radius:0;animation:none}
.phone .auth-w .fc{padding:0;animation:in .5s var(--ease)}
.phone .auth-b{display:none}
.auth-hd{display:flex;align-items:center;gap:12px;margin-bottom:4px;text-align:start}
.fc label.ph-btn{display:inline-flex;margin:10px 0 0}.auth-hd .logo-b{width:56px;height:56px;margin:0;border-radius:18px}.auth-hd .logo-b img{width:42px}
.auth-hd h1{margin:0;font-size:22px;line-height:1.3}.auth-hd .mu{margin:0;color:#4b5563}
.phone .auth-hd{flex-direction:column;text-align:center;gap:6px}.phone .auth-hd .logo-b{width:84px;height:84px;border-radius:26px}.phone .auth-hd .logo-b img{width:62px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:#eef0f3;margin:16px 0 12px}
.seg button{border:0;background:none;border-radius:11px;padding:9px 6px;font-weight:700;color:var(--mu);transition:.2s var(--ease)}
.seg button.on{background:var(--sf);color:var(--red);box-shadow:0 1px 2px rgba(15,18,25,.08),0 4px 12px rgba(15,18,25,.06)}
.brs{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.brs button{border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:9px 8px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px;transition:.2s var(--ease)}
.brs button:hover{border-color:rgba(213,0,28,.35)}.brs button.on{border-color:var(--red);background:var(--rs);color:var(--red)}
.auth .adm{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;padding:10px;border-radius:12px;border:1px dashed var(--ln);background:none;color:var(--tx);font-weight:700}
.auth .adm:hover{border-color:var(--red);color:var(--red)}
.auth .hint{margin-top:10px;font-size:12px;color:var(--mu);text-align:center}
/* ══ (١٨ ت١ · وثيقة الطلبات ٩) حسابات هذا الجهاز + «تذكّر هذا الجهاز» ══ */
.fc label.remb{display:flex;align-items:flex-start;gap:9px;margin:12px 0 0;font-size:13.5px;font-weight:700;color:var(--tx);cursor:pointer;line-height:1.5}
.remb input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--red);flex:none}
.remb small{display:block;font-weight:600;font-size:11.5px;color:var(--mu)}
.accts-h{display:flex;align-items:center;gap:8px;margin:14px 0 6px;font-size:12.5px;font-weight:800;color:var(--mu)}
.accts{display:grid;gap:8px}
.acct{display:flex;align-items:center;gap:6px;border:1px solid var(--ln);border-radius:14px;background:var(--sf);padding:4px;min-width:0}
.acct.on{border-color:rgba(213,0,28,.45);background:var(--rs)}
.acct-go{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;padding:6px 8px;text-align:start;border-radius:11px;color:var(--tx)}
.acct-go:hover:not(:disabled){background:#fafbfc}.acct-go:disabled{cursor:default;opacity:1}
