<!-- ══ (TASK-B0509 · المالك seq 825) «الادوات يلي طالعتهن من ادمن نقاط البيع اعرضهم على الرئيسية او جمعهن بصفحة وحدة المتشابهات».
     كانت ١٢ أداةً منفصلة في «كل صفحات النظام» وكلّها تفتح الصفحة نفسها (admin_pos.html) بتبويبٍ مختلف.
     هنا تجتمع في صفحةٍ واحدة بأربع مجموعات حسب ما يفكّر فيه المستخدم — والروابط نفسها لم تتغيّر ولم تُحذف أيّ وظيفة:
     كلُّ بطاقةٍ تفتح التبويب نفسه في أدمن نقاط البيع، والأسماء والأوصاف تُقرأ من سجلّ الأدوات (gmt-tools.js) فلا نسختان. ══ -->
<style>
:root{--red:#D5001C;--rd:#A80016;--rs:#fff1f2;--bg:#f6f7f9;--sf:#fff;--ln:rgba(15,18,25,.09);--tx:#0f1219;--mu:#5b6472}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 Cairo,'Segoe UI',Tahoma,system-ui,-apple-system,sans-serif;min-height:100vh}
.w{max-width:1040px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.top h1{margin:0;font-size:22px;line-height:1.3}
.lead{margin:0 0 18px;color:var(--mu);font-size:13.5px}
.main-l{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--ln);border-radius:16px;background:var(--sf);text-decoration:none;color:inherit;margin-bottom:22px}
.main-l:hover{border-color:rgba(213,0,28,.4)}
.main-l .ico{background:var(--red);color:#fff}
.main-l b{display:block;font-size:16px}.main-l small{display:block;color:var(--mu);font-size:12.5px}
.main-l .go{margin-inline-start:auto;color:var(--red);font-weight:800;font-size:13px;white-space:nowrap}
.sec{margin-bottom:22px}
.sec h2{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:15px;color:var(--tx)}
.sec h2 .c{font-size:12px;font-weight:700;color:var(--mu);background:#eceef2;border-radius:99px;padding:1px 9px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:860px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
.t{display:flex;align-items:flex-start;gap:11px;padding:13px 14px;border:1px solid var(--ln);border-radius:14px;background:var(--sf);text-decoration:none;color:inherit;min-width:0;transition:border-color .2s}
.t:hover,.t:focus-visible{border-color:rgba(213,0,28,.4)}
.t b{display:block;font-size:14.5px;line-height:1.4}
.t small{display:block;color:var(--mu);font-size:12px;line-height:1.6}
.ico{flex:none;width:38px;height:38px;border-radius:12px;background:var(--rs);color:var(--red);display:grid;place-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:8px 12px;font:inherit;font-weight:700;font-size:13px;color:var(--tx);text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--red);color:var(--red)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
</style>
</head>
<body>
<div class="w">
  <div class="top"><h1>الإدارة</h1></div><!-- زرّ «الرئيسية» في الشريط العلويّ الموحَّد — لا نكرّره هنا -->
  <p class="lead">كل أدوات أدمن نقاط البيع في مكانٍ واحد، مجمّعةً حسب ما تريد أن تفعل.</p>
  <a class="main-l" id="main-l" href="admin_pos.html" data-tool="admin_pos.html"><span class="ico" data-ic="shield"></span><span style="min-width:0"><b>أدمن نقاط البيع</b><small>اللوحة الكاملة: الموافقات · الصندوق · العمولات · المحاسبة</small></span><span class="go">افتح ←</span></a>
  <div id="secs"></div>
</div>
<script>
(function () {
  'use strict';
  /* المجموعات الأربع — مرتّبةٌ بما يفكّر فيه المستخدم لا بترتيب التبويبات */
  var SECS = [
    { t: 'الناس', ic: 'users', f: ['admin_pos.html?tab=users', 'admin_pos.html?tab=customers'] },
    { t: 'البيع والتسعير', ic: 'tag', f: ['admin_pos.html?tab=invoices', 'admin_pos.html?tab=adminInvoice', 'admin_pos.html?tab=offers', 'admin_pos.html?tab=coupons', 'العروض_والتسعير.html'] },
    { t: 'المال', ic: 'coins', f: ['admin_pos.html?tab=transfers', 'admin_pos.html?tab=closings', 'admin_pos.html?tab=debts', 'admin_pos.html?tab=expenses', 'admin_pos.html?tab=accounting'] },
    { t: 'المخزون والأصول', ic: 'box', f: ['admin_pos.html?tab=stocktransfers', 'admin_pos.html?tab=assets'] }
  ];
  var T = window.GMTTools;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function ic(n, z) { try { if (window.GMTIcon && GMTIcon.has(n)) return GMTIcon.svg(n, z || 19); } catch (_) {} return ''; }
  function draw() {
    var host = document.getElementById('secs'); if (!host || !T) return;
    host.innerHTML = SECS.map(function (s) {
      /* (TASK-B0512) المستخدم العاديّ يرى ما مُنحه فقط */
      var items = s.f.map(function (f) { return T.find(f); }).filter(function (x) { return x && (!window.GMTPerm || GMTPerm.can(x.f)); });
      if (!items.length) return '';
      return '<section class="sec"><h2>' + ic(s.ic, 17) + esc(s.t) + ' <span class="c">' + items.length + '</span></h2><div class="grid">' +
        items.map(function (x) {
          return '<a class="t" href="' + esc(x.f) + '" data-tool="' + esc(x.f) + '"><span class="ico">' + ic(x.ic, 18) + '</span><span style="min-width:0"><b>' + esc(x.t) + '</b><small>' + esc(x.d) + '</small></span></a>';
        }).join('') + '</div></section>';
    }).join('');
    try { if (window.GMTPerm && GMTPerm.tabGrants && GMTPerm.tabGrants('admin_pos.html')) document.getElementById('main-l').hidden = true; } catch (_) {}   /* منحٌ جزئيّ ⇒ لا لوحة كاملة */
    [].forEach.call(document.querySelectorAll('[data-ic]'), function (el) { el.innerHTML = ic(el.getAttribute('data-ic'), 20); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', draw); else draw();
})();
</script>

</body>
</html>
