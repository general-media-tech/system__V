// INIT
// ══════════════════════════════════════════════
async function initStore(){
    _introStart=Date.now();
    createModals(); updateCartBadge(); setupEventHandlers(); initNotifications();

    const cached=_cache.get('store');
    if(cached){ _applyRecord(cached); renderAll(); _contentReady=true; _tryCloseIntro(); if(!window._deepLinkApplied) setTimeout(_applyDeepLink, window.__gmtDirect?0:500); _refreshBackground(); return; }

    try {
        const rec=await fetchStoreRecord();
        if(rec) _applyRecord(rec);
        else _applyMock();
    } catch { _applyMock(); }

    renderAll();
    _contentReady=true; _tryCloseIntro();
    // Apply deep link after render
    setTimeout(_applyDeepLink, 500);
}

function _applyRecord(rec){
    store.categories   = Array.isArray(rec.categories)   ? rec.categories   : [];
    store.products     = Array.isArray(rec.products)      ? rec.products     : [];
    store.banners      = Array.isArray(rec.banners)       ? rec.banners      : [];
    try { if (!rec.__fromCache && store.products.length) localStorage.setItem(STORE_LAST_GOOD, JSON.stringify({ at: Date.now(), rec: rec })); } catch (_) {}
    store.offers       = Array.isArray(rec.offers)        ? rec.offers       : [];
    store.branches     = Array.isArray(rec.branches)      ? rec.branches     : [];
    // Check for new offer notification
    _checkNewOfferNotification(store.offers);
}

function _checkNewOfferNotification(offers){
    if(!offers.length) return;
    const lastSeen = parseInt(localStorage.getItem('gmt_offers_last_seen')||'0');
    const newOffers = offers.filter(o => {
        const ts = o.created_at ? new Date(o.created_at).getTime() : 0;
        return ts > lastSeen;
    });
    if(newOffers.length && Notification.permission==='granted'){
        newOffers.forEach(o=>{
            sendLocalNotification('عرض جديد! 🎉', o.title||'تحقق من العروض الجديدة');
        });
        localStorage.setItem('gmt_offers_last_seen', Date.now().toString());
    }
}

function _applyMock(){
    /* القاعدة لا تجيب ⇒ آخر نسخةٍ حقيقيّة (حتى ١٤ يوماً) مع تنبيه — وإلّا رسالة «غير متاح الآن» */
    let last = null;
    try { last = JSON.parse(localStorage.getItem(STORE_LAST_GOOD) || 'null'); } catch (_) {}
    if (last && last.rec && Date.now() - last.at < 14 * 864e5) {
        const rec = Object.assign({}, last.rec, { __fromCache: true });
        _applyRecord(rec);
        _storeNotice('📶 نعرض آخر نسخةٍ محفوظة من المتجر (' + new Date(last.at).toLocaleDateString('ar-SY') + ') — الأسعار والتوفّر قد تتغيّر. سنحدّثها تلقائياً.');
        return;
    }
    store.categories = []; store.products = []; store.banners = [];
    _storeNotice('المتجر يتحدّث الآن — المنتجات غير متاحة مؤقتاً. حاول بعد قليل، أو راسلنا وسنخدمك مباشرة.', true);
}
function _storeNotice(msg, retry){
    try {
        let el = document.getElementById('gmt-store-notice');
        if (!el) { el = document.createElement('div'); el.id = 'gmt-store-notice';
            el.style.cssText = 'margin:12px;padding:12px 14px;border-radius:14px;background:#fffbeb;border:1px solid #fde68a;color:#78350f;font-weight:700;font-size:13.5px;line-height:1.7;display:flex;gap:10px;align-items:center;flex-wrap:wrap';
            const host = document.querySelector('main') || document.body; host.insertBefore(el, host.firstChild); }
        el.innerHTML = '<span style="flex:1;min-width:200px">' + msg + '</span>' + (retry ? '<button onclick="location.reload()" style="border:0;background:#D5001C;color:#fff;border-radius:10px;padding:7px 14px;font:inherit;font-weight:800;cursor:pointer">إعادة المحاولة</button>' : '');
    } catch (_) {}
}

function renderAll(){
    renderMainBanner(store.banners);
    renderCategories();
    renderProducts();
    // Offers are NOT shown on homepage — only via the Offers button
    /* 🔧 (2026-08-26) روابط المنتج المباشرة كانت **ميتة**: زر «مشاركة المنتج» يولّد
       store.html#product=… لكن `_applyDeepLink` (التي تقرأ الرابط عند الفتح) لم تُنادَ أبداً
       ⇒ الزبون يفتح الرابط فيصل الصفحة الرئيسية لا المنتج. تُنادى مرّة واحدة بعد أول رسم
       (renderAll يتكرّر مع التحديث بالخلفية — لا نعيد فتح المنتج في كل مرّة). */
    if (!window._deepLinkApplied && store.products && store.products.length) {
        window._deepLinkApplied = true;
        try { _applyDeepLink(); } catch (e) { console.warn('[GMT] تعذّر فتح رابط المنتج:', e); }
    }
}
// رابط منتج يُفتح والصفحة مفتوحة أصلاً (تغيير الـ#)
window.addEventListener('hashchange', function () { try { _applyDeepLink(); } catch (_) {} });

async function _refreshBackground(){
    try {
        _cache.del('store');
        const rec=await fetchStoreRecord(); if(!rec)return;
        const newCats=Array.isArray(rec.categories)?rec.categories:store.categories;
        const newProds=Array.isArray(rec.products)?rec.products:store.products;
        if(JSON.stringify(newProds)!==JSON.stringify(store.products)||JSON.stringify(newCats)!==JSON.stringify(store.categories)){
            _applyRecord(rec); renderAll();
        }
    } catch {}
}

/* ══════════════════════════════════════════════════════════════════════
   🔴 (2026-10-03 · بلاغ المالك) «المنتجات المربوطة من الجسر ما عم لاقيها
   في المتجر». النصف الثاني من الجذر — غير القسم المفقود:

   المتجر يخزّن سجلّ المتجر في `localStorage` بعمرٍ خمس دقائق. الجسر يكتب
   المنتج في القاعدة فوراً، لكن المتجر — إن كان مفتوحاً أو أُعيد فتحه خلال
   الخمس دقائق — يقرأ **النسخة المحفوظة** فلا يرى المنتج الجديد. فالمالك
   يرى الربط «ناجحاً» في الجسر و«فاشلاً» في المتجر، والسببُ كاشٌ لا ربط.

   إصلاحان:
   ١) الجسر والمتجر على **نفس الأصل** (نفس النطاق) ⇒ الجسر يمسح الكاش
      بنفسه بعد كل كتابةٍ ناجحة (انظر `saveStoreProducts` في bridge.html).
   ٢) وهنا: عودة التبويب إلى الواجهة تُعيد السؤال من القاعدة (بخانقٍ
      ١٥ ثانية حتى لا نُثقل)، فما كُتب من جهازٍ آخر يظهر بمجرّد العودة.
   ══════════════════════════════════════════════════════════════════════ */
var _lastFreshCheck = 0;
function _recheckIfStale(){
    if (document.visibilityState === 'hidden') return;
    var now = Date.now();
    if (now - _lastFreshCheck < 15000) return;   // خانقٌ — لا نسأل أكثر من مرّةٍ كل ١٥ث
    _lastFreshCheck = now;
    if (typeof _refreshBackground === 'function') _refreshBackground();
}
document.addEventListener('visibilitychange', _recheckIfStale);
window.addEventListener('focus', _recheckIfStale);

document.addEventListener('DOMContentLoaded', initStore);
