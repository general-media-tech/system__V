   ?direct=1 (أزرار «عرض في المتجر» في الجرد ونقطة البيع — GMTUtil.storeLink) مع #product= ⇒ لا انترو، والمنتج يُفتح فور وصول الكتالوج. */
(function () {
  if (!/[?&]direct=1/.test(location.search) || !/^#product=/.test(location.hash)) return;
  window.__gmtDirect = true;
  var css = document.createElement('style'); css.textContent = '#intro-screen{display:none!important}'; document.head.appendChild(css);
  document.addEventListener('DOMContentLoaded', function () { var s = document.getElementById('intro-screen'); if (s) s.remove(); });
})();
</script>
<script>
/* (2026-10-06 ش) البند ٨٨ وطلبك في وثيقة التصميم: «في المعاينة ما في داعي يفتح لنا انترو المتجر — فوراً يدخلنا
   على المتجر، كمستخدمٍ عادي، مع أزرار تعديل». ?preview=1 ⇒ لا انترو، وشريطٌ صغير للعودة إلى أدمن المتجر. */
(function () {
  if (!/[?&]preview=1/.test(location.search)) return;
  var css = document.createElement('style');
  css.textContent = '#intro-screen{display:none!important}';
  document.head.appendChild(css);
  /* (٨ ث) أقلام التعديل على كل منتج — لموظّفٍ مسجّل فقط (الزبون الذي يكتب ?preview=1 لا يرى شيئاً) */
  try { window.__gmtPreviewEdit = !!localStorage.getItem('gmt_session') || sessionStorage.getItem('gmt_admin_mode') === '1'; } catch (_) {}
  document.addEventListener('DOMContentLoaded', function () {
    var s = document.getElementById('intro-screen'); if (s) s.remove();
    if (!window.__gmtPreviewEdit) return;
    /* (٨ ث) كان شريطاً عائماً أسفل الشاشة — قاعدتك: لا شيء عائم. صار سطراً ثابتاً أعلى الصفحة. */
    var bar = document.createElement('div');
    bar.style.cssText = 'display:flex;gap:8px;align-items:center;justify-content:space-between;background:#0f1219;color:#fff;' +
      'padding:8px 14px;font:700 13px/1.4 Cairo,Segoe UI,Tahoma,sans-serif;direction:rtl';
    bar.innerHTML = '<span>معاينة كزبون — القلم على كل منتج يفتح تعديله</span><a href="admin_store.html" style="background:#D5001C;color:#fff;text-decoration:none;border-radius:99px;padding:6px 12px;white-space:nowrap">أدمن المتجر</a>';
    document.body.insertBefore(bar, document.body.firstChild);
  });
})();
</script>

/* ═══════════════════════════════════════════════════════════════════════════
   🎟️ خصم الكوبون — قرار المالك ق١٦ (2026-10-03): **لا يُجمعان**
   (الكوبون لا يُجمع مع سعر العرض)

   وكان الخصم يُحسَب على **كل** المجموع بلا تمييز، فمنتجٌ سعرُه مخفَّضٌ أصلاً
   يأخذ خصم الكوبون فوق تخفيضه ⇒ خصمٌ مزدوجٌ على حساب الهامش، والمالك لا يراه
   إلّا في الأرباح.

   و«لا يُجمعان» نُفِّذت على مستوى **البند** لا السلّة كلّها:
     · بندٌ بسعر عرضٍ (له `old_price` أعلى من سعره) ⇒ لا كوبون عليه.
     · بقيّة البنود ⇒ الكوبون يعمل عليها كما كان.
   ولماذا لا نرفض الكوبون كلّه إن وُجد عرضٌ واحد؟ لأنّ الزبون يشتري عرضاً
   ومنتجاً عاديّاً معاً، فإلغاءُ كوبونه بسبب بندٍ واحد عقوبةٌ لا قاعدة. ونصُّ
   القرار «لا يُجمعان» يمنع **الجمع على الشيء نفسه** لا وجودَهما في سلّةٍ واحدة.

   وإن كانت السلّة كلّها عروضاً فالخصم صفرٌ، **ويُقال للزبون السبب** لا أن يرى
   كوبوناً مقبولاً بخصمٍ صفر فيحسبها عطلاً.
   ═══════════════════════════════════════════════════════════════════════════ */

/* هل هذا البند بسعر عرضٍ أصلاً؟ */
function storeItemOnOffer(it) {
  if (!it) return false;
  const p  = Number(it.price);
  const op = Number(it.old_price != null ? it.old_price : it.original_price);
  if (isFinite(op) && isFinite(p) && op > p + 0.001) return true;
  return !!(it.offer_id || it.offer_type || it._fromOffer);
}

/* المجموع القابل للكوبون = البنود غير المخفَّضة */
function storeCouponableBase() {
  const cart = (typeof store !== 'undefined' && Array.isArray(store.cart)) ? store.cart : [];
  return cart.reduce((sum, it) => {
    if (storeItemOnOffer(it)) return sum;
    return sum + (Number(it.price) || 0) * (Number(it.qty) || 1);
  }, 0);
}

function storeCouponDiscount(subtotal) {
  if (!_storeCoupon) return 0;
  /* الأساس هو ما لا عرضَ عليه — لا المجموع كلّه (ق١٦) */
  const base = Math.min(storeCouponableBase(), Number(subtotal) || 0);
  if (base <= 0) return 0;
  let disc = _storeCoupon.discount_type==='percent'
    ? base*(Number(_storeCoupon.discount_value)/100) : Number(_storeCoupon.discount_value);
  if (_storeCoupon.max_discount && disc>Number(_storeCoupon.max_discount)) disc=Number(_storeCoupon.max_discount);
  return Math.min(disc, base);
}

/* سببٌ يُعرَض للزبون حين يكون الخصم صفراً مع كوبونٍ صالح */
function storeCouponNote() {
  if (!_storeCoupon) return '';
  const cart = (typeof store !== 'undefined' && Array.isArray(store.cart)) ? store.cart : [];
  if (!cart.length) return '';
  const offers = cart.filter(storeItemOnOffer).length;
  if (!offers) return '';
  if (offers === cart.length) return 'الكوبون لا يُجمع مع العروض — وكل منتجات سلّتك بسعر عرض.';
  return 'الكوبون لا يُجمع مع العروض — طُبِّق على المنتجات غير المعروضة فقط.';
}

/* ══ التقييمات — تكيّفٌ مع اسم عمود النصّ (تقرير الحارس ١٢ ت١: 42703 «column gmt_comments.text does not exist») ══

const _CMT_TXT = ['text', 'comment', 'content', 'message', 'body', 'review'];
const _CMT_LS = 'gmt_cmt_txtcol';
function _cmtMissingCol(err) { return /42703|PGRST204|does not exist|Could not find/i.test(((err && err.code) || '') + ' ' + ((err && err.message) || '')); }
function _cmtCols() {
    let saved = ''; try { saved = localStorage.getItem(_CMT_LS) || ''; } catch (_) {}
    return saved ? [saved].concat(_CMT_TXT.filter(c => c !== saved)) : _CMT_TXT.slice();
}
async function fetchComments() {
    const cached = _cache.get('comments');
    if (cached) return cached;
    try {
        let rows = null, used = '', lastErr = null;
        outer: for (const col of _cmtCols()) {
            for (const withRating of [true, false]) {
                const sel = ['id', 'name', col].concat(withRating ? ['rating'] : []).concat(['created_at']).join(',');
                const r = await _sb.from(CONFIG.TABLE_COMMENTS).select(sel).order('created_at', { ascending: false });
                if (!r.error) { rows = r.data || []; used = col; break outer; }
                lastErr = r.error;
                if (!_cmtMissingCol(r.error)) throw r.error;           // شبكة/صلاحيات — لا معنى لتجربة بقيّة الأسماء
            }
        }
        if (!rows) throw lastErr || new Error('no comments column');
        try { localStorage.setItem(_CMT_LS, used); } catch (_) {}
        if (used !== 'text') rows = rows.map(r => Object.assign({}, r, { text: r[used] }));
        _cache.set('comments', rows);
        return rows;
    } catch { return []; }
}
async function insertComment(data) {
    try {
        let lastErr = null;
        for (const col of _cmtCols()) {
            const row = Object.assign({}, data);
            if (col !== 'text' && 'text' in row) { row[col] = row.text; delete row.text; }
            const { error } = await _sb.from(CONFIG.TABLE_COMMENTS).insert([row]);
            if (!error) { try { localStorage.setItem(_CMT_LS, col); } catch (_) {} _cache.del('comments'); return true; }
            lastErr = error;
            if (!_cmtMissingCol(error)) break;                          // ليس «عموداً ناقصاً» — لا نغيّر الاسم
            /* أيُّ عمودٍ ناقص؟ إن كان عمود النصّ نفسه جرّبنا الاسم التالي؛ وإن كان rating/phone توقّفنا ليُسقطهما استدعاءُ التدرّج في الواجهة */
            const m = String(error.message || '').match(/'([^']+)' column|\.([a-z_]+) does not exist|column "?([a-z_]+)"?/i);
            const missing = m ? (m[1] || m[2] || m[3] || '') : '';
            if (missing && missing !== col) break;
        }
        return false;
    } catch { return false; }
}

        console.warn('[GMT] فشل حفظ الطلب في gmt_orders:', r.status, await r.text().catch(()=>''));
        return 'fail';
    } catch(e) { console.warn('[GMT] استثناء أثناء حفظ الطلب:', e); return 'fail'; }
}

async function sendTG(msg) {
    if(!CONFIG.TELEGRAM_BOT_TOKEN||CONFIG.TELEGRAM_BOT_TOKEN==='...') return false;
    try { const r=await fetch(`https://api.telegram.org/bot${CONFIG.TELEGRAM_BOT_TOKEN}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:CONFIG.TELEGRAM_CHAT_ID,text:msg,parse_mode:'HTML'})}); if(!r.ok) console.warn('[GMT] تعذّر إرسال إشعار تيليجرام:', r.status); return r.ok; }
    catch(e){ console.warn('[GMT] استثناء إشعار تيليجرام:', e); return false; }
}

// ══════════════════════════════════════════════
// [1] MAIN BANNER — single slider at the top
// ══════════════════════════════════════════════
let _bannerInterval=null, _curBanner=0;

function renderMainBanner(banners) {
    const slider = document.getElementById('main-banner-slider');
    const dots   = document.getElementById('main-banner-dots');
    if (!banners?.length) { document.getElementById('main-banner-section').style.display='none'; return; }
    slider.innerHTML = ''; dots.innerHTML = '';

    banners.forEach((b,i) => {
        const slide = document.createElement('div');
        slide.className = `banner-slide ${i===0?'active':''} w-full h-full absolute inset-0`;
        if (b.link) { slide.style.cursor='pointer'; slide.onclick=()=>window.open(b.link,'_blank'); }
        if (b.image) {
            const img = document.createElement('img');
            img.src = b.image; img.alt = b.title||'';
            img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
            slide.appendChild(img);
        }
        if (b.title) {
            const lbl = document.createElement('div');
            lbl.className = 'absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/50 to-transparent p-3';
            lbl.innerHTML = `<p class="text-white text-sm font-bold">${b.title}</p>`;
            slide.appendChild(lbl);
        }
        slider.appendChild(slide);

        const dot = document.createElement('div');
        dot.className = `h-2 rounded-full bg-gray-300 transition-all duration-300 cursor-pointer ${i===0?'dot-active':'w-2'}`;
        dot.onclick = e => { e.stopPropagation(); _goToBanner(i); };
        dots.appendChild(dot);
    });
    slider.appendChild(dots);
    if (banners.length > 1) {
        clearInterval(_bannerInterval);
        _bannerInterval = setInterval(() => _goToBanner((_curBanner+1) % banners.length), 4000);
    }
}

function _goToBanner(idx) {
    const slider = document.getElementById('main-banner-slider');
    const slides = slider.querySelectorAll('.banner-slide');
    const dotEls = document.getElementById('main-banner-dots').children;
    slides.forEach((s,i) => s.classList.toggle('active', i===idx));
    Array.from(dotEls).forEach((d,i) => { d.classList.toggle('dot-active',i===idx); d.classList.toggle('w-5',i===idx); d.classList.toggle('w-2',i!==idx); });
    _curBanner = idx;
}

// ══════════════════════════════════════════════
// [2] CATEGORIES
// ══════════════════════════════════════════════
function renderCategories() {
    const container = document.querySelector('[data-container="categories"]');
    const frag = document.createDocumentFragment();
    [...store.categories].sort((a,b)=>(a.order||0)-(b.order||0)).forEach(cat => {
        const el = document.createElement('div');
        el.className = 'min-w-[95px] h-[100px] bg-white rounded-[18px] flex flex-col items-center justify-center gap-2 flex-shrink-0 cursor-pointer hover:border-primary/30 transition-all fade-in-up';
        el.style.cssText = 'box-shadow:0 4px 16px rgba(0,0,0,0.08),0 1px 4px rgba(0,0,0,0.04);';
        const displayName = cat.short_name || cat.name;
        // Use object-fit:cover for category images (PNG) to fill card completely
        const icon = cat.image
            ? `<div style="width:100%;aspect-ratio:1/1;overflow:hidden;border-radius:10px 10px 10px 10px;background:#f5f5f5;flex-shrink:0;"><img src="${cat.image}" style="width:100%;height:100%;object-fit:cover;display:block;" alt="${displayName}"></div>`
            : `<div class="flex items-center justify-center" style="height:68px;"><i class="ph ${cat.icon||'ph-squares-four'} text-[32px] text-primary"></i></div>`;
        el.innerHTML = `${icon}<span class="text-[11px] font-medium text-center leading-tight px-1 pb-1 pt-1" style="display:block;width:100%;">${displayName}</span>`;
        // Adjust card style for image-based cards — NO overflow:hidden so name shows below image
        if(cat.image){ el.className='min-w-[95px] w-[95px] bg-white rounded-[14px] flex flex-col items-center flex-shrink-0 cursor-pointer hover:shadow-md transition-all fade-in-up'; el.style.cssText='box-shadow:0 4px 16px rgba(0,0,0,0.08),0 1px 4px rgba(0,0,0,0.04);overflow:visible;'; }
        el.onclick = () => {
            const s = document.querySelector(`[data-category-section="${cat.id}"]`);
            if (!s) return;
            // Use precise offset to avoid sticky-header and dynamic-height issues
            const headerH = document.querySelector('header')?.offsetHeight || 60;
            const rect = s.getBoundingClientRect();
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const targetY = rect.top + scrollTop - headerH - 8;
            window.scrollTo({ top: targetY, behavior: 'smooth' });
        };
        frag.appendChild(el);
    });
    container.innerHTML = ''; container.appendChild(frag);
}

// ══════════════════════════════════════════════
// [3] PRODUCTS — multi-category support
//     Each category section: title → section banner → products row
// ══════════════════════════════════════════════
function _getProductCategories(prod) {
    // Support both old category_id and new category_ids array
    if (Array.isArray(prod.category_ids) && prod.category_ids.length) return prod.category_ids;
    if (prod.category_id) return [prod.category_id];
    return [];
}

function renderProducts() {
    const container = document.querySelector('[data-container="products-area"]');
    const frag = document.createDocumentFragment();
    const _shown = new Set();            // ما رُسم فعلاً — لالتقاط ما لا قسم له

    [...store.categories].sort((a,b)=>(a.order||0)-(b.order||0)).forEach(cat => {
        // collect products for this category
        const prods = store.products
            .filter(p => _getProductCategories(p).includes(cat.id))
            .sort((a,b) => {
                // per-category order support
                const oa = (a.category_orders && a.category_orders[cat.id]) ?? (a.order||0);
                const ob = (b.category_orders && b.category_orders[cat.id]) ?? (b.order||0);
                return oa - ob;
            });
        if (!prods.length) return;

        const section = document.createElement('section');
        section.className = 'mt-6';
        section.dataset.categorySection = cat.id;

        // ── Section header ──
        const header = document.createElement('h3');
        header.className = 'font-medium text-[18px] px-4 mb-4';
        header.textContent = cat.name;
        section.appendChild(header);

        // ── [2] Section banner slider (per-category) ──
        const catBanners = Array.isArray(cat.banners) && cat.banners.length
            ? cat.banners
            : (cat.banner_image ? [{ image: cat.banner_image, link: cat.banner_link||'' }] : []);

        if (catBanners.length) {
            const bannerWrap = document.createElement('div');
            bannerWrap.className = 'cat-section-banner';
            bannerWrap.style.minHeight = '120px';

            catBanners.forEach((b, bi) => {
                const slide = document.createElement('div');
                slide.className = 'cat-banner-slide' + (bi===0?' active':'');
                if (b.link) { slide.style.cursor='pointer'; slide.onclick=()=>window.open(b.link,'_blank'); }
                const img = document.createElement('img');
                img.src = b.image; img.alt = '';
                slide.appendChild(img);
                bannerWrap.appendChild(slide);
            });

            if (catBanners.length > 1) {
                // dots
                const dotsWrap = document.createElement('div');
                dotsWrap.className = 'cat-banner-dots';
                catBanners.forEach((_,bi) => {
                    const dot = document.createElement('div');
                    dot.className = 'cat-banner-dot' + (bi===0?' active':'');
                    dot.onclick = () => _goToCatBanner(bannerWrap, bi);
                    dotsWrap.appendChild(dot);
                });
                bannerWrap.appendChild(dotsWrap);
                // auto-slide
                let _idx = 0;
                const _timer = setInterval(() => {
                    _idx = (_idx+1) % catBanners.length;
                    _goToCatBanner(bannerWrap, _idx);
                }, 4000);
                bannerWrap._timer = _timer;
            }
            section.appendChild(bannerWrap);
        }

        // ── Products row ──
        const row = document.createElement('div');
        row.className = 'flex overflow-x-auto hide-scrollbar gap-4 px-4 pb-6';

        prods.forEach(prod => {
            row.appendChild(_buildProductCard(prod));
        });

        section.appendChild(row);
        frag.appendChild(section);
        prods.forEach(function (x) { _shown.add(x.id); });
    });

    /* ══════════════════════════════════════════════════════════════════════
       🔴 (2026-10-03 · بلاغ المالك) «منتجات اللي عم نربطها من الجسر ما عم
       لاقيها في المتجر ولا في أدمن المتجر».

       الجذر: المتجر يرسم المنتجات **عبر الأقسام فقط** — يمرّ على كل قسم ويأخذ
       منتجاته. فمنتجٌ قسمُه غير موجود في `categories` (حُذف القسم، أو كتب
       الجسر معرّفاً لا يقابله قسم، أو بقي الحقل فارغاً) **لا يُرسَم إطلاقاً**:
       موجودٌ في القاعدة وغير موجودٍ على الشاشة، بلا رسالة ولا أثر.

       القاعدة التي نعتمدها: **لا منتج يختفي بصمت**. ما لم يجد قسماً يُعرَض في
       قسمٍ أخير ظاهر، فيراه المالك ويصلّح قسمه بدل أن يظنّ الربط فشل.
       ══════════════════════════════════════════════════════════════════════ */
    try {
        var orphans = (store.products || []).filter(function (p) { return p && !_shown.has(p.id); });
        if (orphans.length) {
            var os = document.createElement('section');
            os.className = 'mt-6';
            os.dataset.categorySection = '__orphans';
            var oh = document.createElement('h3');
            oh.className = 'font-medium text-[18px] px-4 mb-1';
            oh.textContent = 'منتجات بلا قسم';
            var on = document.createElement('p');
            on.className = 'text-[11px] text-gray-400 px-4 mb-3';
            on.textContent = 'هذه المنتجات ليس لها قسمٌ موجود — حدّد لها قسماً من أدمن المتجر لتظهر في مكانها.';
            var orow = document.createElement('div');
            orow.className = 'flex overflow-x-auto hide-scrollbar gap-4 px-4 pb-6';
            orphans.forEach(function (prod) { orow.appendChild(_buildProductCard(prod)); });
            os.appendChild(oh); os.appendChild(on); os.appendChild(orow);
            frag.appendChild(os);
            console.warn('[GMT] منتجات بلا قسمٍ موجود:', orphans.length, orphans.map(function (x) { return x.name; }));
        }
    } catch (e) { console.warn('[GMT] تعذّر عرض المنتجات بلا قسم:', e && e.message); }

    container.innerHTML = ''; container.appendChild(frag);
}

// ── Cat section banner slider helper ─────────────
function _goToCatBanner(wrap, idx) {
    const slides = wrap.querySelectorAll('.cat-banner-slide');
    const dots   = wrap.querySelectorAll('.cat-banner-dot');
    slides.forEach((s,i) => s.classList.toggle('active', i===idx));
    dots.forEach((d,i)   => d.classList.toggle('active', i===idx));
}

// ── Build one product card ─────────────────────
function _buildProductCard(prod) {
    const imgUrl = prod.images?.[0] || '';
    const displayName = prod.short_name || prod.name;
    const inCart = _isInCart(prod.id);

    const card = document.createElement('div');
    card.className = 'min-w-[160px] w-[160px] rounded-[20px] overflow-hidden flex flex-col flex-shrink-0 fade-in-up bg-white';
    card.style.cssText = 'cursor:pointer; box-shadow:0 8px 28px rgba(0,0,0,0.12),0 2px 6px rgba(0,0,0,0.07);';

    // image wrap
    const imgWrap = document.createElement('div');
    imgWrap.className = 'relative w-full overflow-hidden flex-shrink-0';
    imgWrap.style.height = '160px';
    imgWrap.style.background = '#f5f5f5';

    if (imgUrl) {
        const img = document.createElement('img');
        img.src = imgUrl;
        img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
        img.onerror = function(){ this.parentElement.innerHTML='<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center"><i class="ph ph-image" style="font-size:2.5rem;color:#d1d5db"></i></div>'; };
        imgWrap.appendChild(img);
    } else {
        imgWrap.innerHTML = '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center"><i class="ph ph-image" style="font-size:2.5rem;color:#d1d5db"></i></div>';
    }

    // [6] Cart button with view-cart behaviour
    const cartBtn = document.createElement('button');
    cartBtn.className = 'quick-cart-btn absolute top-2 left-2 w-9 h-9 rounded-[12px] flex items-center justify-center transition-all';
    cartBtn.style.cssText = 'background:rgba(255,255,255,0.92);backdrop-filter:blur(4px);box-shadow:0 2px 8px rgba(0,0,0,0.15);';
    _setCardCartBtn(cartBtn, inCart);

    cartBtn.addEventListener('click', e => {
        e.stopPropagation();
        if (_isInCart(prod.id)) {
            // already in cart → open cart
            renderCartItems(); openModal('cart-modal');
        } else {
            _quickAddToCart(prod, cartBtn);
        }
    });

    imgWrap.appendChild(cartBtn);
    /* (٨ ث — تدقيق المطابقة) «المعاينة كزبون، وعند كل شيء قلم تعديل»: بوضع المعاينة لموظّفٍ مسجّل،
       قلمٌ على كل منتج يفتح محرّره في أدمن المتجر مباشرةً. الزبون لا يراه أبداً. */
    if (window.__gmtPreviewEdit) {
        const pen = document.createElement('a');
        pen.href = 'admin_store.html?edit=' + encodeURIComponent('prod:' + prod.id);
        pen.title = 'تعديل هذا المنتج'; pen.setAttribute('aria-label', 'تعديل هذا المنتج');
        pen.className = 'absolute top-2 right-2 w-9 h-9 rounded-[12px] flex items-center justify-center';
        pen.style.cssText = 'background:#0f1219;color:#fff;text-decoration:none;font-size:16px;';
        pen.innerHTML = '<i class="ph ph-pencil-simple"></i>';
        pen.addEventListener('click', e => e.stopPropagation());
        imgWrap.appendChild(pen);
    }
    card.appendChild(imgWrap);

    // info
    const info = document.createElement('div');
    info.className = 'p-3 flex flex-col gap-1';
    const barcodeHtml = prod.barcode
        ? `<span style="font-family:monospace;font-size:9px;color:#5b6472;letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="كود: ${prod.barcode}"># ${prod.barcode}</span>`
        : '';
    info.innerHTML = `<h4 class="text-[13px] font-medium text-dark leading-snug line-clamp-2">${displayName}</h4>${barcodeHtml}<span class="text-primary font-bold text-[15px] mt-1" dir="ltr">${CONFIG.CURRENCY}${parseFloat(prod.price||0).toFixed(2)}</span>`;
    card.appendChild(info);

    card.addEventListener('click', () => openProductModal(prod.id));
    return card;
}

function _setCardCartBtn(btn, inCart) {
    if (inCart) {
        btn.innerHTML = '<i class="ph ph-shopping-bag text-[16px]" style="color:#fff"></i>';
        btn.style.background = '#111111';
    } else {
        btn.innerHTML = '<i class="ph ph-shopping-bag-open text-[18px]" style="color:#D5001C"></i>';
        btn.style.background = 'rgba(255,255,255,0.92)';
    }
}

// ══════════════════════════════════════════════
// [6] CART LOGIC
// ══════════════════════════════════════════════
function _isInCart(prodId) {
    return store.cart.some(i => (i._cartId || i.id) === prodId || (i._cartId||'').startsWith(prodId));
}

function _quickAddToCart(prod, btnEl) {
    const rawStock = prod.stock !== undefined ? parseInt(prod.stock) : 0;
    const stock = (rawStock && rawStock > 0) ? rawStock : 9999;
    const cid = prod.id;
    const ex = store.cart.find(i => i._cartId === cid);
    if (ex) {
        const nq = (ex.qty||1)+1;
        if (nq > stock) { showToast(`الحد الأقصى (${stock})`,'error'); return; }
        ex.qty = nq;
    } else {
        store.cart.push({...prod, _cartId:cid, price:parseFloat(prod.price||0), qty:1});
    }
    localStorage.setItem('gmt_cart', JSON.stringify(store.cart));
    updateCartBadge();

    // Switch button to "view cart"
    if (btnEl) _setCardCartBtn(btnEl, true);
    showToast('تمت الإضافة للسلة ✓','success');
}

function updateCartBadge() {
    const badge = document.querySelector('[data-element="cart-badge"]');
    const count = store.cart.reduce((s,i)=>s+(i.qty||1),0);
    if (count > 0) { badge.textContent = count>99?'99+':count; badge.classList.remove('hidden'); badge.classList.add('cart-add-anim'); setTimeout(()=>badge.classList.remove('cart-add-anim'),300); }
    else badge.classList.add('hidden');
    localStorage.setItem('gmt_cart', JSON.stringify(store.cart));
    _refreshAllCartBtns();
}

function _refreshAllCartBtns() {
    // update all visible quick-cart buttons
    document.querySelectorAll('.quick-cart-btn').forEach(btn => {
        const card = btn.closest('[style*="cursor:pointer"]') || btn.closest('.min-w-\\[160px\\]');
        // We tag each btn with data-prod-id for easy lookup
        const pid = btn.dataset.prodId;
        if (pid) _setCardCartBtn(btn, _isInCart(pid));
    });
}

function removeFromCart(id) { store.cart = store.cart.filter(i=>(i._cartId||i.id)!==id); updateCartBadge(); renderCartItems(); }

function renderCartItems() {
    const c   = document.getElementById('cart-items');
    const tot = document.getElementById('cart-total');
    if (!c) return;
    if (!store.cart.length) {
        c.innerHTML = `<div class="text-center py-10 flex flex-col items-center gap-3"><i class="ph ph-shopping-bag text-5xl text-gray-200"></i><p class="text-gray-400 text-sm">السلة فارغة</p></div>`;
        if(tot) tot.textContent=`0 ${CONFIG.CURRENCY}`; return;
    }
    let total=0; c.innerHTML='';
    store.cart.forEach(item => {
        total += (parseFloat(item.price)||0)*(item.qty||1);
        const cid = item._cartId||item.id;
        const vt  = item.selectedVariants?.map(v=>(v.name||v.value||'')+(v.barcode?' ‹'+v.barcode+'›':'')).filter(Boolean).join(' · ')||'';
        const d   = document.createElement('div');
        d.className = 'flex justify-between items-center bg-light p-3 rounded-[12px]';
        d.innerHTML = `<div class="flex gap-3 items-center flex-1 min-w-0">
            <div class="w-10 h-10 bg-white rounded-[8px] flex items-center justify-center flex-shrink-0 overflow-hidden">
                ${item.images?.[0]?`<img src="${item.images[0]}" class="w-full h-full object-contain img-blend">`:`<i class="ph ph-image text-gray-300"></i>`}
            </div>
            <div class="flex flex-col min-w-0">
                <span class="text-sm font-medium line-clamp-1">${escHtml(item.name)}</span>
                ${vt?`<span class="text-[11px] text-gray-400">${vt}</span>`:''}
                <div class="flex items-center gap-2 mt-1">
                    <span class="text-xs text-primary font-bold">${parseFloat(item.price||0).toFixed(2)} ${CONFIG.CURRENCY}</span>
                    <span class="text-xs text-gray-400">× ${item.qty}</span>
                </div>
            </div>
        </div>
        <button onclick="removeFromCart('${cid}')" class="p-2 text-red-400 hover:text-red-600 flex-shrink-0"><i class="ph ph-trash text-lg"></i></button>`;
        c.appendChild(d);
    });
    /* 🔴 (2026-10-03) الإجمالي المعروض يجب أن يطابق المحصَّل حرفياً.
       كان يُحسب «الإجمالي + أجور التوصيل» بلا خصم الكوبون، بينما submitOrder يحسب
       «المجموع ناقص خصم الكوبون زائد التوصيل». فالزبون يقرأ «كوبون نشط — خصم كذا»
       ثمّ يرى رقماً أكبر ممّا سيُحاسَب عليه. نستعمل المعادلة نفسها هنا كي لا
       يفترقا مرّةً أخرى عند أي تعديل مستقبلي. */
    const couponDisc = (typeof storeCouponDiscount === 'function') ? storeCouponDiscount(total) : 0;
    const totalWithDelivery = Math.max(0, total - couponDisc) + DELIVERY_FEE;
    const summaryWrap = document.getElementById('cart-summary-wrap');
    const deliveryDisplay = document.getElementById('cart-delivery-display');
    const subtotalEl = document.getElementById('cart-subtotal-display');
    const couponRow = document.getElementById('cart-coupon-display');
    const couponAmt = document.getElementById('cart-coupon-amount');
    const couponLbl = document.getElementById('cart-coupon-label');
    if(store.cart.length){
        if(summaryWrap) summaryWrap.style.display='flex';
        if(deliveryDisplay) deliveryDisplay.style.display='flex';
        if(subtotalEl) subtotalEl.textContent = `${total.toFixed(2)} ${CONFIG.CURRENCY}`;
    } else {
        if(summaryWrap) summaryWrap.style.display='none';
        if(deliveryDisplay) deliveryDisplay.style.display='none';
    }
    if(couponRow){
        /* 🔧 (2026-10-03 · ق١٦) كان الصفّ يختفي كلّما كان الخصم صفراً — فالزبون
           الذي أدخل كوبوناً صالحاً على سلّةٍ كلُّها عروضٌ يراه **يختفي بلا سبب**
           فيحسبها عطلاً ويُعيد المحاولة. الآن: إن وُجد كوبونٌ وكان الخصم صفراً
           بسبب العروض، يبقى الصفُّ ويقول السبب. */
        const _note = (typeof storeCouponNote === 'function') ? storeCouponNote() : '';
        if(couponDisc > 0.004 && store.cart.length){
            couponRow.style.display='flex';
            if(couponAmt) couponAmt.textContent = `− ${couponDisc.toFixed(2)} ${CONFIG.CURRENCY}`;
            if(couponLbl && _storeCoupon) couponLbl.textContent =
                `🎟️ خصم الكوبون ${_storeCoupon.code || ''}` + (_note ? ' · لا يُجمع مع العروض' : '');
        } else if(_storeCoupon && _note && store.cart.length){
            couponRow.style.display='flex';
            if(couponAmt) couponAmt.textContent = `− 0.00 ${CONFIG.CURRENCY}`;
            if(couponLbl) couponLbl.textContent = `🎟️ ${_note}`;
        } else {
            couponRow.style.display='none';
        }
    }
    if(tot) tot.textContent = `${totalWithDelivery.toFixed(2)} ${CONFIG.CURRENCY}`;
}

const DELIVERY_FEE = 1; // أجور التوصيل

let _orderSubmitting = false;   // 🔒 (2026-08-26) قفل إعادة الدخول — يمنع الطلب المزدوج من الضغط المكرّر
async function submitOrder(name, phone, address, notes, payment) {
    if (!store.cart.length) return showToast('السلة فارغة','error');
    if (_orderSubmitting) return;                       // ضغطة مكرّرة أثناء المعالجة ⇒ تُتجاهَل
    _orderSubmitting = true;
    const _btn = document.getElementById('checkout-btn');
    const _btnLabel = document.getElementById('checkout-btn-label');
    if (_btn) _btn.disabled = true;
    if (_btnLabel) _btnLabel.textContent = 'جارٍ الإرسال…';
    try {
    const subtotal = store.cart.reduce((s,i)=>s+(parseFloat(i.price)||0)*(i.qty||1),0);
    const couponDisc = storeCouponDiscount(subtotal);   // خصم الكوبون (إن وُجد)
    const total = Math.max(0, subtotal - couponDisc) + DELIVERY_FEE;
    const orderId = 'ORD-' + Date.now();
    // بيانات الكوبون تُحفظ بالأوردر لتنتقل لفاتورة الكاشير عند التحويل (ثمّ يُختم هناك)
    const couponInfo = _storeCoupon ? { code: _storeCoupon.code, discount: couponDisc.toFixed(2), type: _storeCoupon.discount_type, value: _storeCoupon.discount_value } : null;
    const productLines = store.cart.map(item => {
        let line = `${item.name}${item.qty>1?` x${item.qty}`:''}`;
        if (item.selectedVariants?.length) { const vs=item.selectedVariants.map(v=>(v.name||v.value||'')+(v.barcode?' ‹'+v.barcode+'›':'')).filter(Boolean).join(', '); if(vs) line+=` (${vs})`; }
        return line;
    }).join(' + ');
    const orderData = {id:orderId,name,phone,address,product:productLines,price:total.toFixed(2),subtotal:subtotal.toFixed(2),delivery:DELIVERY_FEE.toFixed(2),branch:'المتجر الإلكتروني',notes:notes||'',status:'pending',payment,items:[...store.cart],coupon:couponInfo};
    /* (17 ت1) ما يكتبه الزبون يُهرَّب قبل وضعه في رسالة HTML — كان يستطيع حقن رابطٍ في قناة الطلبات */
    const _e = (window.GMTUtil && GMTUtil.esc) ? GMTUtil.esc : (x => String(x == null ? '' : x).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
    let msg = `🛍️ <b>طلب جديد! ${_e(orderId)}</b>\n👤 ${_e(name)}\n📱 ${_e(phone)}\n📍 ${_e(address)}\n━━━━━━━━\n`;
    store.cart.forEach(i=>{const vs=i.selectedVariants?.map(v=>(v.name||v.value||'')+(v.barcode?' ‹'+v.barcode+'›':'')).filter(Boolean).join(', ')||'';msg+=`• ${_e(i.name)}${vs?` [${_e(vs)}]`:''} x${i.qty} — ${parseFloat(i.price).toFixed(2)} ${CONFIG.CURRENCY}\n`;});
    if(couponInfo) msg+=`━━━━━━━━\n🎟️ كوبون: ${_e(couponInfo.code)} — خصم ${couponInfo.discount} ${CONFIG.CURRENCY}\n`;
    msg += `━━━━━━━━\n🚚 التوصيل: ${DELIVERY_FEE.toFixed(2)} ${CONFIG.CURRENCY}\n💰 <b>الإجمالي: ${total.toFixed(2)} ${CONFIG.CURRENCY}</b>\n💳 ${payment==='cod'?'عند الاستلام':payment==='whatsapp'?'واتساب':'شام كاش'}`;
    if(notes) msg+=`\n📝 ${_e(notes)}`;
    if(payment==='cod') {
        /* (17 ت1) النسختان معاً لا بالتتابع — كانت النسخة الاحتياطيّة تؤخّر الحفظ الأساسي إن أبطأ الوسيط */
        const [localOk, supaRes] = await Promise.all([insertOrder(orderData),            // نسخة jsonbin عبر الوسيط (احتياط)
                                                      insertOrderToSupabase(orderData)]); // النظام الأساسي (كاشير): ok | dup | fail
        await sendTG(msg);
        const reached = supaRes==='ok' || supaRes==='dup' || localOk;   // وصل مخزناً واحداً على الأقل
        if (!reached) {
            // (2026-08-26) لا رسالة نجاح مع إخفاق — نُبقي السلة ليُعيد الزبون الإرسال
            showToast('تعذّر إرسال الطلب — تأكّد من الإنترنت وأعد المحاولة','error');
            return;
        }
        const cartSnapshot=[...store.cart];
        store.cart=[]; updateCartBadge(); closeModal('cart-modal');
        showToast((supaRes==='ok'||supaRes==='dup') ? 'تم إرسال طلبك بنجاح! ✓' : 'تم استلام طلبك ✓','success');
        // Show invoice for COD
        setTimeout(()=>showInvoice({orderId,name,phone,address,notes,payment,items:cartSnapshot,subtotal,total}),600);
    } else {
        // واتساب/شام كاش: رسالة واتساب هي القناة الفعلية للتاجر، فلا يضيع الطلب حتى لو تعذّر حفظه بالقاعدة.
        await sendTG(msg);
        const supaRes = await insertOrderToSupabase(orderData);
        if (supaRes==='fail') console.warn('[GMT] لم يُحفظ الطلب في القاعدة؛ يعتمد على رسالة واتساب:', orderId);
        let waText=`مرحباً، ${payment==='shamcash'?'أود إكمال الدفع عبر شام كاش':'اكمال الطلب عبر واتساب'} للطلب التالي:\n\nرقم الطلب: ${orderId}\nالاسم: ${name}\nالهاتف: ${phone}\nالعنوان: ${address}\n\nالمنتجات:\n`;
        store.cart.forEach(i=>{const vs=i.selectedVariants?.map(v=>(v.name||v.value||'')+(v.barcode?' ‹'+v.barcode+'›':'')).filter(Boolean).join(', ')||'';waText+=`- ${i.name}${vs?` (${vs})`:''} (الكمية: ${i.qty}) — ${(parseFloat(i.price)*i.qty).toFixed(2)} ${CONFIG.CURRENCY}\n`;});
        waText+=`\n🚚 التوصيل: ${DELIVERY_FEE.toFixed(2)} ${CONFIG.CURRENCY}\n💰 الإجمالي: ${total.toFixed(2)} ${CONFIG.CURRENCY}\n\nملاحظات: ${notes||'لا يوجد'}`;
        store.cart=[]; updateCartBadge(); closeModal('cart-modal');
        showToast('جاري تحويلك إلى واتساب...','success');
        setTimeout(()=>window.open(`https://wa.me/${CONFIG.WHATSAPP_NUMBER}?text=${encodeURIComponent(waText)}`,'_blank'),1000);
    }
    } finally {
        _orderSubmitting = false;
        if (_btn) _btn.disabled = false;
        if (_btnLabel) _btnLabel.textContent = 'تأكيد الطلب';
    }
}

function offerPriceHTML(offer){
    const p  = Number(offer && offer.price);
    const op = Number(offer && offer.old_price);
    if(!isFinite(p) || p <= 0) return '';
    const save = (isFinite(op) && op > p) ? (op - p) : 0;
    return `<div style="display:flex;align-items:baseline;gap:8px;margin:0 0 10px;flex-wrap:wrap;">
        <span style="font-size:18px;font-weight:800;color:#D5001C;">${p.toFixed(2)} ${CONFIG.CURRENCY}</span>
        ${save?`<span style="font-size:13px;color:#5b6472;text-decoration:line-through;">${op.toFixed(2)} ${CONFIG.CURRENCY}</span>
        <span style="font-size:11px;font-weight:800;color:#15803d;background:#f0fdf4;border-radius:999px;padding:2px 8px;">وفّر ${save.toFixed(2)}</span>`:''}
    </div>`;
}

function offerItemsHTML(offer, limit){
    const items = Array.isArray(offer && offer.products) ? offer.products : [];
    if(!items.length) return '';
    const show = limit ? items.slice(0, limit) : items;
    const more = items.length - show.length;
    return `<div style="margin:0 0 10px;">
        <div style="font-size:11px;font-weight:800;color:#5b6472;margin-bottom:5px;">📦 يشمل ${items.length} منتجاً</div>
        ${show.map(it=>`<div style="display:flex;align-items:center;gap:7px;font-size:12px;color:#444;padding:2px 0;">
            <span style="width:5px;height:5px;border-radius:50%;background:#D5001C;flex-shrink:0;"></span>
            <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(it.name||'')}</span>
            ${it.qty>1?`<span style="color:#5b6472;">×${it.qty}</span>`:''}
        </div>`).join('')}
        ${more>0?`<div style="font-size:11px;color:#5b6472;padding-top:3px;">و${more} غيرها…</div>`:''}
    </div>`;
}

function openOfferDetail(offer){
    const modal = document.getElementById('offer-detail-modal');
    if(!modal) return;
    
    const content = document.getElementById('offer-detail-content');
    const now = new Date();
    const isExpired = offer.end_date && new Date(offer.end_date) < now;
    const images = Array.isArray(offer.images) && offer.images.length ? offer.images : (offer.image?[offer.image]:[]);
    
    let slidesHTML = '';
    let dotsHTML = '';
    if(images.length) {
        slidesHTML = images.map((img,i)=>`<div style="min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;"><img src="${img}" style="width:100%;height:100%;object-fit:cover;"></div>`).join('');
        if(images.length>1) dotsHTML = images.map((_,i)=>`<div onclick="_offerGoTo(${i})" style="width:${i===0?'18':'6'}px;height:6px;border-radius:9999px;background:${i===0?'#D5001C':'#d1d5db'};transition:all 0.3s;cursor:pointer;" class="offer-dot"></div>`).join('');
    }
    
    content.innerHTML = `
    <div style="position:relative;height:260px;background:#f5f5f5;overflow:hidden;">
        <div id="offer-slides" style="display:flex;height:100%;transition:transform 0.3s;">
            ${slidesHTML||'<div style="width:100%;display:flex;align-items:center;justify-content:center;"><i class="ph ph-tag" style="font-size:48px;color:#5b6472;"></i></div>'}
        </div>
        ${dotsHTML?`<div style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px;">${dotsHTML}</div>`:''}
    </div>
    <div style="padding:16px;">
        ${isExpired?'<div style="background:#fee2e2;color:#dc2626;font-size:11px;font-weight:700;padding:6px 12px;border-radius:8px;display:inline-block;margin-bottom:12px;">انتهى هذا العرض</div>':''}
        <h2 style="font-size:19px;font-weight:800;color:#111;margin:0 0 8px;">${offer.title||'عرض مميز'}</h2>
        ${offer.end_date?`<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#5b6472;margin-bottom:12px;"><i class="ph ph-calendar-blank"></i><span>${isExpired?'انتهى في:':'ينتهي في:'} ${new Date(offer.end_date).toLocaleDateString('ar-EG')}</span></div>`:''}
        ${offerPriceHTML(offer)}
        ${offer.description?`<div style="font-size:13.5px;color:#555;line-height:1.8;white-space:pre-line;">${escHtml(offer.description)}</div>`:''}
        ${offerItemsHTML(offer, 0)}
    </div>`;
    
    window._offerSlideIdx = 0;
    window._offerGoTo = function(i){
        const slides = document.getElementById('offer-slides');
        window._offerSlideIdx = i;
        if(slides) slides.style.transform = `translateX(${i*100}%)`;
        document.querySelectorAll('.offer-dot').forEach((d,idx)=>{
            d.style.background = idx===i?'#D5001C':'#d1d5db';
            d.style.width = idx===i?'18px':'6px';
        });
    };
    
    openModal('offer-detail-modal');
}

async function renderCommentsList() {
    const c = document.getElementById('comments-list'); if(!c) return;
    c.innerHTML=`<div class="text-center py-6"><div class="inline-block w-6 h-6 border-2 border-primary border-t-transparent rounded-full animate-spin"></div></div>`;
    const comments = await fetchComments();
    if(!comments.length){c.innerHTML=`<div class="text-center text-gray-400 py-6 text-sm">لا توجد تقييمات بعد!</div>`;return;}
    const frag=document.createDocumentFragment();
    comments.forEach(cm=>{
        const d=document.createElement('div'); d.className='bg-light p-3 rounded-[12px]';
        const dateStr=cm.created_at?new Date(cm.created_at).toLocaleDateString('ar-EG'):'';
        /* ⭐ طلبك ٩٠: النجومُ الحقيقية. `rating` قد لا يكون عموداً في قاعدتك
           (لم تُشغّل SQL) — فإن غاب لا نخترع خمساً ولا نرسم صفراً: لا نرسم
           نجوماً إطلاقاً. والتقييماتُ القديمة تبقى معروضةً كما هي. */
        const _rt = Number(cm.rating);
        const _stars = (isFinite(_rt) && _rt >= 1 && _rt <= 5)
            ? '<div class="flex text-yellow-400 text-[11px]" title="' + _rt + ' من ٥">' +
              '<i class="ph-fill ph-star"></i>'.repeat(Math.round(_rt)) +
              '<i class="ph ph-star"></i>'.repeat(5 - Math.round(_rt)) + '</div>'
            : '';
        d.innerHTML=`<div class="flex justify-between items-center mb-1"><span class="text-sm font-bold">${escHtml(cm.name||'مجهول')}</span><div class="flex items-center gap-2"><span class="text-[10px] text-gray-400">${dateStr}</span>${_stars}</div></div><p class="text-xs text-gray-600 leading-relaxed">${escHtml(cm.text||'')}</p>`;  /* 🔒 (2026-08-26) [OWN-ESCAPE-USER] تعليقات الزبائن تُهرَّب — كانت XSS مخزّناً على الواجهة العامة */
        frag.appendChild(d);
    });
    c.innerHTML=''; c.appendChild(frag);
}
/* ⭐ طلبك ٩٠ — اختيارُ النجوم */
let _commRating = 0;
function setCommRating(n){
    _commRating = Number(n) || 0;
    document.querySelectorAll('#comm-stars [data-star]').forEach(b=>{
        b.style.color = (Number(b.dataset.star) <= _commRating) ? '#f59e0b' : '#d4d4d8';
    });
}
window.setCommRating = setCommRating;

/* (٨ ث — تدقيق المطابقة) «ممتاز 4.9» كان رقماً مكتوباً ثابتاً — لا يُخترع رقم. الآن متوسّط تقييمات زبائنك الفعليّ
   وعددها؛ وبلا تقييمات بنجوم تبقى الكلمة «التقييمات» بلا رقم. */
async function updateRatingHeader(){
    const el = document.getElementById('store-rating-lbl'); if(!el) return;
    try {
        const rs = (await fetchComments()).map(c => Number(c.rating)).filter(r => isFinite(r) && r >= 1 && r <= 5);
        if (!rs.length) { el.textContent = 'التقييمات'; return; }
        const avg = rs.reduce((a, b) => a + b, 0) / rs.length;
        el.textContent = (avg >= 4.5 ? 'ممتاز ' : avg >= 3.5 ? 'جيد جداً ' : avg >= 2.5 ? 'جيد ' : '') + avg.toFixed(1) + ' (' + rs.length + ')';
    } catch (_) {}
}
window.updateRatingHeader = updateRatingHeader;
document.addEventListener('DOMContentLoaded', () => setTimeout(updateRatingHeader, 1500));

async function submitNewComment(){
    const nameEl=document.getElementById('comm-name'),textEl=document.getElementById('comm-text');
    const phoneEl=document.getElementById('comm-phone');
    const name=nameEl?.value?.trim(),text=textEl?.value?.trim();
    const phone=(phoneEl?.value||'').trim().replace(/[\s-]/g,'');
    if(!name||!text) return showToast('يرجى إدخال الاسم والتقييم','error');
    if(!_commRating) return showToast('اختر عددَ النجوم أوّلاً','error');
    /* (٨ ث) طلبك: «التقييم: نجوم + اسم + **رقم**» — كان الرقم اختيارياً ⇒ تقييماتٌ بلا أحدٍ نعود إليه */
    if(!/^(\+?963|0)?9\d{8}$/.test(phone)) return showToast('اكتب رقم هاتفك (09XXXXXXXX) — لا يُنشَر','error');
    const _rate = _commRating;   /* يُحفظ قبل تصفير النجوم — كان الإشعار يصل دائماً «0/5» */

    /* ══ كتابةٌ متدرّجة (نمط P1) ══
       عمودٌ واحد غير موجود يرفض الطلب **كلّه** في PostgREST. وأنت لم تُشغّل
       SQL، فـ`rating` و`phone` قد لا يكونان أعمدةً. فنُحاول الكامل أوّلاً،
       وإن رُفض نُسقط الحقول الجديدة ونحفظ ما يُقبَل — فلا يضيع رأيُ الزبون
       بسبب عمودٍ ناقص، ويبقى التقييمُ محفوظاً في نصّه. */
    const full = { name, text, rating: _commRating, phone: phone || null };
    let ok = await insertComment(full);
    let degraded = false;
    if (!ok) {
        degraded = true;
        const stars = '★'.repeat(_commRating) + '☆'.repeat(5 - _commRating);
        ok = await insertComment({
            name,
            text: text + '\n(التقييم: ' + stars + ' ' + _commRating + '/5' + (phone ? ' · هاتف: ' + phone : '') + ')'
        });
    }

    nameEl.value=''; textEl.value=''; if(phoneEl) phoneEl.value='';
    setCommRating(0);
    renderCommentsList();

    if (!ok) { showToast('تعذّر حفظ التقييم — حاول مرّةً أخرى','error'); return; }
    showToast('تم إضافة تقييمك بنجاح ✓','success');
    /* (٨ ث — تدقيق المطابقة) «المقيّمون من الموقع يصيرون عملاء» — يُضاف لسجلّ العملاء إن لم يكن فيه
       (لا يكتب فوق اسم عميلٍ موجود). الرقم بصيغة نقطة البيع 09… كي لا يتكرّر الزبون. */
    try {
        const _p09 = phone.replace(/^\+?963/, '0').replace(/^9/, '09');
        /* سجلّ العملاء في القاعدة الرئيسيّة (لا قاعدة المتجر التي فيها التقييمات) */
        const _M = window.GMT_DB && GMT_DB.MAIN;
        if (_M) fetch(_M.url + '/rest/v1/gmt_customers?on_conflict=phone', { method: 'POST',
            headers: GMT_DB.headers(_M, { Prefer: 'resolution=ignore-duplicates,return=minimal' }),
            body: JSON.stringify({ name, phone: _p09, branch_name: 'المتجر الإلكتروني' }) }).catch(() => {});
    } catch (_) {}
    if (degraded) console.warn('[GMT] حُفظ التقييم بصيغةٍ مبسّطة — عمودا rating/phone غير موجودين (SQL)');

    /* 🔔 طلبك ٩٠: «+ إشعار» — يصلك التقييم فوراً على قناتك لا بعد أن تتذكّر
       فتحَ المتجر. ولا نُعلّق واجهة الزبون على نجاح الإرسال. */
    try {
        const msg = '⭐ تقييمٌ جديد في المتجر\n' +
                    'النجوم: ' + '★'.repeat(_rate) + '☆'.repeat(5 - _rate) + ' (' + _rate + '/5)\n' +
                    'الاسم: ' + name + '\nالهاتف: ' + phone +
                    '\nالنصّ: ' + text;
        GMTUtil.tg(msg, { token: CONFIG.TELEGRAM_BOT_TOKEN, chat: CONFIG.TELEGRAM_CHAT_ID, html: false });   /* (٨ ث) نسخةٌ واحدة بمهلة */
    } catch(e) {}
    updateRatingHeader();
}

function openBranchesModal(){
    let m = document.getElementById('branches-modal');
    if (!m) {
        m = document.createElement('div'); m.id = 'branches-modal'; m.className = 'modal-overlay';
        m.style.cssText = 'position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center';
        m.addEventListener('click', e => { if (e.target === m) closeBranchesModal(); });
        document.body.appendChild(m);
    }
    const list = (store.branches || []).filter(b => b && b.name);
    const byGov = {}; list.forEach(b => { (byGov[b.province || 'أخرى'] = byGov[b.province || 'أخرى'] || []).push(b); });
    const wa = p => { let d = String(p || '').replace(/[^0-9+]/g, ''); if (d[0] === '+') d = d.slice(1); else if (d.startsWith('00')) d = d.slice(2); else if (d[0] === '0') d = '963' + d.slice(1); return d; };
    const body = list.length ? Object.keys(byGov).sort().map(g => `<div style="margin:12px 0 6px;font-weight:800;font-size:13px;color:#D5001C">${escHtml(g)}</div>` +
        byGov[g].map(b => `<div style="background:#F7F7F7;border-radius:12px;padding:10px 12px;margin-bottom:8px">
            <div style="font-weight:800;font-size:14px">${escHtml(b.name)}</div>
            ${b.address ? `<div style="font-size:12px;color:#555;margin-top:2px">${escHtml(b.address)}</div>` : ''}
            ${b.phone ? `<div style="display:flex;gap:8px;margin-top:8px"><a href="tel:${escHtml(b.phone)}" style="flex:1;text-align:center;background:#fff;border:1px solid #e5e5e5;border-radius:9px;padding:7px;font-size:12px;font-weight:700;color:#111;text-decoration:none" dir="ltr">${escHtml(b.phone)}</a>
               <a href="https://wa.me/${wa(b.phone)}" target="_blank" rel="noopener" style="flex:1;text-align:center;background:#16a34a;border-radius:9px;padding:7px;font-size:12px;font-weight:700;color:#fff;text-decoration:none">واتساب</a></div>` : ''}
          </div>`).join('')).join('')
        : `<div style="text-align:center;color:#777;font-size:13px;padding:18px 6px">للاستفسار عن أقرب فرعٍ إليك راسلنا على واتساب.</div>`;
    m.innerHTML = `<div style="background:#fff;width:100%;max-width:520px;max-height:85vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom))">
        <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:17px">فروعنا ووكلاؤنا</b>
          <button onclick="closeBranchesModal()" style="width:32px;height:32px;border-radius:50%;border:0;background:#F5F5F5;cursor:pointer" aria-label="إغلاق"><i class="ph ph-x"></i></button></div>
        ${body}
        <a href="site.html#agents" target="_blank" rel="noopener" style="display:block;text-align:center;margin-top:10px;border:1.5px solid #111;border-radius:12px;padding:11px;font-weight:800;font-size:13px;color:#111;text-decoration:none">وكلاؤنا المعتمدون ↗</a>
      </div>`;
    m.style.display = 'flex'; document.body.style.overflow = 'hidden';
}

// PRODUCT DEEP LINK (URL Hash)
// ══════════════════════════════════════════════
function _applyDeepLink() {
    const hash = window.location.hash; // e.g. #product=p123
    if (!hash) return;
    /* (٧ ي-٤) 🔍 في رأس الموقع يفتح «ابحث عن منتج» هنا مباشرةً */
    if (hash === '#search') { history.replaceState(null, '', location.pathname + location.search); setTimeout(openSearchBar, 300); return; }
    const m = hash.match(/^#product=(.+)$/);
    if (!m) return;
    const productId = decodeURIComponent(m[1]);
    const prod = store.products.find(p => p.id === productId || p.slug === productId);
    if (prod) {
        if (window.__gmtDirect) { openProductModal(prod.id); return; }   // (TASK-0255) من التطبيق: فوراً
        setTimeout(() => openProductModal(prod.id), 400);
    }
}

function _setProductHash(productId) {
    history.replaceState(null, '', '#product=' + encodeURIComponent(productId));
}

function _clearProductHash() {
    history.replaceState(null, '', window.location.pathname + window.location.search);
}

    el.classList.remove('border-transparent');el.classList.add('border-primary');

};

};

window.performSearch=function(query){
    const q=query.trim().toLowerCase();
    const area=document.querySelector('[data-container="products-area"]');
    if(!q){showAllProducts();return;}
    area.querySelectorAll('section[data-category-section]').forEach(s=>s.style.display='none');
    const matched=store.products.filter(p=>p.name?.toLowerCase().includes(q));
    let temp=document.getElementById('search-results-section'); if(temp)temp.remove();

let _pmIdx=0, _pmImgs=[], _pmId=null, _pmQty=1;

function copyProductCode(){
    const codeEl=document.getElementById('product-modal-code');
    const btn=document.getElementById('product-modal-code-copy');
    const val=(codeEl?.textContent||'').trim();
    if(!val)return;
    const done=()=>{ if(btn){ const orig=btn.innerHTML; btn.innerHTML='<i class="ph ph-check" style="font-size:16px;color:#15803d;"></i>'; setTimeout(()=>{btn.innerHTML=orig;},1400); } };
    if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(val).then(done).catch(()=>{ _fallbackCopy(val); done(); });
    } else { _fallbackCopy(val); done(); }
}
function _fallbackCopy(text){
    try{ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }catch(e){}
}

function openProductModal(productId){
    const prod=store.products.find(p=>String(p.id) === String(productId)); if(!prod)return;
    _pmId=productId; _pmImgs=Array.isArray(prod.images)&&prod.images.length?prod.images:[]; _pmIdx=0; _pmQty=1;
    // Set URL hash for sharing
    _setProductHash(productId);

    document.getElementById('product-modal-name').textContent=prod.name||'';
    const priceEl=document.getElementById('product-modal-price');
    const base=parseFloat(prod.price||0);
    priceEl.textContent=`${CONFIG.CURRENCY}${base.toFixed(2)}`;
    priceEl.dataset.basePrice=base; delete priceEl.dataset.selectedPrice;

    const descEl=document.getElementById('product-modal-description');
    if(prod.description?.trim()){descEl.textContent=prod.description.trim();descEl.classList.remove('hidden');}
    else descEl.classList.add('hidden');
    /* (25 ت1 · TASK-0162 · المالك seq 54) جدول المواصفات في المتجر — يحمله الجسر من الجرد في prod.specs ([{label,value}]) */
    const specsEl=document.getElementById('product-modal-specs');
    if(specsEl){
      const sh=(window.GMTSpecs&&Array.isArray(prod.specs)&&prod.specs.length)?GMTSpecs.tableHTML(prod.specs,{compat:prod.compat||'',marks:false}):'';   /* (TASK-0234) بلا «≈» للزبون */
      specsEl.querySelector('[data-specs-body]').innerHTML=sh; specsEl.classList.toggle('hidden',!sh);
    }

    // كود المنتج (الباركود) — يظهر فقط إن وُجد، لنسخه والبحث عنه في الجرد
    const codeWrap=document.getElementById('product-modal-code-wrap');
    const codeEl=document.getElementById('product-modal-code');
    const codeVal=(prod.barcode||prod.sku||'').toString().trim();
    if(codeWrap&&codeEl){
      if(codeVal){ codeEl.textContent=codeVal; codeWrap.classList.remove('hidden'); codeWrap.style.display='flex'; }
      else { codeWrap.classList.add('hidden'); codeWrap.style.display='none'; }
    }

    document.getElementById('product-qty-display').textContent='1';

    // ── Build slides (images + optional video) ──
    _pmBuildSlides(prod);
    /* (TASK-0253 · المالك seq 174) «في المتجر صور المتجر ثم صور الجرد»: صورة المنتج في الجرد تُلحَق بعد صور المتجر (إن لم تكن بينها) */
    _pmInvImages(prod).then(extra=>{
        if(String(_pmId)!==String(productId)||!extra.length)return;
        const have=new Set((_pmImgs||[]).filter(x=>typeof x==='string'));
        const hid=new Set(Array.isArray(prod.images_hidden)?prod.images_hidden.map(String):[]);   // (TASK-0262) المخفيّة من المتجر
        const add=extra.filter(u=>!have.has(u)&&!hid.has(u)); if(!add.length)return;
        const base=(Array.isArray(prod.images)?prod.images:[]).concat(add);
        const at=_pmIdx; _pmBuildSlides(prod, base); _pmIdx=Math.min(at,_pmImgs.length-1);
        _updatePMSlider();
    });
    _updatePMSlider();
    _renderVariants(prod);

    // [6] Product modal add button state
    const addBtn=document.getElementById('product-modal-add-btn');
    if(_isInCart(productId)){
        addBtn.innerHTML=`<i class="ph ph-shopping-bag text-lg"></i><span>عرض السلة</span>`;
        addBtn.className='w-full bg-dark text-white rounded-[10px] py-3.5 font-bold flex items-center justify-center gap-2 hover:bg-gray-800 transition-colors active:scale-[0.98]';
        // ④ close product modal first, THEN open cart — no overlap
        addBtn.onclick=()=>{ closeModal('product-modal'); setTimeout(()=>{ renderCartItems(); openModal('cart-modal'); }, 380); };
    } else {
        addBtn.innerHTML=`<i class="ph ph-shopping-cart text-lg"></i><span>إضافة للسلة</span>`;
        addBtn.className='w-full bg-primary text-white rounded-[10px] py-3.5 font-bold flex items-center justify-center gap-2 hover:bg-red-800 transition-colors active:scale-[0.98]';
        addBtn.onclick=productModalAddToCart;
    }

    document.getElementById('product-modal-video-wrap').classList.add('hidden');
    document.getElementById('product-modal-ig-wrap').classList.add('hidden');
    
    // Render similar products
    _renderSimilarProducts(prod);
    
    openModal('product-modal');
}

function _renderVariants(prod){
    const vc=document.getElementById('product-modal-variants'); if(!vc)return; vc.innerHTML='';
    if(!prod.options?.length)return;
    prod.options.forEach((opt,oi)=>{
        const gd=document.createElement('div'); gd.className='mt-3';
        const lb=document.createElement('p'); lb.className='text-xs text-gray-500 mb-2'; lb.textContent=opt.type||`خيار ${oi+1}`; gd.appendChild(lb);
        const bd=document.createElement('div'); bd.className='flex flex-wrap gap-2';
        function _applyVariantImage(imgUrl){
            if(!imgUrl)return;
            const idx=(prod.images||[]).indexOf(imgUrl);
            if(idx>=0&&idx!==_pmIdx){_pmIdx=idx;_updatePMSlider();}
            else if(idx<0){
                const sc2=document.getElementById('product-modal-slides');
                if(sc2){sc2.innerHTML=''; const sl=document.createElement('div'); sl.style.cssText='min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:16px;flex-shrink:0;'; const img2=document.createElement('img'); img2.src=imgUrl; img2.style.cssText='max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply;'; sl.appendChild(img2); sc2.appendChild(sl); sc2.style.transform='translateX(0%)';}
            }
        }
        if(opt.affectsPrice){
            (opt.values||[]).forEach((v,vi)=>{
                const b=document.createElement('button'); b.className='px-3 py-1.5 text-xs rounded-[8px] border border-gray-200 bg-light text-dark transition-colors';
                b.textContent=`${v.name} — ${CONFIG.CURRENCY}${parseFloat(v.price||0).toFixed(2)}`; if(v.barcode)b.dataset.variantBarcode=v.barcode;
                b.onclick=function(){ bd.querySelectorAll('button').forEach(x=>{x.classList.remove('border-primary','bg-red-50','text-primary');x.classList.add('border-gray-200','bg-light','text-dark');}); this.classList.remove('border-gray-200','bg-light','text-dark'); this.classList.add('border-primary','bg-red-50','text-primary'); const pe=document.getElementById('product-modal-price'); const up=parseFloat(v.price||0); pe.textContent=`${CONFIG.CURRENCY}${(up*(_pmQty||1)).toFixed(2)}`; pe.dataset.selectedPrice=v.price; if(v.image)_applyVariantImage(v.image); };
                if(vi===0)setTimeout(()=>b.click(),0);
                bd.appendChild(b);
            });
        } else {
            (opt.values||[]).forEach(v=>{
                const vName=typeof v==='string'?v:(v?.name||v); const vImg=typeof v==='object'?v?.image:null; const vBc=typeof v==='object'?(v?.barcode||''):'';
                const b=document.createElement('button'); b.className='px-3 py-1.5 text-xs rounded-[8px] border border-gray-200 bg-light text-dark transition-colors'; b.textContent=vName; b.dataset.variantValue=vName; if(vBc)b.dataset.variantBarcode=vBc;
                b.onclick=function(){ bd.querySelectorAll('button').forEach(x=>{x.classList.remove('border-primary','bg-red-50','text-primary');x.classList.add('border-gray-200','bg-light','text-dark');}); this.classList.remove('border-gray-200','bg-light','text-dark'); this.classList.add('border-primary','bg-red-50','text-primary'); if(vImg)_applyVariantImage(vImg); };
                bd.appendChild(b);
            });
        }
        gd.appendChild(bd); vc.appendChild(gd);
    });
}

function _collectVariants(){ const vc=document.getElementById('product-modal-variants'); if(!vc)return[]; const sel=[]; vc.querySelectorAll('button.border-primary').forEach(b=>{ const bc=b.dataset.variantBarcode||undefined; if(b.dataset.selectedPrice!==undefined)sel.push({name:b.textContent.split('—')[0].trim(),price:parseFloat(b.dataset.selectedPrice),barcode:bc}); else if(b.dataset.variantValue!==undefined)sel.push({value:b.dataset.variantValue,barcode:bc}); }); return sel; }

/* (TASK-0253) بناء شرائح نافذة المنتج من قائمة صور (+ الفيديو إن وُجد) — يُستدعى عند الفتح وبعد وصول صورة الجرد */
function _pmBuildSlides(prod, imgs){
    _pmImgs=Array.isArray(imgs)?imgs.slice():(Array.isArray(prod.images)&&prod.images.length?prod.images.slice():[]);
    const sc=document.getElementById('product-modal-slides');
    const dc=document.getElementById('product-modal-dots');
    const prevB=document.getElementById('product-modal-prev');
    const nextB=document.getElementById('product-modal-next');
    sc.innerHTML=''; dc.innerHTML='';

    const allSlides=[..._pmImgs];
    if(prod.video_url?.trim()) allSlides.push({_type:'video',url:prod.video_url.trim()});

    if(!allSlides.length){
        sc.innerHTML=`<div style="min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;"><i class="ph ph-image" style="font-size:48px;color:#5b6472;"></i></div>`;
        prevB.classList.add('hidden'); nextB.classList.add('hidden');
    } else {
        allSlides.forEach((item,i)=>{
            const sl=document.createElement('div');
            sl.style.cssText='min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;overflow:hidden;';
            if(item._type==='video'){
                let embedUrl=item.url.replace(/\?.*$/,'');
                if(!embedUrl.endsWith('/'))embedUrl+='/';
                embedUrl+='embed/';
                const iframe=document.createElement('iframe');
                iframe.src=embedUrl; iframe.style.cssText='width:100%;height:100%;border:none;';
                iframe.setAttribute('allowfullscreen',''); iframe.setAttribute('scrolling','no');
                sl.appendChild(iframe);
            } else {
                sl.style.padding='16px';
                const img=document.createElement('img'); img.src=item;
                img.style.cssText='max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply;';
                sl.appendChild(img);
            }
            sc.appendChild(sl);
            const dot=document.createElement('div');
            dot.style.cssText=`height:6px;border-radius:9999px;background:${i===0?'#D5001C':'#d1d5db'};transition:all 0.3s;cursor:pointer;width:${i===0?'18px':'6px'};`;
            dot.onclick=()=>_goToPMSlide(i);
            dc.appendChild(dot);
        });
        _pmImgs=allSlides;
        const showNav=allSlides.length>1;
        prevB.classList.toggle('hidden',!showNav); nextB.classList.toggle('hidden',!showNav);
    }
}
/* (TASK-0253) صورة المنتج نفسه في الجرد (القاعدة الرئيسيّة) — بالربط: inv_id ⇐ رابط المتجر «#product=» ⇐ الباركود. تُحفظ لكل منتج مرّة. */
const _pmInvCache={};
function _pmInvImages(prod){
    const key=String(prod.id);
    if(_pmInvCache[key])return _pmInvCache[key];
    const M=window.GMT_DB&&GMT_DB.MAIN;
    if(!M||!M.url){return Promise.resolve([]);}
    const q=v=>'"'+String(v).replace(/"/g,'')+'"';
    const ors=[];
    if(prod.inv_id!=null&&prod.inv_id!=='')ors.push('id.eq.'+q(prod.inv_id));
    ors.push('store_url.like.'+q('*#product='+prod.id));
    const bc=String(prod.barcode||'').trim(); if(bc)ors.push('barcode.eq.'+q(bc));
    const url=M.url+'/rest/v1/products?select=id,image_url,images,store_url,barcode&or=('+encodeURIComponent(ors.join(','))+')&limit=5';
    return (_pmInvCache[key]=fetch(url,{headers:GMT_DB.headers(M)}).then(r=>r.ok?r.json():[]).then(rows=>{
        rows=Array.isArray(rows)?rows:[];
        const pick=rows.find(r=>prod.inv_id!=null&&String(r.id)===String(prod.inv_id))||
                   rows.find(r=>new RegExp('#product='+String(prod.id).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(&|$)').test(String(r.store_url||'')))||
                   (rows.filter(r=>bc&&String(r.barcode||'').trim()===bc).length===1?rows.find(r=>String(r.barcode||'').trim()===bc):null);
        if(!pick)return [];
        /* (TASK-0259) كل صور الجرد بترتيب الجرد — تُعرض بعد صور المتجر */
        const all=(Array.isArray(pick.images)&&pick.images.length?pick.images:[]).concat(pick.image_url||[]).map(String).filter(Boolean);
        return all.filter((u,i)=>all.indexOf(u)===i);
    }).catch(()=>[]));
}
function _updatePMSlider(){ const sc=document.getElementById('product-modal-slides'),dc=document.getElementById('product-modal-dots'); if(!sc)return; sc.style.transform=`translateX(${_pmIdx*100}%)`; const dots=dc?.children; if(dots)Array.from(dots).forEach((d,i)=>{d.style.background=i===_pmIdx?'#D5001C':'#d1d5db';d.style.width=i===_pmIdx?'18px':'6px';}); }
function _goToPMSlide(i){ _pmIdx=i; _updatePMSlider(); }

window.productModalSlide=function(dir){ const t=_pmImgs.length; if(!t)return; _pmIdx=(_pmIdx+dir+t)%t; _updatePMSlider(); };
window.productModalChangeQty=function(dir){ if(!_pmId)return; const prod=store.products.find(p=>String(p.id) === String(_pmId)); const rawStock=prod?.stock!==undefined?parseInt(prod.stock):0; const stock=(rawStock&&rawStock>0)?rawStock:9999; _pmQty=Math.min(Math.max(1,_pmQty+dir),stock); document.getElementById('product-qty-display').textContent=_pmQty; const pe=document.getElementById('product-modal-price'); if(pe){const bp=pe.dataset.selectedPrice?parseFloat(pe.dataset.selectedPrice):parseFloat(pe.dataset.basePrice||0); pe.textContent=`${CONFIG.CURRENCY}${(bp*_pmQty).toFixed(2)}`;} };

function productModalAddToCart(){
    if(!_pmId)return;
    const prod=store.products.find(p=>String(p.id) === String(_pmId)); if(!prod)return;
    const rawStock2=prod.stock!==undefined?parseInt(prod.stock):0;
    const stock=(rawStock2&&rawStock2>0)?rawStock2:9999;
    const pe=document.getElementById('product-modal-price');
    const up=pe?.dataset.selectedPrice?parseFloat(pe.dataset.selectedPrice):parseFloat(prod.price||0);
    const sv=_collectVariants();
    const vk=sv.map(v=>(v.name||v.value||'')+(v.barcode?' ‹'+v.barcode+'›':'')).join('|');
    const cid=_pmId+(vk?'__'+vk:'');
    const rq=_pmQty||1;
    const ex=store.cart.find(i=>i._cartId===cid);
    if(ex){ const nq=(ex.qty||1)+rq; ex.qty=Math.min(nq,stock); if(nq>stock)showToast(`الحد الأقصى (${stock})`,'error'); }
    else { store.cart.push({...prod,_cartId:cid,price:up,qty:Math.min(rq,stock),selectedVariants:sv.length?sv:undefined}); }
    localStorage.setItem('gmt_cart',JSON.stringify(store.cart));
    updateCartBadge();

    // [6] switch button to "view cart"
    const addBtn=document.getElementById('product-modal-add-btn');
    addBtn.innerHTML=`<i class="ph ph-shopping-bag text-lg"></i><span>عرض السلة</span>`;
    addBtn.className='w-full bg-dark text-white rounded-[10px] py-3.5 font-bold flex items-center justify-center gap-2 hover:bg-gray-800 transition-colors active:scale-[0.98]';
    // ④ close product first, then go to cart
    addBtn.onclick=()=>{ closeModal('product-modal'); setTimeout(()=>{ renderCartItems(); openModal('cart-modal'); }, 380); };
    showToast('تمت الإضافة للسلة ✓','success');
}
window.productModalAddToCart=productModalAddToCart;
window.openProductModal=openProductModal;

// ── Share product link ─────────────────────────
window.shareProduct = function() {
    if (!_pmId) return;
    const url = window.location.origin + window.location.pathname + '#product=' + encodeURIComponent(_pmId);
    if (navigator.share) {
        const prod = store.products.find(p => String(p.id) === String(_pmId));
        navigator.share({
            title: prod?.name || 'منتج من General Media Tech',
            text: prod?.name || '',
            url
        }).catch(() => _copyProductLink(url));
    } else {
        _copyProductLink(url);
    }
};

function _copyProductLink(url) {
    navigator.clipboard.writeText(url).then(() => {
        showToast('تم نسخ رابط المنتج ✓', 'success');
    }).catch(() => {
        // fallback
        const inp = document.createElement('input');
        inp.value = url; document.body.appendChild(inp);
        inp.select(); document.execCommand('copy');
        document.body.removeChild(inp);
        showToast('تم نسخ الرابط ✓', 'success');
    });
}

   💬 طلبك ٩٤ (2026-10-03): «زرّ واتساب المتجر برسالةٍ جاهزة».

   كان الزرّان يفتحان محادثةً **فارغة** — فالزبون يكتب «مرحبا» وينتظر، ولا
   تعرف أنت من أين جاء ولا ما يريد. الرسالة الجاهزة تحلّ الاثنين: تُعرّف
   بالمصدر (المتجر) وتُذكر المنتجَ الذي كان يتصفّحه إن كان في صفحة منتج،
   فتردّ عليه وأنت تعرف سياقه.
   ══════════════════════════════════════════════════════════════════════════ */
function storeWaGreeting(){
    let ctx = '';
    try {
        /* إن كان يتصفّح منتجاً الآن (رابطٌ مباشر أو نافذةُ منتجٍ مفتوحة) */
        const id = (location.hash.match(/product=([^&]+)/) || [])[1] || (typeof _pmId !== 'undefined' ? _pmId : '');
        if (id) {
            const prod = (store.products || []).find(p => String(p.id) === String(decodeURIComponent(id)));
            if (prod && prod.name) ctx = '\nبخصوص: ' + prod.name;
        }
    } catch(e) {}
    return 'مرحباً، أتواصل معكم من متجر مجموعة ميديا تيك التجارية.' + ctx;
}

window.onGovChange = function(gov){
    const branchWrap = document.getElementById('branch-dropdown-wrap');
    const branchSelect = document.getElementById('cust-branch-select');
    const addressInput = document.getElementById('cust-address');
    if(!gov || !branchWrap || !branchSelect) return;
    
    // Get branches for this province from store data
    const branches = (store.branches || []).filter(b => b.province === gov);
    
    // Rebuild dropdown
    branchSelect.innerHTML = '<option value="">اختر فرعاً...</option>';
    branches.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b.name; opt.textContent = b.name;
        branchSelect.appendChild(opt);
    });
    // Always add manual/home/main options
    branchSelect.innerHTML += `<option value="__manual__">إدخال يدوي</option><option value="__home__">توصيل للمنزل</option><option value="__main__">الفرع الرئيسي</option>`;
    
    branchWrap.classList.remove('hidden');
    if(addressInput) { addressInput.value = ''; addressInput.classList.add('hidden'); }
};

window.onBranchSelect = function(val){
    const addressInput = document.getElementById('cust-address');
    if(!addressInput) return;
    if(val === '__manual__'){
        addressInput.classList.remove('hidden');
        addressInput.value = '';
        addressInput.placeholder = 'أدخل الفرع أو المنطقة يدوياً';
        addressInput.focus();
    } else if(val === '__home__'){
        addressInput.classList.remove('hidden');
        addressInput.value = 'توصيل للمنزل';
    } else if(val === '__main__'){
        addressInput.classList.remove('hidden');
        addressInput.value = 'الفرع الرئيسي';
    } else if(val) {
        addressInput.classList.remove('hidden');
        addressInput.value = val;
    } else {
        addressInput.classList.add('hidden');
        addressInput.value = '';
    }
};

function openOffersModal(){
    const offers = store.offers || [];
    let modal = document.getElementById('offers-modal');
    if(!modal){
        modal = document.createElement('div');
        modal.id = 'offers-modal';
        modal.className = 'modal-overlay';
        modal.innerHTML = `<div class="modal-sheet">
            <div class="flex-shrink-0 px-5 pt-5 pb-3 flex justify-between items-center border-b border-gray-100">
                <h3 class="font-bold text-lg flex items-center gap-2"><i class="ph-fill ph-seal-percent text-primary"></i> العروض الحالية</h3>
                <button onclick="closeModal('offers-modal')" class="w-8 h-8 rounded-full bg-light flex items-center justify-center text-gray-500"><i class="ph ph-x text-base"></i></button>
            </div>
            <div id="offers-list-content" class="flex-1 overflow-y-auto hide-scrollbar px-4 py-4"></div>
        </div>`;
        document.getElementById('dynamic-modals-container').appendChild(modal);
    }
    
    const content = document.getElementById('offers-list-content');
    const now = new Date();
    
    if(!offers.length){
        content.innerHTML = '<div class="text-center py-16 text-gray-400"><i class="ph ph-tag text-5xl block mb-3 opacity-30"></i><p class="text-sm font-medium">لا توجد عروض حالياً</p><p class="text-xs mt-1">تابعنا لمعرفة أحدث العروض!</p></div>';
    } else {
        content.innerHTML = '';
        offers.forEach(offer => {
            const isExpired = offer.end_date && new Date(offer.end_date) < now;
            const daysLeft = offer.end_date ? Math.ceil((new Date(offer.end_date)-now)/(1000*60*60*24)) : null;
            const card = document.createElement('div');
            card.className = 'offer-card' + (isExpired?' offer-expired':'');
            card.onclick = () => { closeModal('offers-modal'); setTimeout(()=>openOfferDetail(offer),200); };
            card.innerHTML = `
            <div style="position:relative;">
                ${offer.images?.[0]||offer.image ? `<img src="${offer.images?.[0]||offer.image}" style="width:100%;height:180px;object-fit:cover;display:block;">` : 
                  '<div style="width:100%;height:180px;background:linear-gradient(135deg,#D5001C,#ff4d6d);display:flex;align-items:center;justify-content:center;"><i class="ph ph-tag" style="font-size:48px;color:rgba(255,255,255,0.5);"></i></div>'}
                <div class="offer-badge">${isExpired?'انتهى':daysLeft!==null&&daysLeft<=3?`آخر ${daysLeft} أيام`:'عرض خاص'}</div>
            </div>
            <div style="padding:14px;">
                <h4 style="font-size:15px;font-weight:700;color:#111;margin:0 0 6px;">${offer.title||'عرض مميز'}</h4>
                ${offer.description?`<p style="font-size:12.5px;color:#666;line-height:1.6;margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${offer.description}</p>`:''}
                <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:#5b6472;">
                    <i class="ph ph-calendar-blank"></i>
                    <span>${offer.end_date?`ينتهي: ${new Date(offer.end_date).toLocaleDateString('ar-EG')}`:'عرض مستمر'}</span>
                </div>
            </div>`;
            content.appendChild(card);
        });
    }
    openModal('offers-modal');
}

function showToast(msg,type='success'){
    const ex=document.getElementById('gmt-toast'); if(ex)ex.remove();
    const t=document.createElement('div'); t.id='gmt-toast';
    t.className=`fixed top-20 left-1/2 transform -translate-x-1/2 z-[300] ${type==='success'?'bg-gray-900':'bg-red-600'} text-white text-sm font-medium px-5 py-3 rounded-full shadow-lg transition-all duration-300 opacity-0`;
    t.textContent=msg; document.body.appendChild(t);
    requestAnimationFrame(()=>{t.style.opacity='1';});
    setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300);},2500);
}

// INTRO
// ══════════════════════════════════════════════
const _INTRO_MIN_MS=3200;
let _introStart=0, _contentReady=false;

function _tryCloseIntro(){
    if(!_contentReady)return;
    const elapsed=Date.now()-_introStart;
    const wait=Math.max(0,_INTRO_MIN_MS-elapsed);
    setTimeout(_doCloseIntro,wait);
}
function _doCloseIntro(){
    const imgs=Array.from(document.querySelectorAll('img:not(#intro-screen img)'));
    const pending=imgs.filter(img=>!img.complete||img.naturalWidth===0);
    function _closeAll(){ const scr=document.getElementById('intro-screen'); if(scr){scr.classList.add('hide');setTimeout(()=>{if(scr.parentNode)scr.remove();},850);} }
    if(!pending.length){_closeAll();return;}
    let resolved=0;
    const timeout=setTimeout(_closeAll,5000);
    pending.forEach(img=>{const finish=()=>{resolved++;if(resolved>=pending.length){clearTimeout(timeout);_closeAll();}};img.addEventListener('load',finish,{once:true});img.addEventListener('error',finish,{once:true});});
}


// ══════════════════════════════════════════════
// NOTIFICATION SYSTEM
// ══════════════════════════════════════════════
function initNotifications(){ _notifPlace(document.getElementById('notif-slot')); }
function _notifEligible(){
    try {
        if(!('Notification' in window) || !('serviceWorker' in navigator)) return false;
        if(Notification.permission!=='default') return false;      // منحه أو رفضه من قبل — لا نسأل ثانيةً
        return !localStorage.getItem('gmt_notif_dismissed');
    } catch(e){ return false; }
}
function _notifPlace(content){
    // مرجعٌ محفوظ: إعادة رسم القائمة (innerHTML) تفصل البطاقة عن الصفحة، فلا يجدها getElementById في المرّة التالية
    const prompt = window._notifEl = window._notifEl || document.getElementById('notif-prompt');
    if(!prompt || !content) return;
    if(!_notifEligible()){ prompt.classList.remove('show'); return; }
    content.prepend(prompt); prompt.classList.add('show');
}

window.requestNotifPermission = async function(){
    dismissNotifPrompt();
    if(!('Notification' in window)) return;
    try {
        const perm = await Notification.requestPermission();
        if(perm==='granted'){
            showToast('سيتم إرسال إشعارات العروض ✓','success');
            localStorage.setItem('gmt_notif_granted','1');
        }
    } catch(e){ console.warn('Notifications not supported'); }
};

window.dismissNotifPrompt = function(){
    const prompt=window._notifEl||document.getElementById('notif-prompt');
    if(prompt){ prompt.classList.remove('show'); }
    localStorage.setItem('gmt_notif_dismissed','1');
};

function sendLocalNotification(title, body){
    if(Notification.permission!=='granted') return;
    try { new Notification(title,{body,icon:'logo.jpg',badge:'logo.jpg'}); }
    catch(e){ console.warn('Notif error',e); }
}
